
name: RUBALIA NETWORK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Install Android Dependencies
      - name: Install Android Dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      # 5. Prepare Website Files
      - name: Prepare Website Files
        working-directory: android-app
        run: npm run build

      # 6. Verify Splash Screen
      - name: Check Android Splash Screen
        run: test -s android-app/www/index.html

      # 7. Verify App Icon
      - name: Verify App Icon
        run: test -s android-app/assets/icon.png

      # 8. Add Android Platform
      - name: Add Android Platform
        working-directory: android-app
        run: npx cap add android

      # 9. Generate RUBALIA App Icon
      - name: Generate RUBALIA App Icon
        working-directory: android-app
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor '#210d45' \
            --iconBackgroundColorDark '#210d45' \
            --splashBackgroundColor '#210d45'

      # 10. Sync Capacitor
      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      # 11. Build Debug APK with Retry
      - name: Build Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew

          for attempt in 1 2 3 4; do
            echo "Android Build Attempt: $attempt"

            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              echo "APK Build Successful!"
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              WAIT_TIME=$((attempt * 45))
              echo "Build failed. Waiting ${WAIT_TIME} seconds before retry..."
              sleep "$WAIT_TIME"
            fi
          done

          echo "APK Build failed after 4 attempts."
          exit 1

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUBALIA-NETWORK-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
