
      - name: Build Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew

          for attempt in 1 2 3 4; do
            echo "Android Build Attempt: $attempt"

            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              echo "APK Build Successful!"
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              WAIT_TIME=$((attempt * 45))
              echo "Build failed. Waiting ${WAIT_TIME} seconds before retry..."
              sleep "$WAIT_TIME"
            fi
          done

          echo "APK Build failed after 4 attempts."
          exit 1
