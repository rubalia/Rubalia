
name: RUBALIA NETWORK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android Dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Prepare Website Files
        working-directory: android-app
        run: npm run build

      - name: Check Android Splash Screen
        run: test -f android-app/www/index.html

      - name: Add Android Platform
        working-directory: android-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUBALIA-NETWORK-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
