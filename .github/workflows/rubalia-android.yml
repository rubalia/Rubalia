
name: RUBALIA NETWORK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/rubalia-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Rubalia Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Website
        run: test -s www/index.html

      - name: Verify Firebase Configuration
        run: |
          test -s google-services.json
          node -e "
          const f=require('./google-services.json');
          if(f.client[0].client_info.android_client_info.package_name !== 'com.rubalia.network') process.exit(1);
          console.log('Firebase config verified');
          "

      - name: Verify App Icon
        run: test -s assets/icon.png

      - name: Add Android Platform
        run: npx cap add android

      - name: Copy Firebase Configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Generate Android Icons
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#071a35" \
            --iconBackgroundColorDark "#071a35" \
            --splashBackgroundColor "#071a35" \
            --splashBackgroundColorDark "#071a35"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Firebase File
        run: test -s android/app/google-services.json

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Prepare APK
        working-directory: android-app
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rubalia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUBALIA-NETWORK-Android-APK
          path: android-app/Rubalia.apk
          if-no-files-found: error
          retention-days: 30
