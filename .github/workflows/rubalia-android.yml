
name: Build Rubalia Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/rubalia-android.yml"
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Check Rubalia icon
        run: |
          test -f assets/icon.png
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("assets/icon.png")
          print("Rubalia source icon:", image.size)
          if image.width < 1024 or image.height < 1024:
              raise SystemExit("Icon must be at least 1024x1024")
          PY

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Rubalia Android icons
        run: >
          npx --yes @capacitor/assets generate
          --android
          --assetPath assets
          --iconBackgroundColor "#071a35"
          --iconBackgroundColorDark "#071a35"
          --splashBackgroundColor "#071a35"
          --splashBackgroundColorDark "#071a35"

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        working-directory: android-app
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rubalia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rubalia-Android-APK
          path: android-app/Rubalia.apk
          retention-days: 30
