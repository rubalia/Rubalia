
name: Build Rubalia Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/rubalia-android.yml"
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        working-directory: android-app
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rubalia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rubalia-Android-APK
          path: android-app/Rubalia.apk
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/Rubalia.apk
          name: Rubalia ${{ github.ref_name }}
          generate_release_notes: true
