
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b1748">
<meta name="description" content="Create your RUBALIA NETWORK member account.">
<meta name="robots" content="noindex,nofollow">
<title>Create Account | RUBALIA NETWORK</title>

<style>
:root{
  --red:#d60045;
  --dark:#78113d;
  --gold:#e8bd65;
  --text:#25213a;
  --muted:#888397;
  --border:#e8e4ed;
  --green:#16804b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  padding:25px 15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 15%,rgba(255,190,80,.85),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(255,70,150,.65),transparent 32%),
    radial-gradient(circle at 15% 90%,rgba(95,75,220,.65),transparent 35%),
    radial-gradient(circle at 90% 85%,rgba(0,190,190,.55),transparent 32%),
    linear-gradient(135deg,#f7d6e5,#e7ddff,#d7f5f1);
  background-size:200% 200%;
  animation:backgroundMove 12s ease infinite;
}

@keyframes backgroundMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{
  width:100%;
  max-width:430px;
  padding:35px 30px;
  border-radius:25px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 25px 70px rgba(45,20,65,.20);
  backdrop-filter:blur(15px);
  animation:cardAppear .6s ease;
}

@keyframes cardAppear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* LOGO */

.brand{
  text-align:center;
  margin-bottom:27px;
}

.logo{
  width:72px;
  height:72px;
  margin:0 auto 14px;
  position:relative;
  display:grid;
  place-items:center;
  border-radius:22px;
  color:white;
  font-size:38px;
  font-weight:900;
  background:linear-gradient(145deg,#ed286a,#76123e);
  box-shadow:0 9px 20px rgba(170,25,85,.30);
  overflow:hidden;
}

.logo:before{
  content:"";
  position:absolute;
  width:39px;
  height:39px;
  border:2px solid rgba(255,225,155,.9);
  transform:rotate(45deg);
  border-radius:8px;
}

.logo span{
  position:relative;
  z-index:1;
  text-shadow:0 2px 4px rgba(0,0,0,.2);
}

.brand h1{
  font-size:23px;
  letter-spacing:2px;
  color:#80133f;
  font-weight:900;
}

.brand h1 span{
  color:#b18a43;
}

.brand p{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:3px;
  font-weight:bold;
}

/* HEADING */

.heading{
  text-align:center;
  margin-bottom:25px;
}

.heading small{
  color:#b18a43;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.heading h2{
  font-size:27px;
  color:#30233e;
  margin:9px 0;
}

.heading p{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

/* INPUTS */

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#40334d;
  margin-bottom:8px;
}

.required{
  color:#d60045;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:51px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  background:#faf9fc;
  color:#30233e;
  font-size:13px;
  font-family:inherit;
  transition:.25s;
}

.input-wrap input:focus{
  border-color:#c34b80;
  background:white;
  box-shadow:0 0 0 4px rgba(214,0,69,.08);
}

.input-wrap input::placeholder{
  color:#aaa4b4;
}

.password-wrap input{
  padding-right:75px;
}

.show-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#a13c68;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  padding:8px;
}

/* STRENGTH */

.password-strength{
  display:none;
  margin-top:9px;
}

.strength-track{
  height:5px;
  border-radius:10px;
  background:#eeeaf1;
  overflow:hidden;
}

.strength-bar{
  width:0;
  height:100%;
  border-radius:10px;
  transition:.25s;
}

.strength-text{
  margin-top:6px;
  font-size:10px;
  color:var(--muted);
}

/* TERMS */

.terms{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin:20px 0;
  color:#777183;
  font-size:11px;
  line-height:1.7;
}

.terms input{
  width:17px;
  height:17px;
  flex-shrink:0;
  margin-top:2px;
  accent-color:#a51c55;
}

.terms a{
  color:#a51c55;
  font-weight:bold;
  text-decoration:underline;
}

/* BUTTON */

.submit-btn{
  width:100%;
  min-height:53px;
  border:0;
  border-radius:12px;
  background:linear-gradient(110deg,#ed286a,#9b164f,#d9a94d);
  background-size:200% 100%;
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(180,25,90,.23);
  transition:.25s;
}

.submit-btn:hover{
  background-position:100% 0;
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(180,25,90,.30);
}

.submit-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* MESSAGE */

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.message.error{
  display:block;
  color:#a12b36;
  background:#fff0f1;
  border:1px solid #f4cbd0;
}

.message.success{
  display:block;
  color:#17633b;
  background:#effaf3;
  border:1px solid #c6ead2;
}

/* LOGIN */

.login-link{
  margin-top:23px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.login-link a{
  color:#a51c55;
  font-weight:900;
  text-decoration:none;
}

.login-link a:hover{
  text-decoration:underline;
}

@media(max-width:480px){
  body{
    padding:18px 12px;
  }

  .container{
    padding:30px 22px;
    border-radius:21px;
  }

  .logo{
    width:65px;
    height:65px;
    font-size:34px;
  }

  .heading h2{
    font-size:25px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="brand">
    <div class="logo"><span>R</span></div>
    <h1>RUBALIA <span>NETWORK</span></h1>
    <p>GROW WITH TRUST</p>
  </div>

  <div class="heading">
    <small>MEMBER REGISTRATION</small>
    <h2>Create Account</h2>
    <p>Enter your details to create your member account.</p>
  </div>

  <form id="registerForm" novalidate>

    <div class="form-group">
      <label for="fullName">
        Full Name <span class="required">*</span>
      </label>
      <div class="input-wrap">
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          minlength="2"
          maxlength="120"
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">
        Email Address <span class="required">*</span>
      </label>
      <div class="input-wrap">
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="email"
          maxlength="255"
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="password">
        Password <span class="required">*</span>
      </label>

      <div class="input-wrap password-wrap">
        <input
          type="password"
          id="password"
          placeholder="Create password (8–72 characters)"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required>

        <button
          type="button"
          class="show-btn"
          data-target="password">SHOW</button>
      </div>

      <div class="password-strength" id="passwordStrength">
        <div class="strength-track">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">
        Confirm Password <span class="required">*</span>
      </label>

      <div class="input-wrap password-wrap">
        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter password again"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required>

        <button
          type="button"
          class="show-btn"
          data-target="confirmPassword">SHOW</button>
      </div>
    </div>

    <label class="terms">
      <input type="checkbox" id="terms" required>
      <span>
        I agree to the RUBALIA NETWORK
        <a href="terms.html" target="_blank" rel="noopener">
          Terms &amp; Conditions
        </a>
        and understand that registration does not guarantee any income.
      </span>
    </label>

    <button type="submit" class="submit-btn" id="submitBtn">
      CREATE ACCOUNT
    </button>

    <div
      id="formMessage"
      class="message"
      role="status"
      aria-live="polite">
    </div>

  </form>

  <div class="login-link">
    Already have an account?
    <a href="login.html">Login Here</a>
  </div>

</main>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

const form = document.getElementById("registerForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("formMessage");

const fullNameInput = document.getElementById("fullName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const termsInput = document.getElementById("terms");

const strengthBox = document.getElementById("passwordStrength");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

/* SHOW / HIDE PASSWORD */

document.querySelectorAll(".show-btn").forEach(function(button){
  button.addEventListener("click",function(){
    const field = document.getElementById(button.dataset.target);
    const isHidden = field.type === "password";

    field.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "HIDE" : "SHOW";
  });
});

/* MESSAGE */

function showMessage(type,text){
  message.className = "message " + type;
  message.textContent = text;
}

/* PASSWORD STRENGTH */

passwordInput.addEventListener("input",function(){
  const password = passwordInput.value;

  if(!password){
    strengthBox.style.display = "none";
    strengthBar.style.width = "0";
    strengthText.textContent = "";
    return;
  }

  strengthBox.style.display = "block";

  let score = 0;

  if(password.length >= 8) score++;
  if(/[a-z]/.test(password)) score++;
  if(/[A-Z]/.test(password)) score++;
  if(/[0-9]/.test(password)) score++;
  if(/[^a-zA-Z0-9]/.test(password)) score++;

  let label = "Weak";
  let color = "#d64b4b";

  if(score >= 4){
    label = "Strong";
    color = "#16804b";
  }else if(score >= 3){
    label = "Good";
    color = "#c58b28";
  }else if(score >= 2){
    label = "Fair";
    color = "#d18a35";
  }

  strengthBar.style.width = (score * 20) + "%";
  strengthBar.style.background = color;
  strengthText.textContent = "Password strength: " + label;
});

/* CLEAR ERROR */

[
  fullNameInput,
  emailInput,
  passwordInput,
  confirmPasswordInput
].forEach(function(field){
  field.addEventListener("input",function(){
    if(message.classList.contains("error")){
      message.className = "message";
      message.textContent = "";
    }
  });
});

/* REGISTRATION */

form.addEventListener("submit",async function(event){
  event.preventDefault();

  const fullName = fullNameInput.value.trim();
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if(fullName.length < 2){
    showMessage("error","Please enter your full name.");
    fullNameInput.focus();
    return;
  }

  if(!emailInput.checkValidity()){
    showMessage("error","Please enter a valid email address.");
    emailInput.focus();
    return;
  }

  if(password.length < 8 || password.length > 72){
    showMessage("error","Password must contain 8 to 72 characters.");
    passwordInput.focus();
    return;
  }

  if(password !== confirmPassword){
    showMessage("error","Passwords do not match.");
    confirmPasswordInput.focus();
    return;
  }

  if(!termsInput.checked){
    showMessage("error","Please accept the Terms & Conditions.");
    termsInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "CREATING ACCOUNT...";

  message.className = "message";
  message.textContent = "";

  try{
    const response = await fetch(API_BASE + "/auth/register",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        fullName:fullName,
        email:email,
        password:password
      })
    });

    const data = await response.json().catch(function(){
      return {};
    });

    if(!response.ok || !data.success){
      throw new Error(
        data.message || "Registration failed. Please try again."
      );
    }

    if(!data.token || !data.user){
      throw new Error(
        "Account was created, but the login session could not be verified. Please try logging in."
      );
    }

    /* TEMPORARY SESSION */

    try{
      sessionStorage.setItem("rubalia_token",data.token);
      sessionStorage.setItem(
        "rubalia_user",
        JSON.stringify(data.user)
      );
    }catch(storageError){
      throw new Error(
        "Browser session storage is unavailable. Please enable it and try again."
      );
    }

    showMessage(
      "success",
      "Your account has been created successfully. Redirecting..."
    );

    form.reset();

    strengthBox.style.display = "none";
    strengthBar.style.width = "0";

    submitBtn.textContent = "ACCOUNT CREATED";

    window.setTimeout(function(){
      window.location.href = "dashboard.html";
    },1200);

  }catch(error){
    showMessage(
      "error",
      error.message || "Unable to complete registration. Please try again."
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "CREATE ACCOUNT";
  }
});
</script>

</body>
</html>
