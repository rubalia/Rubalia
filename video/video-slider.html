
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b36">
<title>RUBALIA Banner Slider</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 min-height:0;
 overflow:hidden;
 background:#071b36;
 font-family:Arial,sans-serif;
}

.slider{
 position:relative;
 display:block;
 width:100%;
 height:100%;
 min-height:0;
 max-height:100%;
 overflow:hidden;
 border-radius:0;
 background:#071b36;
 isolation:isolate;
}

/* All banners occupy exactly the same area */
.frame{
 position:absolute;
 top:0;
 left:0;
 display:block;
 width:100%;
 height:100%;
 min-width:100%;
 min-height:100%;
 max-width:100%;
 max-height:100%;
 margin:0;
 padding:0;
 border:0;
 outline:0;
 overflow:hidden;
 background:#071b36;

 opacity:0;
 visibility:hidden;
 pointer-events:none;

 transition:opacity .35s ease;
}

.frame.active{
 opacity:1;
 visibility:visible;
 pointer-events:auto;
 z-index:2;
}

@media(max-width:500px){
 .slider{border-radius:0}
}
</style>
</head>

<body>

<div class="slider" id="slider"
     aria-label="RUBALIA banner slider"></div>

<script>
"use strict";

/* Banner HTML files */
const banners = [
 "buy.html",
 "diposit.html",
 "reffer.html",
 "welcome.html"
];

/* 4 seconds */
const SLIDE_TIME = 4000;

const slider = document.getElementById("slider");

let currentIndex = 0;
let timer = null;
let frames = [];

/* Create all banner frames */
function createBanners(){

 slider.replaceChildren();
 frames = [];

 banners.forEach((file,index)=>{

  const frame = document.createElement("iframe");

  frame.className = "frame";
  frame.src = file;
  frame.title = "RUBALIA Banner " + (index + 1);

  frame.loading = "eager";
  frame.setAttribute("scrolling","no");
  frame.setAttribute("frameborder","0");

  /*
   * Keep banner scripts working.
   * Prevent navigation of the parent page.
   */
  frame.setAttribute(
   "sandbox",
   "allow-scripts allow-same-origin"
  );

  frame.addEventListener("load",()=>{
   frame.dataset.loaded = "true";
  });

  frame.addEventListener("error",()=>{
   console.error("Unable to load banner:",file);
  });

  frames.push(frame);
  slider.appendChild(frame);
 });

 showBanner(0);
 startSlider();
}

/* Show banner in the same fixed position */
function showBanner(index){

 if(!frames.length)return;

 currentIndex = (index + frames.length) % frames.length;

 frames.forEach((frame,i)=>{

  const active = i === currentIndex;

  frame.classList.toggle("active",active);

  frame.setAttribute(
   "aria-hidden",
   active ? "false" : "true"
  );

  frame.style.zIndex = active ? "2" : "1";
 });
}

/* Next banner */
function nextBanner(){

 if(frames.length <= 1)return;

 showBanner(currentIndex + 1);
}

/* Start automatic slider */
function startSlider(){

 stopSlider();

 if(document.hidden || frames.length <= 1)return;

 timer = setInterval(nextBanner,SLIDE_TIME);
}

/* Stop automatic slider */
function stopSlider(){

 if(timer !== null){
  clearInterval(timer);
  timer = null;
 }
}

/* Pause when tab is hidden */
document.addEventListener("visibilitychange",()=>{

 if(document.hidden){
  stopSlider();
 }else{
  startSlider();
 }
});

/* Initialize */
createBanners();

</script>

</body>
</html>
