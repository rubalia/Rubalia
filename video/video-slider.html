<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b36">
<title>RUBALIA Banner Slider</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;
 background:#071b36;font-family:Arial,sans-serif
}
.slider{
 position:relative;display:block;width:100%;height:100%;
 min-width:0;min-height:0;max-width:100%;max-height:100%;
 overflow:hidden;border:0;border-radius:0;padding:0;margin:0;
 background:#071b36;isolation:isolate
}
.frame{
 position:absolute;top:0;left:0;display:block;width:100%;height:100%;
 min-width:0;min-height:0;max-width:100%;max-height:100%;
 margin:0;padding:0;border:0;outline:0;overflow:hidden;
 background:#071b36;opacity:0;visibility:hidden;pointer-events:none;
 transition:opacity .35s ease
}
.frame.active{
 opacity:1;visibility:visible;pointer-events:auto;z-index:2
}
@media(max-width:700px){
 html,body,.slider{width:100%;height:100%;min-height:0;max-height:100%;overflow:hidden}
 .frame{width:100%;height:100%;min-height:0;max-height:100%}
}
</style>
</head>
<body>
<div class="slider" id="slider" aria-label="RUBALIA banner slider"></div>

<script>
"use strict";

/* Banner HTML files */
const banners=[
 {file:"buy.html",title:"প্রোডাক্ট কীভাবে ক্রয় করবেন"},
 {file:"diposit.html",title:"ডিপোজিট কীভাবে করবেন"},
 {file:"reffer.html",title:"রেফার কীভাবে করবেন"},
 {file:"welcome.html",title:"RUBALIA Welcome"}
];
const SLIDE_TIME=4000;
const slider=document.getElementById("slider");
let currentIndex=0;
let timer=null;
let frames=[];

function readYouTubeURL(doc){
 try{
  const scripts=Array.from(doc.querySelectorAll("script"));
  for(const script of scripts){
   const match=script.textContent.match(
    /\bYOUTUBE_URL\s*=\s*["']([^"']*)["']/
   );
   if(match)return match[1].trim();
  }
 }catch(error){}
 return "";
}

/* Relay a banner click upward; the video popup is owned by dashboard.html. */
function connectBannerDocument(frame,banner){
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.body||frame.dataset.clickRelay==="true")return;
  frame.dataset.clickRelay="true";

  doc.addEventListener("click",event=>{
   const target=event.target;
   if(!target||typeof target.closest!=="function")return;
   const clickable=target.closest("button,a,[role='button'],.deposit-banner");
   if(!clickable)return;

   event.preventDefault();
   event.stopPropagation();
   if(typeof event.stopImmediatePropagation==="function"){
    event.stopImmediatePropagation();
   }

   const videoURL=readYouTubeURL(doc);
   window.parent.postMessage({
    type:"RUBALIA_OPEN_VIDEO",
    title:banner.title,
    url:videoURL
   },location.origin);
  },true);
 }catch(error){
  console.warn("Banner click relay could not attach:",banner.file,error);
 }
}

function createBanners(){
 slider.replaceChildren();
 frames=[];
 banners.forEach((banner,index)=>{
  const frame=document.createElement("iframe");
  frame.className="frame";
  frame.src=banner.file;
  frame.title=banner.title;
  frame.loading="eager";
  frame.setAttribute("scrolling","no");
  frame.setAttribute("frameborder","0");
  frame.setAttribute("sandbox","allow-scripts allow-same-origin");
  frame.addEventListener("load",()=>{
   connectBannerDocument(frame,banner);
  });
  frame.addEventListener("error",()=>{
   console.error("Unable to load banner:",banner.file);
  });
  frames.push(frame);
  slider.appendChild(frame);
 });
 showBanner(0);
 startSlider();
}

function showBanner(index){
 if(!frames.length)return;
 currentIndex=(index+frames.length)%frames.length;
 frames.forEach((frame,i)=>{
  const active=i===currentIndex;
  frame.classList.toggle("active",active);
  frame.setAttribute("aria-hidden",active?"false":"true");
  frame.style.zIndex=active?"2":"1";
 });
}
function nextBanner(){
 if(frames.length<=1)return;
 showBanner(currentIndex+1);
}
function startSlider(){
 stopSlider();
 if(document.hidden||frames.length<=1)return;
 timer=setInterval(nextBanner,SLIDE_TIME);
}
function stopSlider(){
 if(timer!==null){clearInterval(timer);timer=null}
}
document.addEventListener("visibilitychange",()=>{
 if(document.hidden)stopSlider();
 else startSlider();
});

/* Receive only messages from the currently displayed banner iframe. */
window.addEventListener("message",event=>{
 if(event.origin!==location.origin)return;
 const data=event.data;
 if(!data||data.type!=="RUBALIA_OPEN_VIDEO")return;
 const sourceFrame=frames.find(frame=>frame.contentWindow===event.source);
 if(!sourceFrame)return;
 window.parent.postMessage({
  type:"RUBALIA_OPEN_VIDEO",
  title:String(data.title||"RUBALIA Video Guide").slice(0,100),
  url:typeof data.url==="string"?data.url:""
 },location.origin);
});

createBanners();
</script>
</body>
</html>
