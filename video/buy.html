<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b36">
<title>RUBALIA - Product Purchase Guide</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;min-height:0;overflow:hidden;
  background:transparent;font-family:Arial,Helvetica,sans-serif;
}
.buy-banner{
  display:block;width:100%;height:100%;min-height:0;
  aspect-ratio:auto;overflow:hidden;
  border:0;padding:0;background:transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.buy-banner svg{display:block;width:100%;height:100%}
.buy-banner:focus-visible{outline:2px solid #d6ad55;outline-offset:3px}

/* Video popup */
.video-modal{
 position:fixed;inset:0;z-index:99999;
 display:none;align-items:center;justify-content:center;
 padding:16px;
 background:rgba(0,0,0,.88);
}
.video-modal.open{display:flex}
.modal-panel{
 position:relative;width:min(920px,100%);
 background:#071b36;border:1px solid #d6ad55;
 border-radius:14px;overflow:hidden;
 box-shadow:0 15px 55px #000a;
}
.modal-head{
 min-height:48px;padding:10px 54px 10px 14px;
 display:flex;align-items:center;
 color:#ffe6a3;font-size:14px;font-weight:800;
 background:linear-gradient(110deg,#071b36,#173b65);
}
.close-modal{
 position:absolute;right:9px;top:7px;
 width:34px;height:34px;border:1px solid #d6ad55;
 border-radius:50%;background:#172e4d;color:#fff;
 font-size:23px;line-height:1;cursor:pointer;
}
.video-area{
 width:100%;aspect-ratio:16/9;
 display:flex;align-items:center;justify-content:center;
 background:#000;color:#ffe6a3;text-align:center;
 padding:20px;font-size:14px;line-height:1.6;
}
.video-area iframe{
 display:block;width:100%;height:100%;border:0;
}
body.modal-open{overflow:hidden}
@media(max-width:500px){
 .video-modal{padding:10px}
 .modal-panel{border-radius:10px}
 .modal-head{min-height:42px;font-size:12px}
}
</style>
</head>

  <div class="video-area" id="videoArea">
   ভিডিও লিংক এখনো যোগ করা হয়নি। পরে নিচের JavaScript-এ YouTube লিংক বসালেই এখানে ভিডিও চলবে।
  </div>
 </div>
</div>

<script>
"use strict";

/* পরে এখানে YouTube ভিডিওর লিংক বসাবেন */
const YOUTUBE_URL = "";

/* Convert supported YouTube URLs to an embed URL */
function getYouTubeEmbedURL(value){
 if(!value) return "";
 try{
  const url = new URL(value);
  const host = url.hostname.replace(/^www\./,"").toLowerCase();
  let id = "";

  if(host === "youtu.be"){
   id = url.pathname.split("/").filter(Boolean)[0] || "";
  }else if(
   host === "youtube.com" ||
   host === "m.youtube.com" ||
   host === "youtube-nocookie.com"
  ){
   if(url.pathname === "/watch"){
    id = url.searchParams.get("v") || "";
   }else{
    const parts = url.pathname.split("/").filter(Boolean);
    if(["embed","shorts","live"].includes(parts[0])) id = parts[1] || "";
   }
  }

  if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return "";
  return "https://www.youtube-nocookie.com/embed/" +
         encodeURIComponent(id) +
         "?autoplay=1&playsinline=1&rel=0";
 }catch(error){
  return "";
 }
}

const modal = document.getElementById("videoModal");
const videoArea = document.getElementById("videoArea");
const banner = document.getElementById("buyBanner");
const closeButton = document.getElementById("closeModal");

function openVideoPopup(){
 const embedURL = getYouTubeEmbedURL(YOUTUBE_URL);

 modal.classList.add("open");
 modal.setAttribute("aria-hidden","false");
 document.body.classList.add("modal-open");

 if(embedURL){
  const iframe = document.createElement("iframe");
  iframe.src = embedURL;
  iframe.title = "RUBALIA Product Purchase Guide";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.allowFullscreen = true;
  videoArea.replaceChildren(iframe);
 }else{
  videoArea.textContent =
   "ভিডিও লিংক এখনো যোগ করা হয়নি। পরে YOUTUBE_URL-এ YouTube লিংক বসালেই এখানে ভিডিও চলবে।";
 }
}

function closeVideoPopup(){
 modal.classList.remove("open");
 modal.setAttribute("aria-hidden","true");
 document.body.classList.remove("modal-open");
 videoArea.replaceChildren();
 videoArea.textContent =
  "ভিডিও লিংক এখনো যোগ করা হয়নি। পরে YOUTUBE_URL-এ YouTube লিংক বসালেই এখানে ভিডিও চলবে।";
}

banner.addEventListener("click",openVideoPopup);
closeButton.addEventListener("click",closeVideoPopup);

modal.addEventListener("click",event=>{
 if(event.target === modal) closeVideoPopup();
});

document.addEventListener("keydown",event=>{
 if(event.key === "Escape" && modal.classList.contains("open")){
  closeVideoPopup();
 }
});
</script>

</body>
</html>
