
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#710018">
<meta name="description" content="RUBALIA NETWORK Login">
<title>Login | RUBALIA NETWORK</title>

<style>
:root{
  --red:#d60025;
  --dark:#710018;
  --gold:#ffd36a;
  --white:#fff;
  --muted:#77717c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow-x:hidden;
  overflow-y:auto;
  perspective:1200px;
  background:
    radial-gradient(circle at 10% 15%,#ffb33d 0%,transparent 30%),
    radial-gradient(circle at 90% 15%,#ff3c76 0%,transparent 32%),
    radial-gradient(circle at 15% 90%,#7939e9 0%,transparent 35%),
    radial-gradient(circle at 90% 90%,#00b8bd 0%,transparent 35%),
    linear-gradient(135deg,#260020,#a50030,#280047);
  background-size:200% 200%;
  animation:backgroundMove 16s ease infinite;
}

@keyframes backgroundMove{
  0%{background-position:0% 0%;}
  50%{background-position:100% 100%;}
  100%{background-position:0% 0%;}
}

/* ANIMATED BACKGROUND */

.background-shape{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  opacity:.34;
  filter:blur(3px);
  z-index:0;
}

.shape-one{
  width:220px;
  height:220px;
  background:#ffcf45;
  top:-90px;
  left:-80px;
  animation:floatOne 8s ease-in-out infinite;
}

.shape-two{
  width:260px;
  height:260px;
  background:#00e0c7;
  bottom:-120px;
  right:-100px;
  animation:floatTwo 10s ease-in-out infinite;
}

.shape-three{
  width:120px;
  height:120px;
  background:#ff4b8c;
  top:48%;
  right:-70px;
  animation:floatOne 7s ease-in-out infinite reverse;
}

.shape-four{
  width:90px;
  height:90px;
  background:#ffd36a;
  bottom:22%;
  left:-45px;
  animation:floatTwo 9s ease-in-out infinite;
}

@keyframes floatOne{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(25px,-30px,30px);}
}

@keyframes floatTwo{
  0%,100%{transform:translate3d(0,0,0) rotate(0deg);}
  50%{transform:translate3d(-25px,25px,35px) rotate(25deg);}
}

/* AMBIENT LIGHT */

.ambient-light{
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  background:rgba(255,70,120,.18);
  filter:blur(90px);
  top:25%;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:0;
}

/* LOGIN CARD */

.login-container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:410px;
  padding:38px 30px 30px;
  border-radius:25px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 35px 90px rgba(20,0,25,.42),
    0 12px 25px rgba(0,0,0,.15),
    inset 0 2px 0 white,
    inset 0 -3px 10px rgba(100,0,30,.05);
  transform-style:preserve-3d;
  animation:cardEnter 1s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .18s ease,box-shadow .3s ease;
}

.login-container::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:25px;
  padding:1px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.95),
    rgba(255,211,106,.65),
    rgba(214,0,37,.25),
    rgba(255,255,255,.7)
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

@keyframes cardEnter{
  from{
    opacity:0;
    transform:translateY(45px) rotateX(12deg) scale(.93);
  }
  to{
    opacity:1;
    transform:translateY(0) rotateX(0) scale(1);
  }
}

/* LOGO */

.logo-area{
  text-align:center;
  margin-bottom:29px;
  transform:translateZ(35px);
}

.logo-symbol{
  width:88px;
  height:88px;
  margin:0 auto 17px;
  position:relative;
  display:grid;
  place-items:center;
  border-radius:25px;
  background:linear-gradient(
    145deg,
    #ff7584 0%,
    #e00039 35%,
    #a00029 65%,
    #540018 100%
  );
  border:2px solid #ffd982;
  box-shadow:
    0 9px 0 #69001c,
    0 16px 25px rgba(120,0,30,.3),
    inset 0 3px 8px rgba(255,255,255,.5),
    inset 0 -8px 15px rgba(50,0,15,.25);
  transform-style:preserve-3d;
  animation:logoFloat 4s ease-in-out infinite;
}

.logo-symbol::before{
  content:"";
  position:absolute;
  width:48px;
  height:48px;
  border:3px solid #ffe5a1;
  border-radius:14px 14px 14px 4px;
  transform:rotate(45deg) translateZ(12px);
  box-shadow:0 0 12px rgba(255,215,100,.45);
}

.logo-symbol::after{
  content:"R";
  position:relative;
  z-index:2;
  color:#fff;
  font-size:43px;
  font-weight:1000;
  font-family:Arial,sans-serif;
  text-shadow:
    0 3px 0 #8a0021,
    0 5px 7px rgba(30,0,0,.55);
  transform:translateZ(24px);
}

.logo-shine{
  position:absolute;
  top:0;
  left:-100%;
  width:55%;
  height:100%;
  background:linear-gradient(
    100deg,
    transparent,
    rgba(255,255,255,.45),
    transparent
  );
  transform:skewX(-20deg);
  animation:logoShine 5s ease-in-out infinite;
  pointer-events:none;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0) rotateY(-8deg) rotateX(5deg);
  }
  50%{
    transform:translateY(-10px) rotateY(8deg) rotateX(-5deg);
  }
}

@keyframes logoShine{
  0%,65%{left:-100%;}
  100%{left:150%;}
}

.logo-name{
  color:#a50024;
  font-size:29px;
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:0 2px 0 rgba(165,0,36,.1);
}

.logo-network{
  color:#c18b24;
  font-size:10px;
  font-weight:900;
  letter-spacing:8px;
  padding-left:8px;
  margin-top:5px;
}

.logo-slogan{
  margin-top:12px;
  color:#8b8188;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.2px;
}

/* FORM */

.form-heading{
  text-align:center;
  margin-bottom:26px;
  transform:translateZ(22px);
}

.form-heading h1{
  font-size:25px;
  color:#3c1725;
  margin-bottom:8px;
}

.form-heading p{
  color:#88818a;
  font-size:13px;
  line-height:1.6;
}

.form-group{
  margin-bottom:19px;
  transform:translateZ(15px);
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#4b2835;
  margin-bottom:9px;
}

.input-wrap{
  position:relative;
}

.form-group input{
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid #eadce1;
  border-radius:11px;
  background:#fffafb;
  font-size:14px;
  font-family:inherit;
  color:#30232a;
  outline:none;
  transition:.25s;
  box-shadow:
    0 3px 7px rgba(60,0,30,.04),
    inset 0 1px 2px rgba(0,0,0,.025);
}

.form-group input:focus{
  border-color:#d00032;
  background:white;
  box-shadow:
    0 0 0 4px rgba(214,0,37,.08),
    0 5px 14px rgba(214,0,37,.09);
}

.email-suggestions{
  display:none;
  position:absolute;
  top:calc(100% + 7px);
  left:0;
  right:0;
  z-index:20;
  background:#fff;
  border:1px solid #eadce1;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(60,0,30,.15);
  overflow:hidden;
}

.email-suggestions.show{
  display:block;
}

.suggestion-heading{
  padding:11px 13px 8px;
  color:#92838a;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.suggestion-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 13px;
  border-top:1px solid #f4edf0;
  cursor:pointer;
  transition:.2s;
}

.suggestion-item:hover{
  background:#fff3f6;
}

.suggestion-icon{
  width:34px;
  height:34px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff0f3;
  color:#b50030;
  font-weight:900;
}

.suggestion-email{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:700;
  color:#442432;
  overflow-wrap:anywhere;
}

.remove-suggestion{
  width:30px;
  height:30px;
  flex-shrink:0;
  border:0;
  border-radius:8px;
  background:#fff0f2;
  color:#b90031;
  font-size:17px;
  cursor:pointer;
}

.suggestion-empty{
  padding:13px;
  color:#93848c;
  font-size:12px;
}

/* PASSWORD */

.password-wrap input{
  padding-right:70px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#bd0030;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  padding:8px;
}

/* REMEMBER ME */

.form-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 22px;
  transform:translateZ(12px);
}

.remember-option{
  display:flex;
  align-items:center;
  gap:7px;
  color:#604653;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.remember-option input{
  width:16px;
  height:16px;
  accent-color:#bd0030;
  cursor:pointer;
}

.forgot{
  font-size:12px;
  color:#b0002b;
  font-weight:bold;
  text-decoration:none;
  white-space:nowrap;
}

.forgot:hover{
  text-decoration:underline;
}

/* 3D BUTTON */

.login-btn{
  width:100%;
  height:53px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:11px;
  background:linear-gradient(
    110deg,
    #ff4568,
    #d00038,
    #81001c
  );
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.2px;
  cursor:pointer;
  box-shadow:
    0 7px 0 #70001b,
    0 12px 20px rgba(190,0,45,.23),
    inset 0 2px 5px rgba(255,255,255,.3);
  transition:.2s;
  position:relative;
  overflow:hidden;
  transform:translateZ(18px);
}

.login-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:65%;
  height:100%;
  background:linear-gradient(
    100deg,
    transparent,
    rgba(255,255,255,.35),
    transparent
  );
  transform:skewX(-20deg);
  transition:left .7s ease;
}

.login-btn:hover::before{
  left:150%;
}

.login-btn:hover{
  transform:translateY(-3px) translateZ(18px);
  box-shadow:
    0 10px 0 #70001b,
    0 16px 25px rgba(190,0,45,.3);
}

.login-btn:active{
  transform:translateY(4px) translateZ(10px);
  box-shadow:0 2px 0 #70001b;
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* MESSAGE */

.form-message{
  display:none;
  margin-top:17px;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.form-message.error{
  display:block;
  color:#a00025;
  background:#fff0f2;
  border:1px solid #f4c6d0;
}

.form-message.success{
  display:block;
  color:#17633b;
  background:#effaf3;
  border:1px solid #c6ead2;
}

/* REGISTER */

.register-text{
  text-align:center;
  margin-top:25px;
  color:#817983;
  font-size:13px;
  transform:translateZ(12px);
}

.register-text a{
  color:#bd0030;
  font-weight:900;
  text-decoration:none;
}

.register-text a:hover{
  text-decoration:underline;
}

.security{
  text-align:center;
  margin-top:25px;
  padding-top:17px;
  border-top:1px solid #f0e5e8;
  color:#9a9299;
  font-size:10px;
  line-height:1.7;
}

.security span{
  color:#b0002b;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:420px){

  body{padding:14px;}

  .login-container{
    padding:31px 22px 25px;
    border-radius:21px;
  }

  .logo-symbol{
    width:78px;
    height:78px;
  }

  .logo-symbol::before{
    width:43px;
    height:43px;
  }

  .logo-symbol::after{
    font-size:38px;
  }

  .logo-name{
    font-size:26px;
  }

  .form-heading h1{
    font-size:23px;
  }
}

@media(max-height:700px){

  .login-container{
    padding-top:23px;
    padding-bottom:20px;
  }

  .logo-area{
    margin-bottom:19px;
  }

  .logo-symbol{
    width:68px;
    height:68px;
    margin-bottom:12px;
  }

  .logo-symbol::before{
    width:38px;
    height:38px;
  }

  .logo-symbol::after{
    font-size:34px;
  }

  .form-heading{
    margin-bottom:19px;
  }

  .security{
    margin-top:17px;
    padding-top:12px;
  }
}

/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }

  .login-container{
    transform:none!important;
  }

}
</style>
</head>

<body>

<div class="background-shape shape-one"></div>
<div class="background-shape shape-two"></div>
<div class="background-shape shape-three"></div>
<div class="background-shape shape-four"></div>
<div class="ambient-light"></div>

<main class="login-container" id="loginCard">

  <div class="logo-area">

    <div class="logo-symbol">
      <div class="logo-shine"></div>
    </div>

    <div class="logo-name">RUBALIA</div>

    <div class="logo-network">NETWORK</div>

    <div class="logo-slogan">
      SHOP SMART. EARN TOGETHER.
    </div>

  </div>

  <div class="form-heading">
    <h1>Welcome Back</h1>
    <p>Sign in to your RUBALIA account</p>
  </div>

  <form id="loginForm">

    <div class="form-group">
      <label for="email">Email Address</label>

      <div class="input-wrap">

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          maxlength="255"
          required>

        <div
          class="email-suggestions"
          id="emailSuggestions">
        </div>

      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <div class="input-wrap password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>

        <button
          type="button"
          class="show-password"
          id="showPassword">
          SHOW
        </button>

      </div>
    </div>

    <div class="form-options">

      <label class="remember-option">
        <input type="checkbox" id="rememberMe">
        <span>Remember Me</span>
      </label>

      <a href="forgot-password.html" class="forgot">
        Forgot Password?
      </a>

    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn">
      SIGN IN
    </button>

    <div
      class="form-message"
      id="formMessage"
      role="status"
      aria-live="polite">
    </div>

  </form>

  <div class="register-text">
    New to RUBALIA?
    <a href="register.html">Create Account</a>
  </div>

  <div class="security">
    <span>🔒 SECURE LOGIN</span>
    <br>
    Only your email can be remembered.
    Your password is never saved in browser storage.
  </div>

</main>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

const SAVED_EMAILS_KEY = "rubalia_saved_emails";

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberMe = document.getElementById("rememberMe");
const loginBtn = document.getElementById("loginBtn");
const formMessage = document.getElementById("formMessage");
const showPasswordBtn = document.getElementById("showPassword");
const emailSuggestions = document.getElementById("emailSuggestions");

/* OPTIONAL 3D TILT */

const loginCard = document.getElementById("loginCard");

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

const isTouchDevice = window.matchMedia(
  "(pointer: coarse)"
).matches;

if(!reducedMotion && !isTouchDevice){

  loginCard.addEventListener("mousemove",function(event){

    const rect = loginCard.getBoundingClientRect();

    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;

    const rotateY = (x - .5) * 5;
    const rotateX = (.5 - y) * 5;

    loginCard.style.transform =
      "rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg)";

  });

  loginCard.addEventListener("mouseleave",function(){

    loginCard.style.transform = "rotateX(0) rotateY(0)";

  });

}

/* PASSWORD VISIBILITY */

showPasswordBtn.addEventListener("click",function(){

  const isPassword = passwordInput.type === "password";

  passwordInput.type = isPassword ? "text" : "password";

  showPasswordBtn.textContent = isPassword ? "HIDE" : "SHOW";

});

/* SAVED EMAIL STORAGE */

function getSavedEmails(){

  try{

    const saved = localStorage.getItem(SAVED_EMAILS_KEY);

    const emails = saved ? JSON.parse(saved) : [];

    if(!Array.isArray(emails)){
      return [];
    }

    return emails.filter(function(email){

      return typeof email === "string" &&
        email.length <= 255 &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    });

  }catch(error){

    return [];

  }

}

function saveEmail(email){

  try{

    let emails = getSavedEmails();

    emails = emails.filter(function(item){

      return item.toLowerCase() !== email.toLowerCase();

    });

    emails.unshift(email);

    emails = emails.slice(0,5);

    localStorage.setItem(
      SAVED_EMAILS_KEY,
      JSON.stringify(emails)
    );

    return true;

  }catch(error){

    return false;

  }

}

function removeSavedEmail(email){

  try{

    const emails = getSavedEmails().filter(function(item){

      return item.toLowerCase() !== email.toLowerCase();

    });

    localStorage.setItem(
      SAVED_EMAILS_KEY,
      JSON.stringify(emails)
    );

    renderEmailSuggestions();

  }catch(error){

    showMessage(
      "error",
      "Unable to remove the saved account from this browser."
    );

  }

}

/* EMAIL SUGGESTIONS */

function renderEmailSuggestions(){

  const emails = getSavedEmails();

  const search = emailInput.value.trim().toLowerCase();

  const filtered = emails.filter(function(email){

    return !search ||
      email.toLowerCase().includes(search);

  });

  emailSuggestions.innerHTML = "";

  if(filtered.length === 0){

    if(emails.length === 0){

      emailSuggestions.classList.remove("show");
      return;

    }

    const empty = document.createElement("div");

    empty.className = "suggestion-empty";
    empty.textContent = "No matching saved account.";

    emailSuggestions.appendChild(empty);
    emailSuggestions.classList.add("show");

    return;

  }

  const heading = document.createElement("div");

  heading.className = "suggestion-heading";
  heading.textContent = "Saved Accounts";

  emailSuggestions.appendChild(heading);

  filtered.forEach(function(email){

    const item = document.createElement("div");

    item.className = "suggestion-item";

    const icon = document.createElement("div");

    icon.className = "suggestion-icon";
    icon.textContent = "R";

    const address = document.createElement("div");

    address.className = "suggestion-email";
    address.textContent = email;

    const remove = document.createElement("button");

    remove.type = "button";
    remove.className = "remove-suggestion";
    remove.textContent = "×";
    remove.title = "Remove saved account";
    remove.setAttribute("aria-label","Remove " + email);

    item.appendChild(icon);
    item.appendChild(address);
    item.appendChild(remove);

    item.addEventListener("click",function(event){

      if(event.target === remove){
        return;
      }

      emailInput.value = email;

      emailSuggestions.classList.remove("show");

      passwordInput.focus();

    });

    remove.addEventListener("click",function(event){

      event.stopPropagation();

      removeSavedEmail(email);

    });

    emailSuggestions.appendChild(item);

  });

  emailSuggestions.classList.add("show");

}

/* EMAIL INPUT EVENTS */

emailInput.addEventListener("focus",function(){

  renderEmailSuggestions();

});

emailInput.addEventListener("input",function(){

  renderEmailSuggestions();

});

emailInput.addEventListener("keydown",function(event){

  if(event.key === "Escape"){

    emailSuggestions.classList.remove("show");

  }

});

document.addEventListener("click",function(event){

  if(!event.target.closest(".input-wrap")){

    emailSuggestions.classList.remove("show");

  }

});

/* MESSAGE */

function showMessage(type,text){

  formMessage.className = "form-message " + type;
  formMessage.textContent = text;

}

/* LOGIN */

loginForm.addEventListener("submit",async function(event){

  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  const shouldRemember = rememberMe.checked;

  if(!email || !password){

    showMessage(
      "error",
      "Please enter your email and password."
    );

    return;

  }

  loginBtn.disabled = true;
  loginBtn.textContent = "PLEASE WAIT...";

  formMessage.className = "form-message";
  formMessage.textContent = "";

  emailSuggestions.classList.remove("show");

  try{

    /* STEP 1: AUTHENTICATE */

    const response = await fetch(API_BASE + "/auth/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email:email,
        password:password
      })

    });

    const data = await response.json().catch(function(){

      return {};

    });

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Login failed. Please check your email and password."
      );

    }

    if(!data.token){

      throw new Error(
        "The server did not return an authentication token."
      );

    }

    /* STEP 2: SAVE TEMPORARY SESSION */

    try{

      sessionStorage.setItem(
        "rubalia_token",
        data.token
      );

    }catch(storageError){

      throw new Error(
        "Your browser could not save the login session."
      );

    }

    /* STEP 3: VERIFY ROLE FROM BACKEND */

    const verifyResponse = await fetch(API_BASE + "/auth/me",{

      method:"GET",

      headers:{
        "Authorization":"Bearer " + data.token,
        "Accept":"application/json"
      }

    });

    const verifyData = await verifyResponse.json().catch(function(){

      return {};

    });

    if(
      !verifyResponse.ok ||
      !verifyData.success ||
      !verifyData.user
    ){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      throw new Error(
        verifyData.message ||
        "Unable to verify your account. Please try again."
      );

    }

    const user = verifyData.user;

    const role = String(user.role || "")
      .trim()
      .toLowerCase();

    if(!role){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      throw new Error(
        "Your account role could not be verified."
      );

    }

    /* STEP 4: SAVE VERIFIED USER */

    sessionStorage.setItem(
      "rubalia_user",
      JSON.stringify(user)
    );

    /* STEP 5: REMEMBER EMAIL ONLY */

    if(shouldRemember){

      saveEmail(email);

    }

    /* STEP 6: REDIRECT BY ROLE */

    let destination = "dashboard.html";
    let message = "Welcome! Opening your dashboard...";

    if(role === "admin"){

      destination = "admin-dashboard.html";

      message = "Admin verified! Opening Admin Dashboard...";

    }

    showMessage("success",message);

    loginBtn.textContent = "SUCCESSFUL";

    passwordInput.value = "";

    window.setTimeout(function(){

      window.location.replace(destination);

    },800);

  }catch(error){

    showMessage(
      "error",
      error.message ||
      "Unable to connect to RUBALIA Server. Please try again."
    );

    loginBtn.disabled = false;
    loginBtn.textContent = "SIGN IN";

  }

});
</script>

</body>
</html>
