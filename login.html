
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a35">
<meta name="description" content="RUBALIA NETWORK Login">
<title>Login | RUBALIA NETWORK</title>

<style>
:root{
  --navy:#071a35;
  --navy2:#102b50;
  --gold:#d6ad55;
  --bg:#f4f6fa;
  --text:#26354a;
  --muted:#758195;
  --border:#e0e5ed;
  --white:#fff;
  --green:#18794e;
}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  padding:20px 15px;display:flex;align-items:center;
  justify-content:center;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a{text-decoration:none}
[hidden]{display:none!important}
.page{width:100%;max-width:410px;margin:auto}
.login-card{
  width:100%;padding:30px 25px 25px;background:var(--white);
  border:1px solid var(--border);border-radius:18px;
  box-shadow:0 8px 28px rgba(7,26,53,.08);
}
.brand{text-align:center;margin-bottom:27px}
.logo{
  width:68px;height:68px;margin:0 auto 13px;display:grid;
  place-items:center;border-radius:17px;color:var(--navy);
  background:var(--gold);border:2px solid var(--navy);
  font-size:40px;font-weight:900;
}
.brand-name{color:var(--navy);font-size:25px;font-weight:900;letter-spacing:3px}
.brand-network{
  margin-top:5px;color:#a47b31;font-size:10px;font-weight:900;
  letter-spacing:7px;padding-left:7px;
}
.slogan{margin-top:12px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.7px}
.heading{text-align:center;margin-bottom:24px}
.heading h1{margin:0 0 7px;color:var(--navy);font-size:25px}
.heading p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.form-group{margin-bottom:17px}
.form-group label{
  display:block;margin-bottom:8px;color:#40363b;
  font-size:12px;font-weight:800;
}
.input-wrap{position:relative}
.form-group input{
  width:100%;height:51px;padding:0 13px;border:1px solid #dedfe5;
  border-radius:10px;outline:none;background:#fff;color:var(--text);font-size:14px;
}
.form-group input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,173,85,.15)}
.form-group input::placeholder{color:#aaa2a7}
.password-wrap input{padding-right:70px}
.show-password{
  position:absolute;top:50%;right:9px;transform:translateY(-50%);
  min-width:48px;min-height:38px;border:0;background:transparent;
  color:var(--navy);font-size:11px;font-weight:900;cursor:pointer;
}
.email-suggestions{
  display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;
  z-index:10;max-height:190px;overflow-y:auto;background:#fff;
  border:1px solid var(--border);border-radius:10px;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}
.email-suggestions.show{display:block}
.suggestion-heading{
  padding:10px 12px;color:var(--muted);font-size:10px;
  font-weight:800;text-transform:uppercase;
}
.suggestion-item{
  display:flex;align-items:center;gap:9px;padding:11px 12px;
  border-top:1px solid #f0ecef;cursor:pointer;
}
.suggestion-item:active{background:#f4f6fa}
.suggestion-icon{
  width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;
  border-radius:50%;background:#f5edda;color:var(--navy);font-weight:900;
}
.suggestion-email{
  flex:1;min-width:0;color:#44323a;font-size:12px;overflow-wrap:anywhere;
}
.remove-suggestion{
  width:32px;height:32px;border:0;border-radius:7px;
  background:#fff0f2;color:#b42335;font-size:18px;
}
.suggestion-empty{padding:12px;color:var(--muted);font-size:12px}
.form-options{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:2px 0 20px;
}
.remember-option{
  display:flex;align-items:center;gap:7px;color:#51474d;
  font-size:12px;font-weight:700;
}
.remember-option input{width:17px;height:17px;accent-color:var(--navy)}
.forgot{color:var(--navy);font-size:11px;font-weight:800}
.login-btn{
  width:100%;min-height:52px;border:0;border-radius:10px;
  background:var(--navy);color:#fff;font-size:14px;
  font-weight:900;letter-spacing:1px;cursor:pointer;
}
.login-btn:active{background:var(--navy2)}
.login-btn:disabled{opacity:.6;cursor:wait}
.form-message{
  display:none;margin-top:14px;padding:11px 12px;border-radius:8px;
  font-size:12px;line-height:1.6;overflow-wrap:anywhere;
}
.form-message.error{
  display:block;color:#a00025;background:#fff0f2;border:1px solid #f0c8d0;
}
.form-message.success{
  display:block;color:var(--green);background:#edf9f2;border:1px solid #c9ead6;
}
.register-text{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
.register-text a{color:var(--navy);font-weight:900}
.footer{margin-top:17px;text-align:center;color:#99929a;font-size:10px}
@media(max-width:360px){
  body{padding:12px}
  .login-card{padding:25px 17px 21px}
  .brand-name{font-size:22px}
  .heading h1{font-size:23px}
  .form-options{gap:6px}
  .remember-option,.forgot{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;transition:none!important;scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<main class="page">
<section class="login-card">

  <div class="brand">
    <div class="logo" aria-label="Rubalia logo">R</div>
    <div class="brand-name">RUBALIA</div>
    <div class="brand-network">NETWORK</div>
    <div class="slogan">SHOP SMART. EARN TOGETHER.</div>
  </div>

  <div class="heading">
    <h1>Welcome Back</h1>
    <p>Sign in to your RUBALIA account</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          maxlength="255"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          required>
        <div class="email-suggestions" id="emailSuggestions"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap password-wrap">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>
        <button type="button" class="show-password" id="showPassword">SHOW</button>
      </div>
    </div>

    <div class="form-options">
      <label class="remember-option">
        <input type="checkbox" id="rememberMe">
        <span>Remember Email</span>
      </label>
      <a href="forgot-password.html" class="forgot">Forgot Password?</a>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">SIGN IN</button>
    <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>
  </form>

  <div class="register-text">
    New to RUBALIA?
    <a href="register.html">Create Account</a>
  </div>

</section>

<div class="footer">
  © <span id="year"></span> RUBALIA NETWORK
</div>
</main>

<script>
"use strict";

/* CONFIGURATION */
const API_BASE="https://rubalia.onrender.com/api";

const SAVED_EMAILS_KEY="rubalia_saved_emails";
const TOKEN_KEY="rubalia_token";
const USER_KEY="rubalia_user";
const LAST_ACTIVITY_KEY="rubalia_last_activity";
const INACTIVITY_LIMIT=24*60*60*1000;
const REQUEST_TIMEOUT=90000;

const $=id=>document.getElementById(id);

const loginForm=$("loginForm");
const emailInput=$("email");
const passwordInput=$("password");
const rememberMe=$("rememberMe");
const loginBtn=$("loginBtn");
const formMessage=$("formMessage");
const showPasswordBtn=$("showPassword");
const emailSuggestions=$("emailSuggestions");

$("year").textContent=new Date().getFullYear();

/* MESSAGE */
function showMessage(type,message){
  formMessage.className="form-message "+type;
  formMessage.textContent=message;
}

function clearMessage(){
  formMessage.className="form-message";
  formMessage.textContent="";
}

/* SESSION STORAGE HELPERS */
function getStoredToken(){
  return localStorage.getItem(TOKEN_KEY)||"";
}

function getStoredUser(){
  try{
    const value=localStorage.getItem(USER_KEY);
    return value?JSON.parse(value):null;
  }catch(error){
    return null;
  }
}

function clearLoginSession(){
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem(LAST_ACTIVITY_KEY);

  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USER_KEY);
}

function saveLoginSession(token,user){
  const now=Date.now();

  localStorage.setItem(TOKEN_KEY,token);
  localStorage.setItem(USER_KEY,JSON.stringify(user));
  localStorage.setItem(LAST_ACTIVITY_KEY,String(now));

  /* Temporary compatibility with existing pages */
  sessionStorage.setItem(TOKEN_KEY,token);
  sessionStorage.setItem(USER_KEY,JSON.stringify(user));
}

/* ROLE REDIRECT */
function getDashboardUrl(user){
  const role=String(user?.role||"").trim().toLowerCase();

  if(role==="admin")return "admin-dashboard.html";
  if(role==="moderator")return "modetor.html";

  return "dashboard.html";
}

function redirectToDashboard(user){
  window.location.replace(getDashboardUrl(user));
}

/* API REQUEST */
async function requestAPI(path,options={}){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT);

  try{
    const response=await fetch(API_BASE+path,{
      ...options,
      signal:controller.signal,
      cache:"no-store"
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok||data.success===false){
      const error=new Error(
        data.message||"Request failed. Please try again."
      );
      error.status=response.status;
      error.code=data.code||"";
      throw error;
    }

    return data;

  }catch(error){
    if(error.name==="AbortError"){
      throw new Error("Server response is taking too long. Please try again.");
    }

    if(error instanceof TypeError){
      throw new Error("Unable to connect to the server. Check your internet connection.");
    }

    throw error;

  }finally{
    clearTimeout(timeout);
  }
}

/* VERIFY EXISTING SESSION ON LOGIN PAGE */
async function restoreExistingSession(){
  const token=getStoredToken();

  if(!token)return false;

  const lastActivity=Number(
    localStorage.getItem(LAST_ACTIVITY_KEY)||0
  );

  if(
    !lastActivity||
    Date.now()-lastActivity>=INACTIVITY_LIMIT
  ){
    clearLoginSession();
    return false;
  }

  loginBtn.disabled=true;
  loginBtn.textContent="CHECKING SESSION...";

  try{
    const verifyData=await requestAPI("/auth/me",{
      method:"GET",
      headers:{
        "Authorization":"Bearer "+token,
        "Accept":"application/json"
      }
    });

    const user=verifyData.user||getStoredUser();

    if(!user){
      clearLoginSession();
      return false;
    }

    const now=Date.now();

    localStorage.setItem(USER_KEY,JSON.stringify(user));
    localStorage.setItem(LAST_ACTIVITY_KEY,String(now));

    sessionStorage.setItem(TOKEN_KEY,token);
    sessionStorage.setItem(USER_KEY,JSON.stringify(user));

    redirectToDashboard(user);
    return true;

  }catch(error){
    if(error.status===401||error.status===403){
      clearLoginSession();
    }

    /* Keep the stored token if the server is temporarily unavailable. */
    loginBtn.disabled=false;
    loginBtn.textContent="SIGN IN";

    return false;
  }
}

/* PASSWORD VISIBILITY */
showPasswordBtn.addEventListener("click",()=>{
  const show=passwordInput.type==="password";
  passwordInput.type=show?"text":"password";
  showPasswordBtn.textContent=show?"HIDE":"SHOW";
});

/* SAVED EMAILS - PASSWORDS ARE NEVER STORED */
function getSavedEmails(){
  try{
    const value=localStorage.getItem(SAVED_EMAILS_KEY);
    const list=value?JSON.parse(value):[];

    if(!Array.isArray(list))return [];

    return list.filter(email=>
      typeof email==="string"&&
      email.length<=255&&
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    ).slice(0,5);

  }catch(error){
    return [];
  }
}

function saveEmail(email){
  try{
    let emails=getSavedEmails();

    emails=emails.filter(
      item=>item.toLowerCase()!==email.toLowerCase()
    );

    emails.unshift(email);

    localStorage.setItem(
      SAVED_EMAILS_KEY,
      JSON.stringify(emails.slice(0,5))
    );

  }catch(error){}
}

function removeSavedEmail(email){
  try{
    const emails=getSavedEmails().filter(
      item=>item.toLowerCase()!==email.toLowerCase()
    );

    localStorage.setItem(
      SAVED_EMAILS_KEY,
      JSON.stringify(emails)
    );

    renderEmailSuggestions();

  }catch(error){
    showMessage("error","Unable to remove saved email.");
  }
}

/* EMAIL SUGGESTIONS */
function renderEmailSuggestions(){
  const emails=getSavedEmails();
  const search=emailInput.value.trim().toLowerCase();

  const filtered=emails.filter(email=>
    !search||email.toLowerCase().includes(search)
  );

  emailSuggestions.replaceChildren();

  if(!filtered.length){
    if(emails.length){
      const empty=document.createElement("div");
      empty.className="suggestion-empty";
      empty.textContent="No matching saved account.";
      emailSuggestions.appendChild(empty);
      emailSuggestions.classList.add("show");
    }else{
      emailSuggestions.classList.remove("show");
    }

    return;
  }

  const heading=document.createElement("div");
  heading.className="suggestion-heading";
  heading.textContent="Saved Accounts";

  emailSuggestions.appendChild(heading);

  filtered.forEach(email=>{
    const item=document.createElement("div");
    item.className="suggestion-item";

    const icon=document.createElement("div");
    icon.className="suggestion-icon";
    icon.textContent="R";

    const address=document.createElement("div");
    address.className="suggestion-email";
    address.textContent=email;

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="remove-suggestion";
    remove.textContent="×";
    remove.setAttribute("aria-label","Remove saved email");

    item.append(icon,address,remove);

    item.addEventListener("click",event=>{
      if(event.target===remove)return;

      emailInput.value=email;
      emailSuggestions.classList.remove("show");
      passwordInput.focus();
    });

    remove.addEventListener("click",event=>{
      event.stopPropagation();
      removeSavedEmail(email);
    });

    emailSuggestions.appendChild(item);
  });

  emailSuggestions.classList.add("show");
}

emailInput.addEventListener("focus",renderEmailSuggestions);
emailInput.addEventListener("input",renderEmailSuggestions);

emailInput.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    emailSuggestions.classList.remove("show");
  }
});

document.addEventListener("click",event=>{
  if(!event.target.closest(".input-wrap")){
    emailSuggestions.classList.remove("show");
  }
});

/* LOGIN */
let loginInProgress=false;

loginForm.addEventListener("submit",async event=>{
  event.preventDefault();

  if(loginInProgress)return;

  clearMessage();

  const email=emailInput.value.trim().toLowerCase();
  const password=passwordInput.value;

  if(!email||!password){
    showMessage("error","Please enter your email and password.");
    return;
  }

  if(!emailInput.checkValidity()){
    showMessage("error","Please enter a valid email address.");
    emailInput.focus();
    return;
  }

  loginInProgress=true;
  loginBtn.disabled=true;
  loginBtn.textContent="SIGNING IN...";

  emailSuggestions.classList.remove("show");

  try{
    /* STEP 1: LOGIN */
    const loginData=await requestAPI("/auth/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    });

    if(!loginData.token){
      throw new Error("The server did not return an authentication token.");
    }

    /* STEP 2: VERIFY USER */
    const verifyData=await requestAPI("/auth/me",{
      method:"GET",
      headers:{
        "Authorization":"Bearer "+loginData.token,
        "Accept":"application/json"
      }
    });

    const user=verifyData.user||verifyData.profile;

    if(!user){
      throw new Error("Unable to verify your account information.");
    }

    const role=String(user.role||"").trim().toLowerCase();

    if(!role){
      throw new Error("Your account role could not be verified.");
    }

    /* STEP 3: SAVE PERSISTENT SESSION */
    try{
      saveLoginSession(loginData.token,user);
    }catch(storageError){
      throw new Error(
        "Unable to save your login session. Please check browser storage."
      );
    }

    /* STEP 4: REMEMBER EMAIL */
    if(rememberMe.checked){
      saveEmail(email);
    }

    /* STEP 5: REDIRECT */
    loginBtn.textContent="SUCCESS";

    passwordInput.value="";

    showMessage(
      "success",
      "Login successful. Opening your dashboard..."
    );

    redirectToDashboard(user);

  }catch(error){
    showMessage(
      "error",
      error.message||"Unable to login. Please try again."
    );

    loginInProgress=false;
    loginBtn.disabled=false;
    loginBtn.textContent="SIGN IN";
  }
});

/* STARTUP */
(async function initLoginPage(){
  await restoreExistingSession();
})();
</script>

</body>
</html>
