<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21152f">
<title>Payment | RUBALIA NETWORK</title>
<style>
:root{--red:#a71952;--dark:#21172f;--bg:#f7f5f9;--muted:#858196;--border:#eae6ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#29243a;font-family:Arial,Helvetica,sans-serif}
header{padding:15px 5%;background:linear-gradient(110deg,#19152f,#74133e 75%,#a51d54);color:white;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:900}.logo span{color:#f5dda0}
main{max-width:570px;margin:30px auto;padding:0 16px 40px}
.panel{background:white;border:1px solid var(--border);border-radius:15px;padding:22px;box-shadow:0 8px 25px #1f14310d}
h1{font-size:22px;margin:0 0 7px;color:#30243e}
.sub{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 20px}
.method-head{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid #ead8e2;border-radius:11px;background:#fff8fb;margin-bottom:18px}
.method-logo{width:82px;height:48px;display:flex;align-items:center;justify-content:center;padding:5px;border:1px solid #eee7ef;border-radius:8px;background:white;flex-shrink:0}
.method-logo img{max-width:100%;max-height:100%;object-fit:contain}
.method-head strong{font-size:15px}
.method-head small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.row{padding:12px;margin:10px 0;background:#fbf7fa;border:1px solid #eee7ef;border-radius:9px}
.row small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}
.row strong{font-size:14px;overflow-wrap:anywhere}
.copy{margin-top:8px;border:0;border-radius:6px;padding:7px 12px;background:#eee7f0;color:#5b3150;font-size:10px;font-weight:bold}
.instructions{font-size:12px;line-height:1.8;color:#65566b;white-space:pre-line;margin:14px 0}
.help{padding:12px;border-radius:8px;background:#f1f5ff;border:1px solid #d7e2fa;color:#34558a;font-size:11px;line-height:1.7;margin:14px 0}
label{display:block;font-size:11px;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #e5dfeb;border-radius:9px;font-size:12px;outline:none}
input:focus{border-color:#c64d81}
.btn{width:100%;padding:15px;border:0;border-radius:9px;background:linear-gradient(110deg,#ed286a,#9b164f);color:white;font-weight:900;font-size:12px;margin-top:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.message{display:none;padding:12px;border-radius:8px;font-size:12px;line-height:1.7;margin:12px 0}
.error{display:block;background:#fff0f1;color:#a12b36;border:1px solid #f4cbd0}
.good{display:block;background:#effaf3;color:#17633b;border:1px solid #c6ead2}
.info{display:block;background:#f1f5ff;color:#34558a;border:1px solid #d7e2fa}
.wallet-amount{font-size:25px;font-weight:900;color:#a71952;margin:12px 0}
footer{text-align:center;padding:22px;background:#21152f;color:#d9cbd9;font-size:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<div class="logo">RUBALIA <span>NETWORK</span></div>
<a href="checkout.html" style="color:white;font-size:11px">← Back</a>
</header>
<main>
<section class="panel">
<h1>Complete Payment</h1>
<p class="sub">Follow the payment instructions below. Your payment will be checked by RUBALIA NETWORK Admin.</p>
<div id="message" class="message"></div>
<div id="paymentContent" hidden>
<div class="method-head">
<div class="method-logo" id="methodLogo"></div>
<div><strong id="methodName">Payment Method</strong><small id="methodSubtitle">Selected payment method</small></div>
</div>
<div class="row"><small>PACKAGE</small><strong id="packageName">—</strong></div>
<div class="row"><small>QUANTITY</small><strong id="quantity">—</strong></div>
<div class="row"><small>TOTAL AMOUNT</small><strong id="total">—</strong></div>
<div id="gatewayDetails"></div>
<div class="instructions" id="instructions"></div>
<div class="help" id="help"></div>
<div id="referenceArea">
<label for="transactionReference" id="referenceLabel">Transaction ID / Reference *</label>
<input id="transactionReference" maxlength="180" placeholder="Enter transaction reference">
</div>
<button class="btn" id="payBtn">SUBMIT PAYMENT</button>
</div>
</section>
</main>
<footer>© RUBALIA NETWORK — All Rights Reserved.</footer>
<script>
"use strict";
const API_BASE="https://rubalia.onrender.com/api";
const $=id=>document.getElementById(id);
let token="",intent=null,method=null,submitting=false;
const LOGOS={
 bkash:"https://raw.githubusercontent.com/mdmubarokhosin/Bd-MFS-Logo/refs/heads/main/logos/png/bkash.png",
 nagad:"https://raw.githubusercontent.com/mdmubarokhosin/Bd-MFS-Logo/refs/heads/main/logos/png/nagad.png",
 rocket:"https://raw.githubusercontent.com/mdmubarokhosin/Bd-MFS-Logo/refs/heads/main/logos/png/rocket.png",
 upay:"https://raw.githubusercontent.com/mdmubarokhosin/Bd-MFS-Logo/refs/heads/main/logos/png/upay.png",
 binance:"https://cdn.simpleicons.org/binance/F0B90B",
 redotpay:"https://cdn.simpleicons.org/redotpay/111111",
 usdt_bep20:"https://cdn.simpleicons.org/tether/26A17B"
};
const NAMES={bkash:"bKash",nagad:"Nagad",rocket:"Rocket",upay:"upay",redotpay:"RedotPay",binance:"Binance",bank_transfer:"Bank Transfer",usdt_bep20:"USDT (BEP20)",wallet:"RUBALIA Wallet"};
function money(v){const n=Number(v);return "৳ "+(Number.isFinite(n)?n:0).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2});}
function message(type,text){const el=$("message");el.className="message "+type;el.textContent=text;el.style.display="block";}
async function api(path,options={}){
 const r=await fetch(API_BASE+path,{...options,headers:{
 "Accept":"application/json",
 ...(options.body?{"Content-Type":"application/json"}:{}),
 ...(token?{"Authorization":"Bearer "+token}:{}),
 ...(options.headers||{})
 },cache:"no-store"});
 const d=await r.json().catch(()=>({}));
 if(r.status===401){sessionStorage.removeItem("rubalia_token");location.replace("login.html");throw Error("Login session expired.");}
 if(!r.ok||d.success===false)throw Error(d.message||"Request failed.");
 return d;
}
function addRow(label,value,copy=false){
 if(value===undefined||value===null||value==="")return;
 const row=document.createElement("div");row.className="row";
 const small=document.createElement("small");small.textContent=label;
 const strong=document.createElement("strong");strong.textContent=value;
 row.append(small,strong);
 if(copy){
  const btn=document.createElement("button");btn.className="copy";btn.type="button";btn.textContent="COPY";
  btn.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(String(value));btn.textContent="COPIED";}catch(_){btn.textContent="COPY FAILED";}});
  row.append(btn);
 }
 $("gatewayDetails").append(row);
}
function setLogo(){
 const box=$("methodLogo");box.replaceChildren();
 const src=LOGOS[intent.method];
 if(src){
  const img=document.createElement("img");img.src=src;img.alt=method.display_name||intent.method+" logo";
  img.onerror=()=>{box.textContent=NAMES[intent.method]||intent.method;};
  box.append(img);
 }else box.textContent=intent.method==="wallet"?"👛":"🏦";
}
function renderPayment(){
 $("paymentContent").hidden=false;
 $("packageName").textContent=intent.packageName||"Package";
 $("quantity").textContent=intent.quantity;
 $("total").textContent=money(intent.amount);
 $("methodName").textContent=NAMES[intent.method]||method.display_name||method.name||intent.method;
 $("methodSubtitle").textContent="Selected payment method";
 setLogo();
 const g=$("gatewayDetails");g.replaceChildren();
 if(intent.method==="wallet"){
  $("referenceArea").hidden=true;
  $("instructions").textContent="Your RUBALIA wallet will be charged when you confirm this order.";
  $("help").textContent="Wallet payment is processed securely by the RUBALIA server.";
  $("payBtn").textContent="PAY & PLACE ORDER";
  return;
 }
 $("referenceArea").hidden=false;
 $("payBtn").textContent="SUBMIT PAYMENT FOR VERIFICATION";
 if(intent.method==="usdt_bep20"){
  const rate=Number(method.usdt_rate);
  if(!method.wallet_address||method.network!=="BEP20"||!Number.isFinite(rate)||rate<=0)throw Error("USDT payment is not properly configured by Admin.");
  const usdt=(Number(intent.amount)/rate).toFixed(6);
  addRow("USDT WALLET ADDRESS",method.wallet_address,true);
  addRow("NETWORK","BNB Smart Chain (BEP20)");
  addRow("USDT EXCHANGE RATE","1 USDT = "+money(rate));
  addRow("SEND EXACTLY",usdt+" USDT");
  $("referenceLabel").textContent="BEP20 Transaction Hash *";
  $("transactionReference").placeholder="0x followed by 64 hexadecimal characters";
  $("help").textContent="Send USDT using BEP20 network only. Enter the transaction hash after sending. Admin will verify the payment.";
 }else{
  addRow("BANK NAME",method.bank_name);
  addRow("ACCOUNT NAME",method.account_name);
  addRow("BRANCH",method.branch);
  addRow("PAYMENT ACCOUNT NUMBER",method.account_number||method.wallet_address,true);
  addRow("AMOUNT TO PAY",money(intent.amount));
  $("referenceLabel").textContent="Transaction ID / Reference *";
  $("transactionReference").placeholder="Enter your transaction ID";
  $("help").textContent="Send the exact amount to the displayed account. Enter your transaction reference. Your payment will remain pending until Admin verifies it.";
 }
 $("instructions").textContent=method.instructions||"Please follow the payment details above.";
}
async function initialize(){
 token=sessionStorage.getItem("rubalia_token")||"";
 if(!token){location.replace("login.html");return;}
 try{
  const raw=sessionStorage.getItem("rubalia_checkout_intent");
  if(!raw)throw Error("Checkout information not found. Please start again.");
  intent=JSON.parse(raw);
  if(!intent||!intent.packageId||!intent.quantity||!intent.method||!intent.createdAt)throw Error("Invalid checkout information.");
  if(Date.now()-Number(intent.createdAt)>30*60*1000)throw Error("Checkout session expired. Please start again.");
  if(intent.method==="wallet")method={gateway:"wallet",enabled:true};
  else{
   const d=await api("/payment/methods");
   if(!Array.isArray(d.methods))throw Error("Payment methods unavailable.");
   method=d.methods.find(x=>x.gateway===intent.method&&x.enabled===true);
   if(!method)throw Error("This payment method is no longer available. Please return to checkout.");
  }
  renderPayment();
 }catch(e){message("error",e.message);}
}
$("payBtn").addEventListener("click",async()=>{
 if(submitting||!intent||!method)return;
 const btn=$("payBtn");
 let reference=$("transactionReference").value.trim();
 if(intent.method!=="wallet"){
  if(reference.length<5){message("error","Please enter your transaction reference.");return;}
  if(intent.method==="usdt_bep20"&&!/^0x[a-fA-F0-9]{64}$/.test(reference)){message("error","Please enter a valid BEP20 transaction hash.");return;}
 }
 submitting=true;btn.disabled=true;btn.textContent="PROCESSING...";
 try{
  const shipping={shippingName:intent.shippingName,shippingPhone:intent.shippingPhone,shippingAddress:intent.shippingAddress};
  const items=[{type:"package",packageId:Number(intent.packageId),quantity:Number(intent.quantity)}];
  if(intent.method==="wallet"){
   const result=await api("/orders",{method:"POST",body:JSON.stringify({paymentMethod:"wallet",items,...shipping})});
   if(!result.order)throw Error("The server did not return order confirmation.");
   sessionStorage.removeItem("rubalia_checkout_intent");
   $("paymentContent").innerHTML="";
   message("good","Payment successful! Your order has been placed. Order: "+(result.order.order_number||result.order.id)+". Amount: "+money(result.order.total_amount));
   const link=document.createElement("a");link.href="orders.html";link.textContent="VIEW MY ORDERS";link.className="btn";link.style.display="block";link.style.textAlign="center";link.style.textDecoration="none";$("paymentContent").append(link);$("paymentContent").hidden=false;
  }else{
   const result=await api("/payment/request",{method:"POST",body:JSON.stringify({gateway:method.gateway,transactionReference:reference,items,...shipping})});
   if(!result.payment)throw Error("The server did not return a payment request.");
   sessionStorage.removeItem("rubalia_checkout_intent");
   $("paymentContent").innerHTML="";
   message("good","Payment request submitted successfully. Payment Reference: "+(result.payment.payment_reference||"Submitted")+". Status: Pending Admin Verification. Your order will be created after Admin approval.");
   const link=document.createElement("a");link.href="dashboard.html";link.textContent="BACK TO DASHBOARD";link.className="btn";link.style.display="block";link.style.textAlign="center";link.style.textDecoration="none";$("paymentContent").append(link);$("paymentContent").hidden=false;
  }
 }catch(e){message("error",e.message);submitting=false;btn.disabled=false;btn.textContent=intent.method==="wallet"?"PAY & PLACE ORDER":"SUBMIT PAYMENT FOR VERIFICATION";}
});
initialize();
</script>
</body>
</html>
