<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#310d35">
<title>Support Tickets | RUBALIA NETWORK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f9;color:#29243a;font-family:Arial,Helvetica,sans-serif}.top{padding:18px 22px;background:linear-gradient(110deg,#24112f,#4b104f,#a51e43);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.top strong{letter-spacing:1px}.top a{color:#ffe58a;text-decoration:none;font-size:12px;font-weight:bold}main{max-width:1200px;margin:auto;padding:24px 16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 6px;color:#21172f}.muted{font-size:12px;color:#858196}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px;margin-top:18px}.panel{background:white;border:1px solid #eae6ee;border-radius:12px;padding:17px;margin-bottom:16px}.filters{display:flex;gap:8px;margin:14px 0}.filters input,.filters select,.reply textarea{width:100%;padding:11px;border:1px solid #e4dfe9;border-radius:8px;font-size:12px}.filters select{max-width:170px}.list{display:grid;gap:8px;max-height:70vh;overflow:auto}.item{border:1px solid #e9e3ed;background:#fff;border-radius:9px;padding:12px;text-align:left;cursor:pointer}.item.active{border-color:#e72c76;background:#fff8fb}.item b{font-size:12px}.meta{font-size:10px;color:#858196;line-height:1.6;margin-top:6px}.pill{float:right;border-radius:20px;padding:4px 7px;background:#f0eaf6;color:#5b337c;font-size:9px;font-weight:bold}.pill.open{background:#fff2d8;color:#91691e}.pill.resolved,.pill.closed{background:#e8f7ee;color:#17633b}.conversation{display:grid;gap:9px;max-height:48vh;overflow:auto;padding:8px 0}.bubble{max-width:90%;padding:11px;border-radius:10px;background:#eee8f6;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.member{justify-self:start;background:#f1f3f8}.bubble.admin{justify-self:end;background:#fceaf2}.bubble small{display:block;color:#858196;font-size:9px;margin-top:5px}.reply{display:grid;gap:9px;margin-top:12px}.reply textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:8px;padding:11px 15px;background:linear-gradient(110deg,#e72c76,#9b164f);color:white;font-size:12px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.6}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row select{padding:10px;border:1px solid #e4dfe9;border-radius:8px;font-size:11px}.notice{font-size:12px;padding:11px;border-radius:8px;background:#fff8e8;color:#806322;margin:12px 0}.notice.error{background:#fff0f1;color:#a12b36}.empty{padding:24px;text-align:center;color:#858196;font-size:12px;border:1px dashed #ded5e5;border-radius:9px}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:42vh}}
</style>
</head>
<body>
<header class="top"><strong>RUBALIA NETWORK · SUPPORT DESK</strong><a href="admin-dashboard.html">← ADMIN DASHBOARD</a></header>
<main><div class="heading"><div><h1>Support Tickets</h1><div class="muted">Review member requests and reply securely.</div></div><button class="btn" id="refresh">Refresh</button></div>
<div id="notice" class="notice">Checking Admin access...</div>
<div class="layout"><section class="panel"><h3>Ticket Inbox</h3><div class="filters"><input id="search" placeholder="Search ticket/member"><select id="status"><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_member">Waiting member</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div id="tickets" class="list"><div class="empty">Loading...</div></div></section>
<section class="panel"><h3 id="ticketTitle">Ticket conversation</h3><div id="details" class="empty">Select a ticket from the inbox.</div><div id="conversation" class="conversation"></div><div id="controls" style="display:none"><div class="row"><label for="newStatus" class="muted">Status</label><select id="newStatus"><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_member">Waiting member</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><button class="btn" id="saveStatus">Update Status</button></div><form class="reply" id="replyForm"><textarea id="reply" maxlength="5000" placeholder="Write your response to the member..." required></textarea><button class="btn" type="submit">Send Admin Reply</button></form></div></section></div></main>
<script>
"use strict";
const API="https://rubalia.onrender.com/api", $=id=>document.getElementById(id), token=sessionStorage.getItem("rubalia_token");let selected=null;
function headers(){return{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json"}}
async function call(path,options={}){const r=await fetch(API+path,{...options,headers:{...headers(),...(options.headers||{})},cache:"no-store"});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){sessionStorage.removeItem("rubalia_token");sessionStorage.removeItem("rubalia_user");location.replace("login.html")}if(!r.ok||d.success===false)throw new Error(d.message||`Request failed (${r.status})`);return d}
function notice(s,error=false){$("notice").textContent=s;$("notice").className="notice"+(error?" error":"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){return new Date(v).toLocaleString()}
async function loadTickets(){try{const p=new URLSearchParams();if($("status").value)p.set("status",$("status").value);if($("search").value.trim())p.set("search",$("search").value.trim());const d=await call("/support/admin/tickets?"+p.toString());$("tickets").innerHTML=d.tickets.length?d.tickets.map(t=>`<button class="item ${String(t.id)===String(selected)?"active":""}" data-id="${esc(t.id)}"><span class="pill ${esc(t.status)}">${esc(t.status.replaceAll("_"," "))}</span><b>${esc(t.ticket_reference)} · ${esc(t.subject)}</b><div class="meta">${esc(t.member_name)} · ${esc(t.member_email)}<br>${esc(t.category)} · ${esc(t.priority)} · ${esc(date(t.updated_at))}</div></button>`).join(""):'<div class="empty">No matching tickets.</div>';$("tickets").querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>openTicket(b.dataset.id)))}catch(e){$("tickets").innerHTML=`<div class="empty">${esc(e.message)}</div>`;notice(e.message,true)}}
async function openTicket(id){selected=id;$("details").textContent="Loading...";$("conversation").innerHTML="";try{const d=await call(`/support/admin/tickets/${encodeURIComponent(id)}`),t=d.ticket;$("ticketTitle").textContent=`${t.ticket_reference} · ${t.subject}`;$("details").className="meta";$("details").innerHTML=`<b>${esc(t.member_name)}</b> · ${esc(t.member_email)}<br>${esc(t.category)} · ${esc(t.priority.toUpperCase())} · Created ${esc(date(t.created_at))}`;$("conversation").innerHTML=d.messages.map(m=>`<div class="bubble ${esc(m.sender_role)}">${esc(m.message)}<small>${esc(m.sender_name)} · ${esc(date(m.created_at))}</small></div>`).join("");$("newStatus").value=t.status;$("controls").style.display="block";await loadTickets()}catch(e){$("details").textContent=e.message;notice(e.message,true)}}
$("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;try{await call(`/support/admin/tickets/${encodeURIComponent(selected)}/messages`,{method:"POST",body:JSON.stringify({message:$("reply").value})});$("reply").value="";notice("Reply sent to member.");await openTicket(selected)}catch(err){notice(err.message,true)}finally{b.disabled=false}});
$("saveStatus").addEventListener("click",async()=>{if(!selected)return;try{await call(`/support/admin/tickets/${encodeURIComponent(selected)}/status`,{method:"PATCH",body:JSON.stringify({status:$("newStatus").value})});notice("Ticket status updated.");await openTicket(selected)}catch(e){notice(e.message,true)}});
$("refresh").addEventListener("click",loadTickets);$("status").addEventListener("change",loadTickets);let searchTimer; $("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadTickets,300)});
async function start(){if(!token){location.replace("login.html");return}try{const r=await call("/auth/me",{method:"GET"});if(String(r.user?.role).toLowerCase()!=="admin"){location.replace("dashboard.html");return}notice("Admin access verified.");await loadTickets()}catch(e){notice(e.message,true)}}start();
</script></body></html>
