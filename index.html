
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#85000e">
<meta name="description" content="RUBALIA NETWORK - Shop Smart. Earn Together.">
<title>RUBALIA NETWORK</title>

<style>
:root{
  --red:#85000e;
  --red-dark:#430006;
  --red-light:#e00018;
  --gold:#f5bd35;
  --gold-light:#ffe9a6;
  --white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  background:#430006;
}

/* SPLASH SCREEN */

.splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,190,50,.22),transparent 38%),
    linear-gradient(145deg,#390005,#85000e 48%,#490006);
  transition:opacity .7s ease,visibility .7s ease;
}

.splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash::before,
.splash::after{
  content:"";
  position:absolute;
  width:340px;
  height:340px;
  border:1px solid rgba(255,220,130,.25);
  border-radius:50%;
  animation:ringPulse 4s ease-in-out infinite;
}

.splash::before{
  width:260px;
  height:260px;
}

.splash::after{
  width:390px;
  height:390px;
  animation-delay:1s;
}

@keyframes ringPulse{
  0%,100%{
    transform:scale(.9);
    opacity:.25;
  }
  50%{
    transform:scale(1.12);
    opacity:.75;
  }
}

.splash-content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  padding:25px;
  text-align:center;
  animation:contentEnter 1s ease both;
}

@keyframes contentEnter{
  from{
    opacity:0;
    transform:translateY(25px) scale(.94);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo-emblem{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 28px;
  display:grid;
  place-items:center;
  border-radius:29px;
  background:linear-gradient(145deg,#ff5968,#c90018 60%,#76000b);
  border:2px solid var(--gold-light);
  box-shadow:
    0 9px 0 #520008,
    0 18px 35px rgba(0,0,0,.4),
    inset 0 3px 9px rgba(255,255,255,.4);
  transform:perspective(500px) rotateY(-8deg);
  animation:emblemFloat 3s ease-in-out infinite;
}

.logo-emblem span{
  font-size:54px;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));
}

@keyframes emblemFloat{
  0%,100%{transform:translateY(0) perspective(500px) rotateY(-8deg);}
  50%{transform:translateY(-9px) perspective(500px) rotateY(8deg);}
}

.brand-name{
  color:#fff;
  font-size:clamp(36px,10vw,49px);
  font-weight:1000;
  letter-spacing:5px;
  text-shadow:
    1px 2px 0 #8c000b,
    2px 4px 0 #570006,
    4px 7px 12px rgba(0,0,0,.5);
}

.brand-subtitle{
  margin-top:7px;
  color:var(--gold-light);
  font-size:13px;
  font-weight:900;
  letter-spacing:10px;
  padding-left:10px;
  text-shadow:0 3px 5px rgba(0,0,0,.4);
}

.brand-line{
  width:100px;
  height:3px;
  margin:24px auto;
  border-radius:10px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 15px rgba(255,220,120,.5);
}

.slogan{
  color:#fff0e8;
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
}

.loading-area{
  width:190px;
  margin:45px auto 0;
}

.loading-text{
  color:#ffe8a6;
  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:12px;
}

.progress-track{
  width:100%;
  height:4px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.2);
}

.progress-bar{
  width:0;
  height:100%;
  border-radius:10px;
  background:linear-gradient(90deg,#f5bd35,#fff3b8,#f5bd35);
  box-shadow:0 0 12px rgba(255,220,120,.8);
  animation:progress 5s linear forwards;
}

@keyframes progress{
  from{width:0;}
  to{width:100%;}
}

.copyright{
  position:absolute;
  bottom:25px;
  left:0;
  width:100%;
  text-align:center;
  color:rgba(255,255,255,.65);
  font-size:10px;
  letter-spacing:1px;
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="splash" id="splash">

  <div class="splash-content">

    <div class="logo-emblem">
      <span>🛍</span>
    </div>

    <div class="brand-name">
      RUBALIA
    </div>

    <div class="brand-subtitle">
      NETWORK
    </div>

    <div class="brand-line"></div>

    <div class="slogan">
      SHOP SMART. EARN TOGETHER.
    </div>

    <div class="loading-area">

      <div class="loading-text">
        WELCOME TO RUBALIA
      </div>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>

    </div>

  </div>

  <div class="copyright">
    © <span id="year"></span> RUBALIA NETWORK
  </div>

</div>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";
const SPLASH_DURATION = 5000;

const splash = document.getElementById("splash");

document.getElementById("year").textContent =
  new Date().getFullYear();

/*
  STEP 1:
  Display splash screen for exactly 5 seconds.
*/

function waitForSplash(){
  return new Promise(function(resolve){
    window.setTimeout(resolve,SPLASH_DURATION);
  });
}

/*
  STEP 2:
  Verify existing session with backend.
*/

async function verifyExistingSession(){

  const token = sessionStorage.getItem("rubalia_token");

  if(!token){
    return null;
  }

  try{

    const response = await fetch(API_BASE + "/auth/me",{
      method:"GET",
      headers:{
        "Authorization":"Bearer " + token,
        "Accept":"application/json"
      }
    });

    const data = await response.json().catch(function(){
      return {};
    });

    if(!response.ok || !data.success || !data.user){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      return null;
    }

    sessionStorage.setItem(
      "rubalia_user",
      JSON.stringify(data.user)
    );

    return data.user;

  }catch(error){

    /*
      If the backend cannot be reached,
      do not trust cached user role.
      Continue to login page.
    */

    return null;

  }

}

/*
  STEP 3:
  Redirect according to verified role.
*/

function redirectUser(user){

  if(!user){
    window.location.replace("login.html");
    return;
  }

  const role = String(user.role || "").trim().toLowerCase();

  if(role === "admin"){
    window.location.replace("admin-dashboard.html");
    return;
  }

  window.location.replace("dashboard.html");

}

/*
  START APPLICATION
*/

async function startApplication(){

  const splashTimer = waitForSplash();

  const userPromise = verifyExistingSession();

  const results = await Promise.all([
    splashTimer,
    userPromise
  ]);

  const user = results[1];

  splash.classList.add("hide");

  window.setTimeout(function(){
    redirectUser(user);
  },350);

}

startApplication();

</script>

</body>
</html>
