
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="RUBALIA NETWORK Packages">
<title>Packages | RUBALIA NETWORK</title>

<style>
:root{
 --navy:#071a35;
 --navy2:#102b50;
 --gold:#d6ad55;
 --orange:#f57224;
 --red:#e53955;
 --bg:#f1f2f5;
 --white:#fff;
 --text:#212121;
 --muted:#757575;
 --border:#e8e8e8;
 --green:#16804b;
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

a{text-decoration:none;color:inherit}
button,input{font:inherit}

/* HEADER */

.app-header{
 position:sticky;
 top:0;
 z-index:100;
 min-height:68px;
 padding:9px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 background:linear-gradient(110deg,var(--navy),var(--navy2));
 color:white;
 box-shadow:0 2px 8px rgba(0,0,0,.13);
}

.header-left{
 display:flex;
 align-items:center;
 gap:10px;
 min-width:0;
}

.back-button{
 width:38px;
 height:38px;
 border:1px solid rgba(255,255,255,.25);
 border-radius:9px;
 background:rgba(255,255,255,.09);
 color:white;
 font-size:23px;
 cursor:pointer;
 flex-shrink:0;
}

.brand{
 display:flex;
 align-items:center;
 gap:9px;
 min-width:0;
}

.brand-icon{
 width:42px;
 height:42px;
 border-radius:12px;
 background:linear-gradient(140deg,#ffe66b,#ffc107,#e99b00);
 display:flex;
 align-items:center;
 justify-content:center;
 color:var(--navy);
 font-size:25px;
 font-weight:900;
 flex-shrink:0;
}

.brand-text{
 font-size:14px;
 font-weight:900;
 letter-spacing:.5px;
 white-space:nowrap;
}

.brand-text span{color:#ffd54f}

.brand-text small{
 display:block;
 font-size:8px;
 letter-spacing:2.5px;
 color:#d8e7f8;
 margin-top:3px;
}

.orders-button{
 padding:10px 12px;
 border:1px solid rgba(0,180,255,.65);
 border-radius:9px;
 background:#0757a9;
 color:white;
 font-size:11px;
 font-weight:bold;
 white-space:nowrap;
}

/* MAIN */

main{
 width:100%;
 max-width:1150px;
 margin:auto;
 padding:15px 14px 45px;
}

/* CATEGORY TITLE */

.category-heading{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:14px;
 padding:4px 2px;
}

.category-heading h1{
 margin:0;
 font-size:19px;
 font-weight:800;
 color:#222;
}

.category-heading p{
 margin:5px 0 0;
 font-size:11px;
 color:var(--muted);
}

.category-tag{
 padding:7px 10px;
 border-radius:20px;
 background:#fff5e9;
 color:#e86b19;
 font-size:10px;
 font-weight:bold;
 white-space:nowrap;
}

/* SEARCH BAR */

.search-section{
 display:flex;
 gap:8px;
 align-items:center;
 margin-bottom:17px;
}

.search-box{
 flex:1;
 min-width:0;
 display:flex;
 align-items:center;
 height:48px;
 padding:0 12px;
 border:1px solid #ddd;
 border-radius:30px;
 background:white;
 box-shadow:0 2px 5px rgba(0,0,0,.035);
}

.search-icon{
 color:#999;
 font-size:23px;
 margin-right:9px;
}

.search-box input{
 width:100%;
 min-width:0;
 border:0;
 outline:none;
 background:transparent;
 font-size:13px;
 color:#333;
}

.search-box input::placeholder{color:#999}

.search-btn{
 height:39px;
 padding:0 17px;
 border:0;
 border-radius:22px;
 background:var(--orange);
 color:white;
 font-size:12px;
 font-weight:bold;
 cursor:pointer;
}

.refresh-btn{
 width:43px;
 height:43px;
 flex-shrink:0;
 border:1px solid #ddd;
 border-radius:50%;
 background:white;
 color:#555;
 font-size:19px;
 cursor:pointer;
}

.refresh-btn:disabled{
 opacity:.5;
 cursor:wait;
}

/* RESULTS BAR */

.results-bar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:0 1px 11px;
}

.results-bar strong{
 font-size:12px;
 color:#333;
}

.results-bar span{
 font-size:10px;
 color:#888;
}

/* PRODUCT GRID */

.package-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
 align-items:stretch;
}

/* PRODUCT CARD */

.item-card{
 min-width:0;
 overflow:hidden;
 background:white;
 border-radius:11px;
 border:1px solid #ededed;
 box-shadow:0 2px 6px rgba(0,0,0,.045);
 transition:transform .2s,box-shadow .2s;
}

.item-card:hover{
 transform:translateY(-2px);
 box-shadow:0 5px 13px rgba(0,0,0,.09);
}

/* PRODUCT IMAGE */

.item-image{
 width:100%;
 aspect-ratio:1/1;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fff;
 position:relative;
}

.item-image img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.image-placeholder{
 width:100%;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#f7f7f7;
 color:#c2a15a;
 font-size:45px;
}

/* PRODUCT INFORMATION */

.item-info{
 padding:10px 10px 11px;
}

.item-name{
 min-height:35px;
 margin:0 0 8px;
 color:#292929;
 font-size:12px;
 font-weight:500;
 line-height:1.5;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden;
 overflow-wrap:anywhere;
}

.item-price{
 color:#e53955;
 font-size:19px;
 font-weight:800;
 margin-bottom:7px;
}

.item-stock{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:5px;
 margin-bottom:10px;
 color:#777;
 font-size:10px;
}

.stock-value{
 color:#16804b;
 font-weight:bold;
}

.stock-value.out{color:#dc3545}

.product-divider{
 height:1px;
 background:#f0f0f0;
 margin-bottom:9px;
}

/* BUY BUTTON */

.buy-btn{
 width:100%;
 min-height:36px;
 border:0;
 border-radius:7px;
 background:linear-gradient(110deg,#f57224,#ff914d);
 color:white;
 font-size:11px;
 font-weight:900;
 cursor:pointer;
 transition:.2s;
}

.buy-btn:active{
 transform:scale(.97);
}

.buy-btn:disabled{
 background:#bbb;
 cursor:not-allowed;
}

/* EMPTY / LOADING STATES */

.state-box{
 grid-column:1/-1;
 padding:45px 15px;
 border-radius:12px;
 background:white;
 text-align:center;
 border:1px solid #eee;
}

.state-icon{
 font-size:40px;
 margin-bottom:12px;
}

.state-box h3{
 margin:0 0 8px;
 color:#333;
 font-size:16px;
}

.state-box p{
 margin:0;
 color:#888;
 font-size:12px;
 line-height:1.7;
}

.state-box button{
 margin-top:14px;
 padding:10px 20px;
 border:0;
 border-radius:7px;
 background:var(--orange);
 color:white;
 font-size:12px;
 font-weight:bold;
 cursor:pointer;
}

/* NOTICE */

.notice{
 display:none;
 margin:0 0 13px;
 padding:12px;
 border-radius:8px;
 font-size:12px;
 line-height:1.6;
}

.notice.error{
 display:block;
 background:#fff0f0;
 color:#c62828;
 border:1px solid #ffcaca;
}

.notice.success{
 display:block;
 background:#effaf3;
 color:#16804b;
 border:1px solid #c6ead2;
}

/* FOOTER */

footer{
 margin-top:35px;
 padding:25px 12px;
 background:linear-gradient(110deg,#071a35,#102b50);
 color:#c7d5e8;
 text-align:center;
 font-size:11px;
}

footer strong{color:#ffd54f}

/* DESKTOP */

@media(min-width:701px){

 main{
  padding:25px 22px 55px;
 }

 .package-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
 }

 .item-image{
  aspect-ratio:1/1;
 }

 .item-info{
  padding:13px;
 }

 .item-name{
  font-size:14px;
  min-height:42px;
 }

 .item-price{
  font-size:22px;
 }

 .buy-btn{
  min-height:40px;
  font-size:12px;
 }
}

/* SMALL MOBILE */

@media(max-width:360px){

 .app-header{padding:8px}

 .brand-text{font-size:11px}

 .brand-icon{
  width:36px;
  height:36px;
  font-size:22px;
 }

 .orders-button{
  padding:9px 7px;
  font-size:9px;
 }

 main{padding:12px 9px 35px}

 .package-grid{gap:8px}

 .item-info{padding:8px}

 .item-name{font-size:11px}

 .item-price{font-size:17px}

 .buy-btn{font-size:10px}
}
</style>
</head>

<body>

<header class="app-header">

 <div class="header-left">

  <button class="back-button" id="backButton"
   type="button" aria-label="Go back">←</button>

  <a href="dashboard.html" class="brand">
   <div class="brand-icon">R</div>

   <div class="brand-text">
    RUBALIA <span>NETWORK</span>
    <small>GROW WITH TRUST</small>
   </div>
  </a>

 </div>

 <a href="orders.html" class="orders-button">
  📦 My Orders
 </a>

</header>

<main>

 <section class="category-heading">

  <div>
   <h1 id="categoryTitle">Our Packages</h1>
   <p>Discover products and packages from RUBALIA NETWORK.</p>
  </div>

  <div class="category-tag">✦ OFFICIAL STORE</div>

 </section>

 <div class="notice" id="notice" role="status"></div>

 <section class="search-section">

  <div class="search-box">
   <span class="search-icon">⌕</span>

   <input type="search"
    id="searchInput"
    placeholder="Search packages..."
    autocomplete="off">

   <button class="search-btn" id="searchBtn" type="button">
    Search
   </button>
  </div>

  <button class="refresh-btn" id="refreshBtn"
   type="button" aria-label="Refresh packages">↻</button>

 </section>

 <div class="results-bar">
  <strong>Available Packages</strong>
  <span id="resultCount">Loading...</span>
 </div>

 <section id="packages">

  <div class="package-grid" id="packageGrid">

   <div class="state-box">
    <div class="state-icon">⏳</div>
    <h3>Loading Packages</h3>
    <p>Please wait while we load available packages.</p>
   </div>

  </div>

 </section>

</main>

<footer>
 © <strong>RUBALIA NETWORK</strong> — All Rights Reserved.
</footer>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

let allPackages = [];
let loading = false;

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const selectedCategory = (params.get("category") || "").trim();

$("categoryTitle").textContent = selectedCategory || "Our Packages";
document.title = (selectedCategory || "Packages") + " | RUBALIA NETWORK";

/* BACK BUTTON */

$("backButton").addEventListener("click",()=>{
 if(history.length > 1){
  history.back();
 }else{
  location.href = "dashboard.html";
 }
});

/* HELPERS */

function safeImageURL(value){
 if(!value) return "";

 try{
  const url = new URL(value,location.href);

  if(url.protocol==="https:" || url.protocol==="http:"){
   return url.href;
  }
 }catch(error){}

 return "";
}

function formatPrice(value){
 const number = Number(value);

 if(!Number.isFinite(number)){
  return "Price unavailable";
 }

 return "৳ " + number.toLocaleString("en-BD",{
  maximumFractionDigits:2
 });
}

function showNotice(type,text){
 const notice = $("notice");
 notice.className = "notice " + type;
 notice.textContent = text;
}

function clearNotice(){
 $("notice").className = "notice";
 $("notice").textContent = "";
}

/* LOADING STATE */

function showState(container,icon,title,description,buttonText){
 container.replaceChildren();

 const box = document.createElement("div");
 box.className = "state-box";

 const iconElement = document.createElement("div");
 iconElement.className = "state-icon";
 iconElement.textContent = icon;

 const heading = document.createElement("h3");
 heading.textContent = title;

 const paragraph = document.createElement("p");
 paragraph.textContent = description;

 box.append(iconElement,heading,paragraph);

 if(buttonText){
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = buttonText;
  button.addEventListener("click",loadStore);
  box.appendChild(button);
 }

 container.appendChild(box);
}

/* API */

async function fetchJSON(path,token){

 const response = await fetch(API_BASE+path,{
  method:"GET",
  headers:{
   "Accept":"application/json",
   "Authorization":"Bearer "+token
  },
  cache:"no-store"
 });

 const data = await response.json().catch(()=>({}));

 if(response.status===401 || response.status===403){
  sessionStorage.removeItem("rubalia_token");
  sessionStorage.removeItem("rubalia_user");
  location.replace("login.html");
  throw new Error("Your login session has expired.");
 }

 if(!response.ok || data.success===false){
  throw new Error(
   data.message || "Unable to load store information."
  );
 }

 return data;
}

/* AUTHENTICATION */

async function verifySession(){

 const token = sessionStorage.getItem("rubalia_token");

 if(!token){

  const currentUrl = location.pathname + location.search;

  location.replace(
   "login.html?redirect="+encodeURIComponent(currentUrl)
  );

  throw new Error("Login required.");
 }

 const data = await fetchJSON("/auth/me",token);

 const user = data.user || data.profile;

 if(!user){
  throw new Error("Unable to verify your account.");
 }

 if(String(user.role || "").toLowerCase()==="admin"){
  location.replace("admin-dashboard.html");
  throw new Error("Opening Admin Dashboard.");
 }

 if(
  user.status &&
  String(user.status).toLowerCase()!=="active"
 ){
  sessionStorage.removeItem("rubalia_token");
  sessionStorage.removeItem("rubalia_user");
  location.replace("login.html");
  throw new Error("Your account is not active.");
 }

 return token;
}

/* BUY NOW */

function buyPackage(id){

 const packageId = Number(id);

 if(!Number.isSafeInteger(packageId) || packageId<=0){
  alert("Invalid package. Please try again.");
  return;
 }

 const token = sessionStorage.getItem("rubalia_token");

 const checkoutURL =
  "checkout.html?type=package&id="+encodeURIComponent(packageId);

 if(!token){
  location.href =
   "login.html?redirect="+encodeURIComponent(checkoutURL);
  return;
 }

 location.href = checkoutURL;
}

/* PACKAGE RENDER */

function renderPackages(packages){

 const grid = $("packageGrid");
 grid.replaceChildren();

 $("resultCount").textContent =
  packages.length + " items";

 if(!packages.length){

  showState(
   grid,
   "📦",
   "No Packages Available",
   "No matching packages were found. Try another search."
  );

  return;
 }

 packages.forEach(item=>{

  const id = Number(item.id);

  const validPackageId =
   Number.isSafeInteger(id) && id>0;

  const name = item.name || "RUBALIA Package";

  const card = document.createElement("article");
  card.className = "item-card";

  /* IMAGE */

  const imageBox = document.createElement("div");
  imageBox.className = "item-image";

  const imageURL = safeImageURL(item.image_url);

  if(imageURL){

   const image = document.createElement("img");

   image.src = imageURL;
   image.alt = name;
   image.loading = "lazy";

   image.addEventListener("error",()=>{

    imageBox.replaceChildren();

    const placeholder = document.createElement("div");
    placeholder.className = "image-placeholder";
    placeholder.textContent = "📦";

    imageBox.appendChild(placeholder);

   });

   imageBox.appendChild(image);

  }else{

   const placeholder = document.createElement("div");
   placeholder.className = "image-placeholder";
   placeholder.textContent = "📦";

   imageBox.appendChild(placeholder);
  }

  /* PRODUCT INFORMATION */

  const info = document.createElement("div");
  info.className = "item-info";

  const title = document.createElement("h3");
  title.className = "item-name";
  title.textContent = name;

  const price = document.createElement("div");
  price.className = "item-price";
  price.textContent = formatPrice(item.price);

  /* STOCK */

  const stockKnown =
   item.stock!==null &&
   item.stock!==undefined &&
   item.stock!=="";

  const stock = Number(item.stock);

  const outOfStock = stockKnown && stock<=0;

  const stockRow = document.createElement("div");
  stockRow.className = "item-stock";

  const stockLabel = document.createElement("span");
  stockLabel.textContent = "Availability";

  const stockValue = document.createElement("span");
  stockValue.className = "stock-value" + (outOfStock?" out":"");

  stockValue.textContent = stockKnown
   ? (outOfStock?"Out of Stock":"Stock: "+stock)
   : "Stock unavailable";

  stockRow.append(stockLabel,stockValue);

  /* DIVIDER */

  const divider = document.createElement("div");
  divider.className = "product-divider";

  /* BUY BUTTON */

  const buy = document.createElement("button");

  buy.className = "buy-btn";
  buy.type = "button";

  buy.textContent = outOfStock
   ? "OUT OF STOCK"
   : "BUY NOW";

  buy.disabled = outOfStock || !validPackageId;

  buy.addEventListener("click",()=>{
   buyPackage(id);
  });

  info.append(
   title,
   price,
   stockRow,
   divider,
   buy
  );

  card.append(imageBox,info);

  grid.appendChild(card);

 });
}

/* SEARCH + CATEGORY FILTER */

function filterPackages(){

 const query = $("searchInput").value.trim().toLowerCase();

 const filtered = allPackages.filter(item=>{

  const categoryMatches =
   !selectedCategory ||
   String(item.category || "").trim().toLowerCase() ===
   selectedCategory.toLowerCase();

  const searchMatches = [
   item.name,
   item.description,
   item.category
  ].some(value=>
   String(value || "").toLowerCase().includes(query)
  );

  return categoryMatches && searchMatches;

 });

 renderPackages(filtered);
}

/* SEARCH EVENTS */

$("searchInput").addEventListener("input",filterPackages);

$("searchBtn").addEventListener("click",filterPackages);

$("searchInput").addEventListener("keydown",event=>{
 if(event.key==="Enter"){
  event.preventDefault();
  filterPackages();
 }
});

/* LOAD PACKAGES */

async function loadStore(){

 if(loading) return;

 loading = true;

 clearNotice();

 const refreshButton = $("refreshBtn");

 refreshButton.disabled = true;
 refreshButton.textContent = "…";

 const grid = $("packageGrid");

 showState(
  grid,
  "⏳",
  "Loading Packages",
  "Please wait while packages are loading."
 );

 try{

  const token = await verifySession();

  const packageData = await fetchJSON("/packages",token);

  allPackages = Array.isArray(packageData.packages)
   ? packageData.packages
   : [];

  filterPackages();

 }catch(error){

  const ignoredErrors = [
   "Login required.",
   "Opening Admin Dashboard.",
   "Your account is not active.",
   "Your login session has expired."
  ];

  if(!ignoredErrors.includes(error.message)){

   showNotice(
    "error",
    error.message || "Unable to load packages. Please try again."
   );

   showState(
    grid,
    "⚠️",
    "Packages Could Not Load",
    "Please check your connection and try again.",
    "Retry"
   );

   $("resultCount").textContent = "Unavailable";
  }

 }finally{

  loading = false;

  refreshButton.disabled = false;
  refreshButton.textContent = "↻";
 }
}

/* START */

$("refreshBtn").addEventListener("click",loadStore);

loadStore();

</script>

</body>
</html>
