
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#310d35">
<meta name="description" content="RUBALIA NETWORK Packages">
<title>Packages | RUBALIA NETWORK</title>

<style>
:root{
  --red:#a71952;
  --pink:#e72c76;
  --dark:#21172f;
  --gold:#e5bd68;
  --bg:#f7f5f9;
  --white:#fff;
  --text:#29243a;
  --muted:#858196;
  --border:#eae6ee;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}

/* HEADER */
.app-header{
  min-height:76px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 22px;
  color:white;
  background:linear-gradient(110deg,#24112f,#4b104f,#a51e43);
  box-shadow:0 4px 15px rgba(35,10,45,.18);
  position:relative;
  z-index:100;
}
.header-left{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}
.back-button{
  width:48px;
  height:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.09);
  color:white;
  border-radius:12px;
  font-size:27px;
  cursor:pointer;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.brand-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(140deg,#ffe58a,#e6a928);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#512a83;
  font-size:27px;
  font-weight:900;
  flex-shrink:0;
  box-shadow:0 4px 10px rgba(0,0,0,.18),
  inset 0 2px 4px rgba(255,255,255,.6);
}
.brand-text{
  font-size:17px;
  font-weight:900;
  letter-spacing:1px;
  white-space:nowrap;
}
.brand-text span{color:#ffe58a}
.brand-text small{
  display:block;
  font-size:9px;
  letter-spacing:3px;
  color:#f5dca4;
  margin-top:4px;
}
.orders-button{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:11px;
  padding:12px 15px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

/* MAIN */
main{
  max-width:1150px;
  margin:auto;
  padding:22px 20px 50px;
}

/* CATEGORY */
.category-heading{
  margin:0 0 22px;
  padding:23px 15px;
  text-align:center;
  color:white;
  border-radius:20px;
  background:linear-gradient(110deg,#24112f,#4b104f,#a51e43);
  box-shadow:0 8px 20px rgba(60,20,60,.13);
}
.category-heading h1{
  margin:0;
  font-size:27px;
  font-weight:900;
}
.category-heading p{
  margin:9px 0 0;
  font-size:14px;
  color:#f4e6f0;
}

/* SEARCH */
.search-section{
  margin:0 0 22px;
  display:flex;
  align-items:center;
  gap:12px;
}
.search-box{
  flex:1;
  position:relative;
}
.search-box input{
  width:100%;
  height:54px;
  padding:0 15px 0 45px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  outline:none;
  color:var(--text);
  font-size:15px;
}
.search-box input:focus{border-color:#c64d81}
.search-icon{
  position:absolute;
  left:16px;
  top:17px;
  color:#9c91a4;
  font-size:19px;
}
.refresh-btn{
  border:1px solid var(--border);
  background:white;
  color:#6d5269;
  padding:17px 18px;
  border-radius:13px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}
.refresh-btn:disabled{
  opacity:.5;
  cursor:wait;
}

/* PACKAGE GRID */
.package-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start;
}
.item-card{
  min-width:0;
  overflow:hidden;
  position:relative;
  border-radius:16px;
  background:linear-gradient(145deg,#fff,#f2edff,#e6f4ff);
  border:1px solid rgba(151,119,198,.3);
  box-shadow:0 8px 18px rgba(66,43,110,.12),
  0 3px 6px rgba(66,43,110,.06),
  inset 0 1px 0 #fff;
  transition:transform .25s,box-shadow .25s;
}
.item-card:hover{
  transform:translateY(-3px);
  box-shadow:0 13px 23px rgba(66,43,110,.17);
}

/* PACKAGE IMAGE */
.item-image{
  width:100%;
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#e9dcff,#dceaff,#d9f5ed);
}
.item-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.image-placeholder{
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  color:#9974c1;
  font-size:45px;
}

/* PRICE CARD - DIRECTLY BELOW IMAGE */
.item-price-card{
  padding:12px;
  background:linear-gradient(145deg,#f8f4ff,#eaf0ff,#edf9f8);
}
.item-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:13px;
  border-radius:11px;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.22),transparent 45%),
    linear-gradient(145deg,#164b79,#087e91 52%,#20a99c);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:
    0 4px 0 #103d60,
    0 7px 10px rgba(12,74,105,.17),
    inset 0 1px 3px rgba(255,255,255,.4);
}
.price-stock{
  min-width:0;
  flex:1;
}
.item-price{
  color:#fff;
  font-size:19px;
  font-weight:900;
  overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.2);
}
.item-price small{
  display:block;
  margin-bottom:6px;
  color:#d9fff6;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:none;
}
.item-stock{
  margin-top:8px;
  color:#e1fff0;
  font-size:12px;
  font-weight:bold;
}
.item-stock.out{color:#ffe0e0}
.buy-btn{
  display:inline-block;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.5);
  padding:13px 14px;
  border-radius:10px;
  background:linear-gradient(145deg,#ff5597,#e51e70 55%,#a80f50);
  color:white;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:
    0 4px 0 #78103d,
    0 6px 9px rgba(100,10,50,.22),
    inset 0 1px 3px rgba(255,255,255,.45);
  transition:.2s;
}
.buy-btn:hover{transform:translateY(-2px)}
.buy-btn:active{transform:translateY(2px)}
.buy-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* STATES */
.state-box{
  grid-column:1/-1;
  padding:40px 15px;
  border:1px dashed #dcd3e0;
  border-radius:14px;
  background:white;
  text-align:center;
}
.state-icon{
  font-size:35px;
  margin-bottom:10px;
}
.state-box h3{
  margin:0 0 8px;
  color:#3b2d46;
  font-size:17px;
}
.state-box p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}
.state-box button{
  margin-top:14px;
  border:0;
  padding:11px 17px;
  border-radius:9px;
  color:white;
  background:#a51d54;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}
.notice{
  display:none;
  margin:0 0 15px;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  line-height:1.6;
}
.notice.error{
  display:block;
  background:#fff0f1;
  color:#a12b36;
  border:1px solid #f4cbd0;
}
.notice.success{
  display:block;
  background:#effaf3;
  color:#17633b;
  border:1px solid #c6ead2;
}

/* FOOTER */
footer{
  padding:25px 15px;
  background:linear-gradient(110deg,#17152f,#74133e);
  color:#d9cbd9;
  text-align:center;
  font-size:11px;
}
footer strong{color:#f4d58c}

/* MOBILE */
@media(max-width:700px){
  .app-header{
    min-height:65px;
    padding:0 11px;
    gap:7px;
  }
  .header-left{gap:9px}
  .back-button{
    width:41px;
    height:41px;
    font-size:25px;
    border-radius:10px;
  }
  .brand{gap:7px}
  .brand-icon{
    width:40px;
    height:40px;
    font-size:23px;
    border-radius:12px;
  }
  .brand-text{
    font-size:13px;
    letter-spacing:.5px;
  }
  .brand-text small{
    font-size:7px;
    letter-spacing:2.5px;
    margin-top:3px;
  }
  .orders-button{
    padding:10px 9px;
    font-size:10px;
    border-radius:9px;
  }
  main{padding:17px 11px 35px}
  .category-heading{
    margin-bottom:17px;
    padding:22px 12px;
    border-radius:17px;
  }
  .category-heading h1{font-size:23px}
  .category-heading p{font-size:13px}
  .search-section{
    margin-bottom:18px;
    gap:9px;
  }
  .search-box input{
    height:48px;
    font-size:13px;
    padding-left:39px;
  }
  .search-icon{
    left:13px;
    top:14px;
  }
  .refresh-btn{
    padding:15px 11px;
    font-size:11px;
  }
  .package-grid{gap:9px}
  .item-image{height:125px}
  .item-price-card{padding:7px}
  .item-bottom{
    padding:9px;
    gap:6px;
    border-radius:9px;
    box-shadow:
      0 3px 0 #103d60,
      0 5px 8px rgba(12,74,105,.15),
      inset 0 1px 2px rgba(255,255,255,.4);
  }
  .item-price{font-size:14px}
  .item-price small{font-size:8px}
  .item-stock{
    font-size:10px;
    margin-top:6px;
  }
  .buy-btn{
    padding:10px 9px;
    font-size:10px;
    border-radius:8px;
  }
}
@media(max-width:360px){
  .brand-text{font-size:11px}
  .brand-icon{
    width:36px;
    height:36px;
  }
  .orders-button{
    font-size:9px;
    padding:9px 7px;
  }
  .back-button{
    width:37px;
    height:37px;
  }
  .item-image{height:100px}
  .item-price-card{padding:5px}
  .item-bottom{padding:7px}
  .item-price{font-size:12px}
  .buy-btn{
    padding:8px 6px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-left">
    <button class="back-button" id="backButton"
      type="button" aria-label="Go back">←</button>

    <a href="dashboard.html" class="brand">
      <div class="brand-icon">R</div>
      <div class="brand-text">
        RUBALIA <span>NETWORK</span>
        <small>GROW WITH TRUST</small>
      </div>
    </a>
  </div>

  <a href="orders.html" class="orders-button">📦 My Orders</a>
</header>

<main>

  <section class="category-heading">
    <h1 id="categoryTitle">Our Packages</h1>
    <p>Browse packages available in this category.</p>
  </section>

  <div class="notice" id="notice" role="status"></div>

  <section class="search-section">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="search" id="searchInput"
        placeholder="Search packages..." autocomplete="off">
    </div>
    <button class="refresh-btn" id="refreshBtn" type="button">
      ↻ Refresh
    </button>
  </section>

  <section id="packages">
    <div class="package-grid" id="packageGrid">
      <div class="state-box">
        <div class="state-icon">⏳</div>
        <h3>Loading Packages</h3>
        <p>Please wait while we load available packages.</p>
      </div>
    </div>
  </section>

</main>

<footer>
  © <strong>RUBALIA NETWORK</strong> — All Rights Reserved.
</footer>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

let allPackages = [];
let loading = false;

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const selectedCategory = (params.get("category") || "").trim();

$("categoryTitle").textContent = selectedCategory || "Our Packages";
document.title = (selectedCategory || "Packages") + " | RUBALIA NETWORK";

$("backButton").addEventListener("click",()=>{
  if(history.length > 1){
    history.back();
  }else{
    location.href = "dashboard.html";
  }
});

/* HELPERS */
function safeImageURL(value){
  if(!value) return "";
  try{
    const url = new URL(value,location.href);
    if(url.protocol==="https:" || url.protocol==="http:"){
      return url.href;
    }
  }catch(error){}
  return "";
}

function formatPrice(value){
  const number = Number(value);
  if(!Number.isFinite(number)) return "Price unavailable";
  return "৳ " + number.toLocaleString("en-BD",{
    maximumFractionDigits:2
  });
}

function showNotice(type,text){
  const notice = $("notice");
  notice.className = "notice " + type;
  notice.textContent = text;
}

function clearNotice(){
  $("notice").className = "notice";
  $("notice").textContent = "";
}

/* LOADING STATE */
function showState(container,icon,title,description,buttonText){
  container.replaceChildren();

  const box = document.createElement("div");
  box.className = "state-box";

  const iconElement = document.createElement("div");
  iconElement.className = "state-icon";
  iconElement.textContent = icon;

  const heading = document.createElement("h3");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = description;

  box.append(iconElement,heading,paragraph);

  if(buttonText){
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = buttonText;
    button.addEventListener("click",loadStore);
    box.appendChild(button);
  }

  container.appendChild(box);
}

/* API */
async function fetchJSON(path,token){
  const response = await fetch(API_BASE+path,{
    method:"GET",
    headers:{
      "Accept":"application/json",
      "Authorization":"Bearer "+token
    },
    cache:"no-store"
  });

  const data = await response.json().catch(()=>({}));

  if(response.status===401 || response.status===403){
    sessionStorage.removeItem("rubalia_token");
    sessionStorage.removeItem("rubalia_user");
    location.replace("login.html");
    throw new Error("Your login session has expired.");
  }

  if(!response.ok || data.success===false){
    throw new Error(
      data.message || "Unable to load store information."
    );
  }

  return data;
}

/* AUTHENTICATION */
async function verifySession(){
  const token = sessionStorage.getItem("rubalia_token");

  if(!token){
    const currentUrl = location.pathname + location.search;
    location.replace(
      "login.html?redirect="+encodeURIComponent(currentUrl)
    );
    throw new Error("Login required.");
  }

  const data = await fetchJSON("/auth/me",token);
  const user = data.user || data.profile;

  if(!user){
    throw new Error("Unable to verify your account.");
  }

  if(String(user.role || "").toLowerCase()==="admin"){
    location.replace("admin-dashboard.html");
    throw new Error("Opening Admin Dashboard.");
  }

  if(
    user.status &&
    String(user.status).toLowerCase()!=="active"
  ){
    sessionStorage.removeItem("rubalia_token");
    sessionStorage.removeItem("rubalia_user");
    location.replace("login.html");
    throw new Error("Your account is not active.");
  }

  return token;
}

/* BUY NOW */
function buyPackage(id){
  const packageId = Number(id);

  if(!Number.isSafeInteger(packageId) || packageId<=0){
    alert("Invalid package. Please try again.");
    return;
  }

  const token = sessionStorage.getItem("rubalia_token");

  const checkoutURL =
    "checkout.html?type=package&id="+encodeURIComponent(packageId);

  if(!token){
    location.href =
      "login.html?redirect="+encodeURIComponent(checkoutURL);
    return;
  }

  location.href = checkoutURL;
}

/* PACKAGE RENDER */
function renderPackages(packages){
  const grid = $("packageGrid");
  grid.replaceChildren();

  if(!packages.length){
    showState(
      grid,
      "📦",
      "No Packages Available",
      "There are currently no active packages available."
    );
    return;
  }

  packages.forEach(item=>{
    const id = Number(item.id);
    const validPackageId =
      Number.isSafeInteger(id) && id>0;

    const name = item.name || "RUBALIA Package";

    const card = document.createElement("article");
    card.className = "item-card";

    /* IMAGE */
    const imageBox = document.createElement("div");
    imageBox.className = "item-image";

    const imageURL = safeImageURL(item.image_url);

    if(imageURL){
      const image = document.createElement("img");
      image.src = imageURL;
      image.alt = name;
      image.loading = "lazy";

      image.addEventListener("error",()=>{
        imageBox.replaceChildren();

        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "📦";

        imageBox.appendChild(placeholder);
      });

      imageBox.appendChild(image);
    }else{
      const placeholder = document.createElement("div");
      placeholder.className = "image-placeholder";
      placeholder.textContent = "📦";
      imageBox.appendChild(placeholder);
    }

    /* PRICE CARD - RIGHT BELOW IMAGE */
    const priceCard = document.createElement("div");
    priceCard.className = "item-price-card";

    const bottom = document.createElement("div");
    bottom.className = "item-bottom";

    const priceStock = document.createElement("div");
    priceStock.className = "price-stock";

    const price = document.createElement("div");
    price.className = "item-price";

    const priceLabel = document.createElement("small");
    priceLabel.textContent = "PACKAGE PRICE";

    price.append(
      priceLabel,
      document.createTextNode(formatPrice(item.price))
    );

    const stockKnown =
      item.stock!==null &&
      item.stock!==undefined &&
      item.stock!=="";

    const stock = Number(item.stock);
    const outOfStock = stockKnown && stock<=0;

    const stockText = document.createElement("div");
    stockText.className =
      "item-stock"+(outOfStock?" out":"");

    stockText.textContent = stockKnown
      ? (outOfStock?"Out of Stock":"Stock: "+stock)
      : "Stock unavailable";

    priceStock.append(price,stockText);

    const buy = document.createElement("button");
    buy.className = "buy-btn";
    buy.type = "button";
    buy.textContent = outOfStock
      ? "UNAVAILABLE"
      : "BUY NOW";

    buy.disabled = outOfStock || !validPackageId;

    buy.addEventListener("click",()=>{
      buyPackage(id);
    });

    bottom.append(priceStock,buy);
    priceCard.appendChild(bottom);

    /* FINAL CARD */
    card.append(imageBox,priceCard);
    grid.appendChild(card);
  });
}

/* SEARCH + CATEGORY FILTER */
function filterPackages(){
  const query = $("searchInput").value.trim().toLowerCase();

  const filtered = allPackages.filter(item=>{
    const categoryMatches =
      !selectedCategory ||
      String(item.category || "").trim().toLowerCase() ===
      selectedCategory.toLowerCase();

    const searchMatches = [
      item.name,
      item.description,
      item.category
    ].some(value=>
      String(value || "").toLowerCase().includes(query)
    );

    return categoryMatches && searchMatches;
  });

  renderPackages(filtered);
}

$("searchInput").addEventListener("input",filterPackages);

/* LOAD PACKAGES */
async function loadStore(){
  if(loading) return;

  loading = true;
  clearNotice();

  const refreshButton = $("refreshBtn");

  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";

  const grid = $("packageGrid");

  showState(
    grid,
    "⏳",
    "Loading Packages",
    "Please wait while packages are loading."
  );

  try{
    const token = await verifySession();

    const packageData = await fetchJSON("/packages",token);

    allPackages = Array.isArray(packageData.packages)
      ? packageData.packages
      : [];

    filterPackages();

  }catch(error){
    const ignoredErrors = [
      "Login required.",
      "Opening Admin Dashboard.",
      "Your account is not active.",
      "Your login session has expired."
    ];

    if(!ignoredErrors.includes(error.message)){
      showNotice(
        "error",
        error.message || "Unable to load packages. Please try again."
      );

      showState(
        grid,
        "⚠️",
        "Packages Could Not Load",
        "Please check your connection and try again.",
        "Retry"
      );
    }
  }finally{
    loading = false;
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ Refresh";
  }
}

/* START */
loadStore();

$("refreshBtn").addEventListener("click",loadStore);

</script>
</body>
</html>
