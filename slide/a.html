<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16052f">
<meta name="description" content="Welcome to Rubalia Network">
<title>Welcome | Rubalia Network</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.welcome-stage{
  width:100%;
  padding:7px;
  perspective:1200px;
  background:transparent;
}
.banner-shell{
  position:relative;
  width:100%;
  aspect-ratio:3/1;
  overflow:hidden;
  border-radius:15px;
  isolation:isolate;
  transform-style:preserve-3d;
  background:#19052f;
  box-shadow:0 10px 24px rgba(34,7,62,.24),0 0 0 1px rgba(255,214,117,.42);
  animation:bannerFloat 6s ease-in-out infinite;
}
.banner-shell::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:2;
  pointer-events:none;
  border-radius:inherit;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.22) 43%,transparent 57%);
  transform:translateX(-120%);
  animation:goldSweep 7s ease-in-out infinite;
  mix-blend-mode:screen;
}
.banner-shell::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,224,148,.5),inset 0 0 28px rgba(255,204,87,.12);
}
.welcome-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:inherit;
  transform:translateZ(0);
  animation:imageDepth 8s ease-in-out infinite;
}
.glow{
  position:absolute;
  z-index:1;
  width:24%;
  aspect-ratio:1;
  right:5%;
  top:8%;
  border-radius:50%;
  background:rgba(255,194,72,.22);
  filter:blur(30px);
  pointer-events:none;
  animation:glowPulse 4s ease-in-out infinite;
}
.spark{
  position:absolute;
  z-index:4;
  width:5px;height:5px;
  border-radius:50%;
  background:#ffe7a0;
  box-shadow:0 0 8px 3px rgba(255,208,95,.6);
  pointer-events:none;
  animation:twinkle 2.8s ease-in-out infinite;
}
.spark.one{left:8%;top:19%;animation-delay:.2s}
.spark.two{left:48%;top:16%;width:4px;height:4px;animation-delay:1.1s}
.spark.three{right:8%;top:42%;animation-delay:1.8s}
.spark.four{left:68%;bottom:15%;width:3px;height:3px;animation-delay:.7s}
@keyframes bannerFloat{
  0%,100%{transform:rotateX(0deg) rotateY(0deg) translateY(0)}
  25%{transform:rotateX(.7deg) rotateY(-.6deg) translateY(-2px)}
  50%{transform:rotateX(0deg) rotateY(.7deg) translateY(0)}
  75%{transform:rotateX(-.6deg) rotateY(0deg) translateY(-1px)}
}
@keyframes imageDepth{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.012)}
}
@keyframes goldSweep{
  0%,58%{transform:translateX(-120%)}
  82%,100%{transform:translateX(120%)}
}
@keyframes glowPulse{
  0%,100%{opacity:.35;transform:scale(.85)}
  50%{opacity:.8;transform:scale(1.12)}
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.65)}
  50%{opacity:1;transform:scale(1.35)}
}
@media(max-width:600px){
  .welcome-stage{padding:4px}
  .banner-shell{border-radius:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="welcome-stage" aria-label="Rubalia Network welcome promotional banner">
  <div class="banner-shell">
    <img class="welcome-image"
      src="../assets/images/welcome-banner.webp"
      alt="Welcome to Rubalia Network — Shop, Share, Grow, Earn">
    <span class="glow"></span>
    <span class="spark one"></span>
    <span class="spark two"></span>
    <span class="spark three"></span>
    <span class="spark four"></span>
  </div>
</main>
</body>
</html>
