<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21002f">
<title>Special Campaign | RUBALIA NETWORK</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#160020;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  perspective:1200px;
}
.campaign-stage{
  width:100%;
  max-width:1536px;
  margin:auto;
  perspective:1200px;
  transform-style:preserve-3d;
}
.campaign-card{
  width:100%;
  transform-style:preserve-3d;
  transform-origin:center center;
  animation:campaignFloat 6s ease-in-out infinite;
  will-change:transform;
  filter:drop-shadow(0 16px 22px rgba(0,0,0,.42));
}
.campaign-card svg{
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  border-radius:2px;
}
/* The original artwork remains embedded unchanged.
   Only the complete banner's presentation gets a subtle 3D motion. */
@keyframes campaignFloat{
  0%,100%{transform:rotateX(0deg) rotateY(0deg) translateY(0) scale(1)}
  25%{transform:rotateX(1.2deg) rotateY(-1.1deg) translateY(-5px) scale(1.003)}
  50%{transform:rotateX(0deg) rotateY(1.1deg) translateY(-8px) scale(1.005)}
  75%{transform:rotateX(-1deg) rotateY(-.7deg) translateY(-4px) scale(1.002)}
}
@media (prefers-reduced-motion:reduce){
  .campaign-card{animation:none}
}
</style>
</head>
<body>
<main class="campaign-stage">
  <div class="campaign-card">
    <!-- Original uploaded campaign banner embedded in SVG without editing. -->
    <svg xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 0 1536 512"
         width="1536" height="512"
         role="img"
         aria-label="Rubalia Network Special Campaign promotional banner">
      <image x="0" y="0" width="1536" height="512"
             preserveAspectRatio="none"
             href="assets/images/campaign-art-1.webp"
             xlink:href="assets/images/campaign-art-1.webp"/>
    </svg>
  </div>
</main>
</body>
</html>
