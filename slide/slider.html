<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>Rubalia Promotion Slider</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,sans-serif;
}

.slider{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

.slide-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  opacity:0;
  visibility:hidden;
  transition:opacity .6s ease;
}

.slide-frame.active{
  opacity:1;
  visibility:visible;
}

.loading,.error{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  text-align:center;
  padding:12px;
  background:linear-gradient(120deg,#24112f,#4b104f,#a51e43);
}
</style>
</head>

<body>

<div class="slider" id="slider">
  <div class="loading">Loading all Rubalia promotions...</div>
</div>

<script>
"use strict";

/*
  RUBALIA AUTO PROMOTION SLIDER

  Automatically targets EVERY .html file inside this same /slide folder,
  except slider.html itself.

  New HTML files added to /slide will be included automatically.
*/

const GITHUB_API =
  "https://api.github.com/repos/rubalia/Rubalia/contents/slide?ref=main";

const SLIDE_DURATION = 4000;
const REFRESH_DURATION = 5 * 60 * 1000;

const slider = document.getElementById("slider");

let slideFiles = [];
let frames = [];
let currentIndex = 0;
let slideTimer = null;
let refreshTimer = null;
let isLoading = false;

function showMessage(text, className = "loading"){
  clearTimeout(slideTimer);
  slider.replaceChildren();

  const box = document.createElement("div");
  box.className = className;
  box.textContent = text;

  slider.appendChild(box);
}

function showSlide(index){
  if(!frames.length) return;

  currentIndex = index;

  frames.forEach((frame, i) => {
    frame.classList.toggle("active", i === currentIndex);
  });

  clearTimeout(slideTimer);

  slideTimer = setTimeout(() => {
    showSlide((currentIndex + 1) % frames.length);
  }, SLIDE_DURATION);
}

function buildSlides(files){
  clearTimeout(slideTimer);

  slider.replaceChildren();
  frames = [];
  currentIndex = 0;

  slideFiles = files;

  slideFiles.forEach((file, index) => {
    const frame = document.createElement("iframe");

    frame.className = "slide-frame";
    frame.src = "./" + encodeURIComponent(file);
    frame.title = file;
    frame.loading = "eager";
    frame.setAttribute("scrolling", "no");
    frame.setAttribute("allowfullscreen", "");

    frame.addEventListener("error", () => {
      console.error("Rubalia slide failed to load:", file);
    });

    frames.push(frame);
    slider.appendChild(frame);
  });

  if(frames.length){
    showSlide(0);
  }else{
    showMessage("No HTML promotion files found in the slide folder.");
  }
}

async function loadSlides(){
  if(isLoading) return;
  isLoading = true;

  try{
    const response = await fetch(GITHUB_API, {
      cache: "no-store",
      headers: {
        "Accept": "application/vnd.github+json"
      }
    });

    if(!response.ok){
      throw new Error("GitHub API returned " + response.status);
    }

    const items = await response.json();

    const htmlFiles = items
      .filter(item =>
        item.type === "file" &&
        item.name.toLowerCase().endsWith(".html") &&
        item.name.toLowerCase() !== "slider.html"
      )
      .map(item => item.name)
      .sort((a, b) => a.localeCompare(b));

    const oldFiles = JSON.stringify(slideFiles);
    const newFiles = JSON.stringify(htmlFiles);

    if(oldFiles !== newFiles || frames.length === 0){
      buildSlides(htmlFiles);
    }

  }catch(error){
    console.error("Rubalia slider error:", error);

    if(frames.length === 0){
      showMessage(
        "Could not load the slide folder. Check GitHub Pages or API access.",
        "error"
      );
    }

  }finally{
    isLoading = false;
  }
}

/* Load all current HTML files. */
loadSlides();

/* Detect newly added or removed HTML files every five minutes. */
refreshTimer = setInterval(loadSlides, REFRESH_DURATION);

</script>
</body>
</html>
