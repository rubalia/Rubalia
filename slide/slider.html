
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>Rubalia Promotion Slider</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,sans-serif;
}

.slider{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

.slide-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  opacity:0;
  visibility:hidden;
  transition:opacity .6s ease;
}

.slide-frame.active{
  opacity:1;
  visibility:visible;
}

.loading,.error{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  text-align:center;
  padding:12px;
  background:linear-gradient(
    120deg,
    #24112f,
    #4b104f,
    #a51e43
  );
}
</style>
</head>

<body>

<div class="slider" id="slider">
  <div class="loading">
    Loading all Rubalia promotions...
  </div>
</div>

<script>
"use strict";

/* ================================================
   RUBALIA NETWORK PROMOTION SLIDER

   Static file list.
   GitHub API is no longer required.

   New slide add করলে নিচের SLIDE_FILES
   array-তে filename যোগ করতে হবে।
================================================ */

const SLIDE_FILES = [
  "a.html",
  "alibaba.html",
  "campain.html",
  "income.html",
  "leader.html",
  "media.html",
  "reffer.html"
];

const SLIDE_DURATION = 4000;

const slider = document.getElementById("slider");

let frames = [];
let currentIndex = 0;
let slideTimer = null;

/* ================================================
   SHOW MESSAGE
================================================ */

function showMessage(message, className = "loading"){

  clearTimeout(slideTimer);

  slider.replaceChildren();

  const box = document.createElement("div");

  box.className = className;
  box.textContent = message;

  slider.appendChild(box);
}

/* ================================================
   SHOW SLIDE
================================================ */

function showSlide(index){

  if(!frames.length) return;

  currentIndex = index;

  frames.forEach((frame,i)=>{

    frame.classList.toggle(
      "active",
      i === currentIndex
    );

  });

  clearTimeout(slideTimer);

  slideTimer = setTimeout(()=>{

    showSlide(
      (currentIndex + 1) % frames.length
    );

  },SLIDE_DURATION);
}

/* ================================================
   BUILD SLIDES
================================================ */

function buildSlides(){

  clearTimeout(slideTimer);

  slider.replaceChildren();

  frames = [];
  currentIndex = 0;

  const validFiles = SLIDE_FILES.filter(file =>
    typeof file === "string" &&
    file.toLowerCase().endsWith(".html") &&
    file.toLowerCase() !== "slider.html"
  );

  if(!validFiles.length){

    showMessage(
      "No HTML promotion files configured.",
      "error"
    );

    return;
  }

  validFiles.forEach((file,index)=>{

    const frame = document.createElement("iframe");

    frame.className = "slide-frame";

    frame.src = "./" + encodeURIComponent(file);

    frame.title = "Rubalia Promotion " + (index + 1);

    frame.loading = "eager";

    frame.setAttribute("scrolling","no");

    frame.setAttribute("allowfullscreen","");

    frame.addEventListener("load",()=>{

      console.log(
        "Rubalia slide loaded:",
        file
      );

    });

    frame.addEventListener("error",()=>{

      console.error(
        "Rubalia slide failed:",
        file
      );

    });

    frames.push(frame);

    slider.appendChild(frame);

  });

  showSlide(0);
}

/* ================================================
   INITIALIZE
================================================ */

function initializeSlider(){

  try{

    buildSlides();

  }catch(error){

    console.error(
      "Rubalia slider initialization error:",
      error
    );

    showMessage(
      "Unable to initialize Rubalia promotions.",
      "error"
    );

  }

}

/* ================================================
   START
================================================ */

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    initializeSlider,
    {once:true}
  );

}else{

  initializeSlider();

}

</script>

</body>
</html>
