
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>Rubalia Promotion Slider</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,sans-serif;
}

.slider{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

.slide-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.slide-frame.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  z-index:2;
}

/* 1. Welcome - Zoom In */
.slide-frame.anim-zoom.active{
  animation:zoomIn 1s cubic-bezier(.2,.7,.3,1) both;
}

@keyframes zoomIn{
  from{
    opacity:0;
    transform:scale(.65);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* 2. Alibaba - Right to Left */
.slide-frame.anim-right.active{
  animation:slideRight .8s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes slideRight{
  from{
    opacity:0;
    transform:translateX(100%);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* 3. Campaign - Bottom to Top */
.slide-frame.anim-up.active{
  animation:slideUp .8s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(100%);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 4. Income - Left to Right */
.slide-frame.anim-left.active{
  animation:slideLeft .8s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes slideLeft{
  from{
    opacity:0;
    transform:translateX(-100%);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* 5. Leader - Fade and Zoom */
.slide-frame.anim-fade.active{
  animation:fadeZoom 1s ease both;
}

@keyframes fadeZoom{
  from{
    opacity:0;
    transform:scale(1.12);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* 6. Media - Top to Bottom */
.slide-frame.anim-down.active{
  animation:slideDown .8s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-100%);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 7. Referral - Right with Zoom */
.slide-frame.anim-right-zoom.active{
  animation:rightZoom .9s cubic-bezier(.2,.7,.3,1) both;
}

@keyframes rightZoom{
  from{
    opacity:0;
    transform:translateX(70%) scale(.85);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
  }
}

.loading,.error{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  text-align:center;
  padding:12px;
  background:linear-gradient(
    120deg,
    #24112f,
    #4b104f,
    #a51e43
  );
}

@media(prefers-reduced-motion:reduce){
  .slide-frame.active{
    animation:none!important;
  }
}
</style>
</head>

<body>

<div class="slider" id="slider">
  <div class="loading">
    Loading all Rubalia promotions...
  </div>
</div>

<script>
"use strict";

/* ================================================
   RUBALIA NETWORK PROMOTION SLIDER

   প্রতিটি ফাইলের আলাদা অ্যানিমেশন।
   নতুন ফাইল যোগ করতে নিচের তালিকায় যোগ করো।
================================================ */

const SLIDE_FILES = [
  {file:"a.html", animation:"anim-zoom"},
  {file:"alibaba.html", animation:"anim-right"},
  {file:"campain.html", animation:"anim-up"},
  {file:"income.html", animation:"anim-left"},
  {file:"leader.html", animation:"anim-fade"},
  {file:"media.html", animation:"anim-down"},
  {file:"reffer.html", animation:"anim-right-zoom"}
];

const SLIDE_DURATION = 4000;

const slider = document.getElementById("slider");

let frames = [];
let currentIndex = 0;
let slideTimer = null;

/* ================================================
   SHOW MESSAGE
================================================ */

function showMessage(message, className = "loading"){

  clearTimeout(slideTimer);

  slider.replaceChildren();

  const box = document.createElement("div");

  box.className = className;
  box.textContent = message;

  slider.appendChild(box);
}

/* ================================================
   SHOW SLIDE
================================================ */

function showSlide(index){

  if(!frames.length) return;

  currentIndex = (index + frames.length) % frames.length;

  frames.forEach((frame,i)=>{

    const active = i === currentIndex;

    frame.classList.toggle("active",active);

    if(!active){
      frame.style.zIndex = "1";
    }else{
      frame.style.zIndex = "2";
    }

  });

  clearTimeout(slideTimer);

  slideTimer = setTimeout(()=>{

    showSlide(
      (currentIndex + 1) % frames.length
    );

  },SLIDE_DURATION);
}

/* ================================================
   BUILD SLIDES
================================================ */

function buildSlides(){

  clearTimeout(slideTimer);

  slider.replaceChildren();

  frames = [];
  currentIndex = 0;

  const validSlides = SLIDE_FILES.filter(item =>
    item &&
    typeof item.file === "string" &&
    item.file.toLowerCase().endsWith(".html") &&
    item.file.toLowerCase() !== "slider.html"
  );

  if(!validSlides.length){

    showMessage(
      "No HTML promotion files configured.",
      "error"
    );

    return;
  }

  validSlides.forEach((item,index)=>{

    const frame = document.createElement("iframe");

    frame.className = "slide-frame " + item.animation;

    frame.src = "./" + encodeURIComponent(item.file);

    frame.title = "Rubalia Promotion " + (index + 1);

    frame.loading = "eager";

    frame.setAttribute("scrolling","no");

    frame.setAttribute("allowfullscreen","");

    frame.addEventListener("load",()=>{

      console.log(
        "Rubalia slide loaded:",
        item.file
      );

    });

    frame.addEventListener("error",()=>{

      console.error(
        "Rubalia slide failed:",
        item.file
      );

    });

    frames.push(frame);

    slider.appendChild(frame);

  });

  /* প্রথমে a.html Zoom In হবে */
  showSlide(0);
}

/* ================================================
   INITIALIZE
================================================ */

function initializeSlider(){

  try{

    buildSlides();

  }catch(error){

    console.error(
      "Rubalia slider initialization error:",
      error
    );

    showMessage(
      "Unable to initialize Rubalia promotions.",
      "error"
    );

  }

}

/* ================================================
   START
================================================ */

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    initializeSlider,
    {once:true}
  );

}else{

  initializeSlider();

}

</script>

</body>
</html>
