<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a35">
<title>Rubalia Promotion Slider</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,sans-serif;
}

.slider{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

.slide-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  opacity:0;
  visibility:hidden;
  transition:opacity .6s ease;
}

.slide-frame.active{
  opacity:1;
  visibility:visible;
}

.loading,.error{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  text-align:center;
  padding:12px;
  background:linear-gradient(120deg,#24112f,#4b104f,#a51e43);
}
</style>
</head>

<body>

<div class="slider" id="slider">
  <div class="loading">Loading Rubalia promotions...</div>
</div>

<script>
"use strict";

/*
  RUBALIA PROMOTION SLIDER
  Files must be in the same folder:
  alibaba.html
  welcome.html
  reffer.html
*/

const SLIDES = [
  {file:"./alibaba.html", duration:4000},
  {file:"./welcome.html", duration:4000},
  {file:"./reffer.html", duration:4000}
];

const slider = document.getElementById("slider");

let currentIndex = 0;
let timer = null;
let frames = [];

function showMessage(text,className="loading"){
  clearTimeout(timer);
  slider.replaceChildren();

  const box = document.createElement("div");
  box.className = className;
  box.textContent = text;

  slider.appendChild(box);
}

function showSlide(index){
  if(!frames.length) return;

  currentIndex = index;

  frames.forEach((frame,i)=>{
    frame.classList.toggle("active",i === currentIndex);
  });

  clearTimeout(timer);

  timer = setTimeout(()=>{
    const nextIndex = (currentIndex + 1) % frames.length;
    showSlide(nextIndex);
  },SLIDES[currentIndex].duration);
}

function loadSlides(){
  clearTimeout(timer);
  slider.replaceChildren();
  frames = [];

  SLIDES.forEach((slide,index)=>{
    const frame = document.createElement("iframe");

    frame.className = "slide-frame";
    frame.src = slide.file;
    frame.title = slide.file.replace("./","").replace(".html","");
    frame.loading = "eager";
    frame.setAttribute("scrolling","no");
    frame.setAttribute("allowfullscreen","");

    frame.addEventListener("error",()=>{
      console.error("Could not load slide:",slide.file);
    });

    frames.push(frame);
    slider.appendChild(frame);
  });

  if(frames.length){
    showSlide(0);
  }else{
    showMessage("No promotion slides configured.","error");
  }
}

loadSlides();
</script>

</body>
</html>
