<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21172f">
<title>RUBALIA NETWORK Promotional Slider</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.slider{
  position:relative;width:100%;height:155px;overflow:hidden;
  border-radius:13px;background:transparent;
}
.slide-frame{
  position:absolute;inset:0;width:100%;height:100%;border:0;
  opacity:0;visibility:hidden;transition:opacity .65s ease;
  background:transparent;
}
.slide-frame.active{opacity:1;visibility:visible}
.empty-state{display:none;position:absolute;inset:0}
@media(max-width:600px){.slider{height:125px;border-radius:11px}}
@media(prefers-reduced-motion:reduce){.slide-frame{transition:none}}
</style>
</head>
<body>
<div class="slider" id="rubaliaSlider" aria-label="Promotional slides"></div>

<script>
"use strict";

/*
  ADD YOUR PROMOTIONAL HTML FILES HERE.
  Keep all slide HTML files in this same "slider" folder.
  First slide: welcome.html
  Add more filenames after it, for example:
  "promotion-1.html",
  "promotion-2.html"

  Each HTML file is shown for 6 seconds.
*/
const SLIDE_FILES = [
  "welcome.html"
  // "promotion-1.html",
  // "promotion-2.html"
];

const SLIDE_DURATION = 6000;
const slider = document.getElementById("rubaliaSlider");

let currentIndex = 0;
let timer = null;
let frames = [];

function createSlides(){
  slider.replaceChildren();
  frames = [];

  const validFiles = SLIDE_FILES
    .filter(file => typeof file === "string" && file.trim())
    .map(file => file.trim());

  if(!validFiles.length) return;

  validFiles.forEach(function(file,index){
    const frame = document.createElement("iframe");
    frame.className = "slide-frame";
    frame.title = "Rubalia promotional slide " + (index + 1);
    frame.loading = index === 0 ? "eager" : "lazy";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.src = file;
    frame.setAttribute("allow","autoplay");
    slider.appendChild(frame);
    frames.push(frame);
  });
}

function showSlide(index){
  if(!frames.length) return;

  currentIndex = (index + frames.length) % frames.length;

  frames.forEach(function(frame,i){
    frame.classList.toggle("active",i === currentIndex);
    frame.setAttribute("aria-hidden",i === currentIndex ? "false" : "true");
  });
}

function startSlider(){
  if(timer) clearInterval(timer);
  if(frames.length <= 1) return;

  timer = setInterval(function(){
    showSlide(currentIndex + 1);
  },SLIDE_DURATION);
}

createSlides();

if(frames.length){
  showSlide(0);
  startSlider();
}
</script>
</body>
</html>
