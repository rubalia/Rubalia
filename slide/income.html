<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:12px;overflow-x:hidden;
background:radial-gradient(ellipse at 50% 45%,#51008a88,transparent 60%),linear-gradient(145deg,#090014,#210039 52%,#090014)}
.scene{width:min(100%,1536px);perspective:1400px}
.poster{position:relative;width:100%;isolation:isolate;transform-style:preserve-3d;
border-radius:9px;animation:float3d 6s ease-in-out infinite;
filter:drop-shadow(0 18px 25px #0009) drop-shadow(0 0 13px #b530ff70)}
.poster:before{content:"";position:absolute;inset:-3px;z-index:-1;border-radius:13px;
background:conic-gradient(from 0deg,transparent 0 18%,#ff38d2,#ffd45a,#8c45ff,transparent 52% 70%,#ffd45a,#ff38d2,transparent);
filter:blur(8px);opacity:.82;animation:orbit 7s linear infinite}
.poster:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
background:linear-gradient(112deg,transparent 0 34%,#ffffff00 39%,#ffffff38 45%,#ffdc7820 48%,#ffffff00 54%,transparent 100%);
background-size:230% 100%;mix-blend-mode:screen;opacity:.5;animation:sweep 5.5s ease-in-out infinite}
.poster svg{display:block;width:100%;height:auto;border-radius:8px}
@keyframes float3d{0%,100%{transform:rotateX(0) rotateY(0) translateY(0)}
25%{transform:rotateX(.7deg) rotateY(-.8deg) translateY(-5px)}
50%{transform:rotateX(0) rotateY(.7deg) translateY(-2px)}
75%{transform:rotateX(-.5deg) translateY(-5px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes sweep{0%,12%{background-position:120% 0;opacity:.12}
55%{background-position:-35% 0;opacity:.48}100%{background-position:-35% 0;opacity:.12}}
@media(prefers-reduced-motion:reduce){.poster,.poster:before,.poster:after{animation:none!important}}
</style>
