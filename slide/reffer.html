<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21002f">
<title>Refer &amp; Earn | RUBALIA NETWORK</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#170022;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}
.banner{
  display:block;
  width:100%;
  max-width:1536px;
  height:auto;
  margin:auto;
}
.banner svg{
  display:block;
  width:100%;
  height:auto;
}
</style>
</head>
<body>
<main class="banner">
  <!-- Original uploaded banner embedded inside SVG without visual edits. -->
  <svg xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       viewBox="0 0 1536 512"
       width="1536" height="512"
       role="img"
       aria-label="Rubalia Network Refer and Earn promotional banner">
    <image x="0" y="0" width="1536" height="512"
           preserveAspectRatio="none"
           href="assets/images/refer-banner.webp"
           xlink:href="assets/images/refer-banner.webp"/>
  </svg>
</main>
</body>
</html>
