
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07152f">
<title>RUBALIA GOLD CARD</title>

<style>
:root{
  --navy:#071638;
  --navy2:#102b59;
  --gold:#f4d17a;
  --gold2:#c99b3c;
  --white:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:0;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:transparent;
  color:white;
}

/* CARD BANNER */

.card-only{
  width:100%;
  margin:0;
  padding:0;
  display:block;
}

.slider-wrap{
  width:100%;
  margin:0;
  padding:0;
  perspective:1200px;
  touch-action:pan-y;
}

.card-slider{
  width:100%;
  aspect-ratio:3 / 1;
  position:relative;
  container-type:inline-size;
}

/* MAIN CARD */

.card{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.2,.75,.25,1);
  cursor:pointer;
}

.card.flipped{
  transform:rotateY(180deg);
}

/* CARD FACES */

.card-face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:2cqw;
  border:1px solid rgba(255,220,140,.75);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:
    0 1.5cqw 3cqw rgba(0,0,0,.45),
    inset 0 1px 2px rgba(255,255,255,.2);
}

/* FRONT */

.card-front{
  background:
    repeating-linear-gradient(
      125deg,
      transparent 0px,
      transparent 1.2cqw,
      rgba(93,145,220,.10) 1.4cqw,
      rgba(93,145,220,.10) 1.8cqw
    ),
    radial-gradient(
      circle at 90% 5%,
      #234d8a,
      transparent 48%
    ),
    linear-gradient(
      145deg,
      #101d4a,
      #071332 75%
    );
}

.card-front::before{
  content:"";
  position:absolute;
  width:55%;
  height:55%;
  right:-15%;
  top:-20%;
  transform:rotate(-22deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(90,155,240,.18),
    transparent
  );
}

.card-front::after{
  content:"";
  position:absolute;
  width:40%;
  height:60%;
  left:-15%;
  bottom:-40%;
  border:1px solid rgba(244,209,122,.2);
  border-radius:50%;
}

/* BALANCE */

.front-top{
  position:absolute;
  top:7%;
  left:5%;
  right:5%;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  z-index:2;
}

.balance{
  font-size:clamp(13px,2.5cqw,36px);
  font-weight:900;
  color:#ffe4a0;
  text-shadow:0 2px 5px #000;
  white-space:nowrap;
}

/* CHIP */

.chip-area{
  position:absolute;
  top:29%;
  left:5%;
  display:flex;
  align-items:center;
  gap:2cqw;
  z-index:2;
}

.chip{
  width:8cqw;
  height:10cqw;
  max-height:12%;
  border-radius:1cqw;
  background:
    linear-gradient(
      90deg,
      transparent 47%,
      #a77b25 48%,
      #a77b25 53%,
      transparent 54%
    ),
    linear-gradient(
      0deg,
      transparent 45%,
      #a77b25 46%,
      #a77b25 53%,
      transparent 54%
    ),
    linear-gradient(135deg,#ffe49a,#c48e2d);
  border:1px solid #f9dc8a;
  box-shadow:inset 0 1px 3px rgba(255,255,255,.7);
}

.contactless{
  color:#f5e8c5;
  font-size:4cqw;
  transform:rotate(90deg);
  line-height:1;
}

/* MEMBER ID */

.user-id{
  position:absolute;
  left:5%;
  right:5%;
  top:51%;
  z-index:2;
  color:#f5d27b;
  font-family:Georgia,serif;
  font-size:clamp(13px,2.6cqw,38px);
  font-weight:bold;
  letter-spacing:.35cqw;
  white-space:nowrap;
  text-shadow:
    0 1px 0 #6f4a13,
    0 2px 5px #000;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MEMBER NAME AND DATE */

.front-bottom{
  position:absolute;
  left:5%;
  bottom:7%;
  z-index:2;
  max-width:55%;
}

.user-name{
  font-family:Georgia,serif;
  font-size:clamp(10px,1.9cqw,28px);
  font-weight:bold;
  color:#ffe2a0;
  letter-spacing:.2cqw;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px #000;
}

.created-date{
  margin-top:.8cqw;
  font-size:clamp(7px,1.15cqw,17px);
  color:#e5d6b4;
  letter-spacing:.1cqw;
}

/* CARD BRAND */

.card-brand{
  position:absolute;
  right:5%;
  bottom:8%;
  z-index:2;
  text-align:right;
  font-family:Georgia,serif;
  font-size:clamp(12px,2.3cqw,34px);
  font-weight:bold;
  color:#f8d47f;
  text-shadow:0 2px 5px #000;
}

/* BACK */

.card-back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(
      125deg,
      transparent 0px,
      transparent 1.2cqw,
      rgba(93,145,220,.08) 1.4cqw,
      rgba(93,145,220,.08) 1.8cqw
    ),
    linear-gradient(
      145deg,
      #102650,
      #07132e
    );
}

/* MAGNETIC STRIP */

.magnetic-strip{
  position:absolute;
  top:15%;
  left:0;
  width:100%;
  height:17%;
  background:linear-gradient(
    90deg,
    #080b13,
    #252936,
    #080b13
  );
}

/* SIGNATURE */

.signature-area{
  position:absolute;
  top:43%;
  left:5%;
  width:42%;
  height:15%;
  background:repeating-linear-gradient(
    0deg,
    #eee9db 0px,
    #eee9db 3px,
    #d4d0c6 4px
  );
  border-radius:.7cqw;
  display:flex;
  align-items:center;
  padding:0 1.5cqw;
  color:#28304b;
  font-family:Georgia,serif;
  font-size:clamp(8px,1.5cqw,22px);
  font-style:italic;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.back-brand{
  position:absolute;
  right:5%;
  top:43%;
  color:#f2d18a;
  font-family:Georgia,serif;
  font-size:clamp(12px,2.3cqw,34px);
  font-weight:bold;
}

/* BACK MEMBER ID */

.back-id{
  position:absolute;
  top:65%;
  left:5%;
  right:5%;
  font-size:clamp(8px,1.4cqw,20px);
  color:#e8cf91;
  letter-spacing:.2cqw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ACTION BUTTONS */

.card-actions{
  position:absolute;
  bottom:7%;
  left:5%;
  right:5%;
  display:flex;
  gap:1.5cqw;
  z-index:3;
}

.action-btn{
  flex:1;
  height:12%;
  min-height:23px;
  border:1px solid rgba(255,220,150,.65);
  border-radius:1cqw;
  background:linear-gradient(
    135deg,
    #eac66d,
    #a87925
  );
  color:#18203a;
  font-size:clamp(9px,1.5cqw,22px);
  font-weight:900;
  letter-spacing:.2cqw;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.action-btn:active{
  transform:scale(.97);
}

/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>

<div class="card-only">

  <section class="slider-wrap">

    <div class="card-slider">

      <div class="card" id="memberCard">

        <!-- FRONT SIDE -->

        <div class="card-face card-front">

          <div class="front-top">
            <div class="balance" id="cardBalance">
              ৳ 0.00
            </div>
          </div>

          <div class="chip-area">
            <div class="chip"></div>
            <div class="contactless">)))</div>
          </div>

          <div class="user-id" id="cardUserId">
            20240101 000000
          </div>

          <div class="front-bottom">

            <div class="user-name" id="cardName">
              MEMBER NAME
            </div>

            <div class="created-date" id="cardDate">
              ACCOUNT CREATED: --
            </div>

          </div>

          <div class="card-brand">
            Rubalia Gold
          </div>

        </div>

        <!-- BACK SIDE -->

        <div class="card-face card-back">

          <div class="magnetic-strip"></div>

          <div class="signature-area" id="backSignature">
            RUBALIA MEMBER
          </div>

          <div class="back-brand">
            Rubalia Gold
          </div>

          <div class="back-id" id="backMemberId">
            MEMBER ID: 20240101 000000
          </div>

          <div class="card-actions">

            <button
              class="action-btn"
              type="button"
              id="depositBtn">
              DEPOSIT
            </button>

            <button
              class="action-btn"
              type="button"
              id="withdrawBtn">
              WITHDRAW
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

</div>

<script>
"use strict";

/*
  RUBALIA MEMBER CARD

  User information:
  sessionStorage key: rubalia_user

  Supported fields:
  fullName / full_name / name
  memberId / member_id / username / id
  createdAt / created_at
  balance / walletBalance / wallet_balance
  availableBalance / available_balance
*/

const card = document.getElementById("memberCard");

const cardName = document.getElementById("cardName");
const cardUserId = document.getElementById("cardUserId");
const cardDate = document.getElementById("cardDate");
const cardBalance = document.getElementById("cardBalance");

const backSignature = document.getElementById("backSignature");
const backMemberId = document.getElementById("backMemberId");

let isFlipped = false;

/* FORMAT DATE */

function formatDate(value){

  if(!value) return "--";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

}

/* FORMAT BALANCE */

function formatBalance(value){

  const amount = Number(value);

  if(!Number.isFinite(amount)){
    return "৳ 0.00";
  }

  return "৳ " + amount.toLocaleString("en-BD",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}

/* GET USER */

function getCurrentUser(){

  try{

    const raw = sessionStorage.getItem("rubalia_user");

    if(!raw) return null;

    const user = JSON.parse(raw);

    return user && typeof user === "object"
      ? user
      : null;

  }catch(error){

    console.error("User data loading error:",error);

    return null;

  }

}

/* LOAD CARD INFORMATION */

function loadMemberCard(){

  const user = getCurrentUser();

  if(!user){

    cardName.textContent = "MEMBER NAME";

    cardUserId.textContent = "20240101 000000";

    backSignature.textContent = "RUBALIA MEMBER";

    backMemberId.textContent =
      "MEMBER ID: 20240101 000000";

    cardDate.textContent = "ACCOUNT CREATED: --";

    cardBalance.textContent = "৳ 0.00";

    return;

  }

  const fullName =
    user.fullName ||
    user.full_name ||
    user.name ||
    "RUBALIA MEMBER";

  const memberId =
    user.memberId ||
    user.member_id ||
    user.username ||
    user.id ||
    "000000";

  const createdAt =
    user.createdAt ||
    user.created_at ||
    user.created_at_date ||
    user.createdAtDate ||
    null;

  const balance =
    user.balance ??
    user.walletBalance ??
    user.wallet_balance ??
    user.availableBalance ??
    user.available_balance ??
    0;

  const formattedId = String(memberId)
    .replace(/^20240101[\s-]*/i,"");

  const displayId = "20240101 " + formattedId;

  cardName.textContent =
    String(fullName).toUpperCase();

  backSignature.textContent =
    String(fullName).toUpperCase();

  cardUserId.textContent = displayId;

  backMemberId.textContent =
    "MEMBER ID: " + displayId;

  cardDate.textContent =
    "ACCOUNT CREATED: " + formatDate(createdAt);

  cardBalance.textContent =
    formatBalance(balance);

}

/* FLIP CARD */

function toggleCard(){

  isFlipped = !isFlipped;

  card.classList.toggle("flipped",isFlipped);

}

card.addEventListener("click",function(event){

  if(event.target.closest("button")) return;

  toggleCard();

});

/* TOUCH SWIPE */

let startX = 0;
let startY = 0;

card.addEventListener("touchstart",function(event){

  const touch = event.changedTouches[0];

  startX = touch.clientX;
  startY = touch.clientY;

},{passive:true});

card.addEventListener("touchend",function(event){

  const touch = event.changedTouches[0];

  const diffX = touch.clientX - startX;
  const diffY = touch.clientY - startY;

  if(
    Math.abs(diffX) > 45 &&
    Math.abs(diffX) > Math.abs(diffY)
  ){

    // Reserved for multiple-card slider navigation.

  }

},{passive:true});

/* DEPOSIT BUTTON */

document.getElementById("depositBtn")
.addEventListener("click",function(event){

  event.stopPropagation();

  window.location.href = "../deposit.html";

});

/* WITHDRAW BUTTON */

document.getElementById("withdrawBtn")
.addEventListener("click",function(event){

  event.stopPropagation();

  window.location.href = "../withdraw.html";

});

/* START */

loadMemberCard();

/* REFRESH USER DATA */

window.addEventListener("pageshow",function(){

  loadMemberCard();

});

window.addEventListener("storage",function(event){

  if(event.key === "rubalia_user"){
    loadMemberCard();
  }

});

</script>

</body>
</html>
