
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07152f">
<title>RUBALIA CARD</title>

<style>
:root{
  --navy:#071638;
  --navy2:#173765;
  --gold:#e9c879;
  --gold2:#b88b39;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
}

/* BANNER AREA */

.card-only{
  width:100%;
  aspect-ratio:3/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.slider-wrap{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1200px;
}

/* CARD SIZE */

.card-slider{
  height:86%;
  width:auto;
  aspect-ratio:1.586/1;
  max-width:94%;
  position:relative;
  container-type:inline-size;
}

/* CARD */

.card{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.75,.25,1);
  cursor:pointer;
}

.card.flipped{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:5%;
  border:1px solid rgba(230,205,145,.55);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:
    0 3cqw 6cqw rgba(0,0,0,.4),
    inset 0 1px 2px rgba(255,255,255,.15);
}

/* FRONT */

.card-front{
  background:
    radial-gradient(circle at 85% 5%,rgba(70,125,190,.5),transparent 45%),
    repeating-linear-gradient(
      130deg,
      transparent 0,
      transparent 2cqw,
      rgba(120,170,220,.045) 2.2cqw,
      rgba(120,170,220,.045) 2.7cqw
    ),
    linear-gradient(145deg,#142e58,#07152f 75%);
}

/* LIGHT REFLECTION */

.card-front::before{
  content:"";
  position:absolute;
  width:70%;
  height:45%;
  top:-20%;
  right:-20%;
  transform:rotate(-25deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.09),
    transparent
  );
}

/* BALANCE */

.front-top{
  position:absolute;
  top:7%;
  left:6%;
  right:6%;
  display:flex;
  justify-content:flex-end;
  z-index:2;
}

.balance{
  font-size:6cqw;
  font-weight:500;
  color:#fff0c3;
  letter-spacing:.1cqw;
  text-shadow:0 2px 4px #000;
  white-space:nowrap;
}

/* CHIP */

.chip-area{
  position:absolute;
  top:32%;
  left:6%;
  display:flex;
  align-items:center;
  gap:3cqw;
  z-index:2;
}

.chip{
  width:15cqw;
  height:11cqw;
  border-radius:2cqw;
  background:
    linear-gradient(90deg,transparent 47%,#a77b25 48%,#a77b25 53%,transparent 54%),
    linear-gradient(0deg,transparent 45%,#a77b25 46%,#a77b25 53%,transparent 54%),
    linear-gradient(135deg,#fff0ad,#c69a45);
  border:1px solid #e8cb82;
  box-shadow:inset 0 1px 3px rgba(255,255,255,.6);
}

.contactless{
  font-size:10cqw;
  color:#e9e4d3;
  transform:rotate(90deg);
  line-height:1;
}

/* MEMBER ID */

.user-id{
  position:absolute;
  top:55%;
  left:6%;
  right:5%;
  z-index:2;
  font-family:Arial,Helvetica,sans-serif;
  font-size:5.3cqw;
  font-weight:400;
  letter-spacing:.55cqw;
  color:#f5d88d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 3px #000;
}

/* NAME AND DATE */

.front-bottom{
  position:absolute;
  bottom:8%;
  left:6%;
  z-index:2;
  max-width:65%;
}

.user-name{
  font-size:3.7cqw;
  font-weight:500;
  font-family:Arial,Helvetica,sans-serif;
  letter-spacing:.35cqw;
  color:#f5e6bf;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.created-date{
  margin-top:1.5cqw;
  font-size:2.6cqw;
  font-weight:400;
  color:#c4cfe0;
  letter-spacing:.12cqw;
  white-space:nowrap;
}

/* CARD BRAND */

.card-brand{
  position:absolute;
  right:6%;
  bottom:8%;
  font-family:Arial,Helvetica,sans-serif;
  font-size:6cqw;
  font-weight:600;
  font-style:italic;
  color:#f0d58e;
  letter-spacing:-.2cqw;
  z-index:2;
}

/* BACK */

.card-back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(
      130deg,
      transparent 0,
      transparent 2cqw,
      rgba(120,170,220,.04) 2.2cqw,
      rgba(120,170,220,.04) 2.7cqw
    ),
    linear-gradient(145deg,#142e58,#07152f);
}

/* MAGNETIC STRIP */

.magnetic-strip{
  position:absolute;
  top:14%;
  left:0;
  width:100%;
  height:19%;
  background:linear-gradient(
    90deg,#080b13,#30333d,#080b13
  );
}

/* SIGNATURE */

.signature-area{
  position:absolute;
  top:43%;
  left:6%;
  width:48%;
  height:15%;
  border-radius:1cqw;
  background:repeating-linear-gradient(
    0deg,#eee9db 0,#eee9db 3px,#d4d0c6 4px
  );
  color:#28304b;
  display:flex;
  align-items:center;
  padding:0 2cqw;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:3.5cqw;
  overflow:hidden;
  white-space:nowrap;
}

/* BACK BRAND */

.back-brand{
  position:absolute;
  top:44%;
  right:6%;
  color:#e9d59e;
  font-size:5.5cqw;
  font-style:italic;
  font-weight:600;
}

/* BACK ID */

.back-id{
  position:absolute;
  top:66%;
  left:6%;
  right:6%;
  color:#d9c58f;
  font-size:2.8cqw;
  letter-spacing:.15cqw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ACTION BUTTONS */

.card-actions{
  position:absolute;
  bottom:7%;
  left:6%;
  right:6%;
  display:flex;
  gap:2cqw;
}

.action-btn{
  flex:1;
  height:13%;
  min-height:20px;
  border:1px solid rgba(255,220,150,.55);
  border-radius:1cqw;
  background:linear-gradient(135deg,#e9d18c,#b88b39);
  color:#18243b;
  font-size:3cqw;
  font-weight:600;
  letter-spacing:.2cqw;
  cursor:pointer;
}

.action-btn:active{
  transform:scale(.97);
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="card-only">

  <section class="slider-wrap">

    <div class="card-slider">

      <div class="card" id="memberCard">

        <!-- FRONT -->

        <div class="card-face card-front">

          <div class="front-top">
            <div class="balance" id="cardBalance">
              ৳ 0.00
            </div>
          </div>

          <div class="chip-area">
            <div class="chip"></div>
            <div class="contactless">)))</div>
          </div>

          <div class="user-id" id="cardUserId">
            20240101 000000
          </div>

          <div class="front-bottom">

            <div class="user-name" id="cardName">
              MEMBER NAME
            </div>

            <div class="created-date" id="cardDate">
              ACCOUNT CREATED: --
            </div>

          </div>

          <div class="card-brand">
            RUBALIA
          </div>

        </div>

        <!-- BACK -->

        <div class="card-face card-back">

          <div class="magnetic-strip"></div>

          <div class="signature-area" id="backSignature">
            RUBALIA MEMBER
          </div>

          <div class="back-brand">
            RUBALIA
          </div>

          <div class="back-id" id="backMemberId">
            MEMBER ID: 20240101 000000
          </div>

          <div class="card-actions">

            <button
              class="action-btn"
              type="button"
              id="depositBtn">
              DEPOSIT
            </button>

            <button
              class="action-btn"
              type="button"
              id="withdrawBtn">
              WITHDRAW
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

</div>

<script>
"use strict";

/* ELEMENTS */

const card = document.getElementById("memberCard");

const cardName = document.getElementById("cardName");
const cardUserId = document.getElementById("cardUserId");
const cardDate = document.getElementById("cardDate");
const cardBalance = document.getElementById("cardBalance");

const backSignature = document.getElementById("backSignature");
const backMemberId = document.getElementById("backMemberId");

let isFlipped = false;

/* DATE FORMAT */

function formatDate(value){

  if(!value) return "--";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

}

/* BALANCE FORMAT */

function formatBalance(value){

  const amount = Number(value);

  if(!Number.isFinite(amount)){
    return "৳ 0.00";
  }

  return "৳ " + amount.toLocaleString("en-BD",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}

/* GET USER */

function getCurrentUser(){

  try{

    const raw = sessionStorage.getItem("rubalia_user");

    if(!raw) return null;

    const user = JSON.parse(raw);

    return user && typeof user === "object"
      ? user
      : null;

  }catch(error){

    console.error("User data error:",error);

    return null;

  }

}

/* LOAD MEMBER INFORMATION */

function loadMemberCard(){

  const user = getCurrentUser();

  if(!user){

    cardName.textContent = "MEMBER NAME";
    cardUserId.textContent = "20240101 000000";

    backSignature.textContent = "RUBALIA MEMBER";

    backMemberId.textContent =
      "MEMBER ID: 20240101 000000";

    cardDate.textContent =
      "ACCOUNT CREATED: --";

    cardBalance.textContent = "৳ 0.00";

    return;

  }

  const fullName =
    user.fullName ||
    user.full_name ||
    user.name ||
    "RUBALIA MEMBER";

  const memberId =
    user.memberId ||
    user.member_id ||
    user.username ||
    user.id ||
    "000000";

  const createdAt =
    user.createdAt ||
    user.created_at ||
    user.created_at_date ||
    user.createdAtDate ||
    null;

  const balance =
    user.balance ??
    user.walletBalance ??
    user.wallet_balance ??
    user.availableBalance ??
    user.available_balance ??
    0;

  const formattedId = String(memberId)
    .replace(/^20240101[\s-]*/i,"");

  const displayId = "20240101 " + formattedId;

  cardName.textContent =
    String(fullName).toUpperCase();

  backSignature.textContent =
    String(fullName).toUpperCase();

  cardUserId.textContent = displayId;

  backMemberId.textContent =
    "MEMBER ID: " + displayId;

  cardDate.textContent =
    "ACCOUNT CREATED: " + formatDate(createdAt);

  cardBalance.textContent =
    formatBalance(balance);

}

/* FLIP */

function toggleCard(){

  isFlipped = !isFlipped;

  card.classList.toggle("flipped",isFlipped);

}

card.addEventListener("click",function(event){

  if(event.target.closest("button")) return;

  toggleCard();

});

/* DEPOSIT */

document.getElementById("depositBtn")
.addEventListener("click",function(event){

  event.stopPropagation();

  window.location.href = "../deposit.html";

});

/* WITHDRAW */

document.getElementById("withdrawBtn")
.addEventListener("click",function(event){

  event.stopPropagation();

  window.location.href = "../withdraw.html";

});

/* LOAD */

loadMemberCard();

/* PAGE REFRESH */

window.addEventListener("pageshow",function(){

  loadMemberCard();

});

/* STORAGE UPDATE */

window.addEventListener("storage",function(event){

  if(event.key === "rubalia_user"){
    loadMemberCard();
  }

});

</script>

</body>
</html>
```
