
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07152f">
<title>RUBALIA CARD</title>

<style>
:root{
  --gold:#f4d17a;
  --gold2:#c99b3c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}

/* BANNER */

.card-only{
  position:relative;
  width:100%;
  height:100%;
  aspect-ratio:3/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* CARD CENTER POSITION */

.slider-wrap{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1200px;
}

/* CARD SIZE - SCREENSHOT MATCH */

.card-slider{
  position:relative;
  width:57.5%;
  height:100%;
  flex-shrink:0;
  container-type:inline-size;
}

/* MAIN CARD */

.card{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.75,.25,1);
  cursor:pointer;
}

.card.flipped{
  transform:rotateY(180deg);
}

/* CARD FACES */

.card-face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:5%;
  border:1px solid rgba(255,220,140,.65);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:
    0 3cqw 6cqw rgba(0,0,0,.4),
    inset 0 1px 2px rgba(255,255,255,.15);
}

/* FRONT DESIGN */

.card-front{
  background:
    repeating-linear-gradient(
      125deg,
      transparent 0,
      transparent 2cqw,
      rgba(93,145,220,.08) 2.2cqw,
      rgba(93,145,220,.08) 2.7cqw
    ),
    radial-gradient(
      circle at 90% 5%,
      #234d8a,
      transparent 48%
    ),
    linear-gradient(
      145deg,
      #101d4a,
      #071332 75%
    );
}

.card-front::before{
  content:"";
  position:absolute;
  width:80%;
  height:45%;
  right:-25%;
  top:-15%;
  transform:rotate(-22deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(90,155,240,.16),
    transparent
  );
}

/* BALANCE */

.front-top{
  position:absolute;
  top:8%;
  left:6%;
  right:6%;
  display:flex;
  justify-content:flex-end;
  z-index:2;
}

.balance{
  font-size:6cqw;
  font-weight:600;
  color:#ffe4a0;
  letter-spacing:.1cqw;
  white-space:nowrap;
  text-shadow:0 2px 4px #000;
}

/* CHIP */

.chip-area{
  position:absolute;
  top:32%;
  left:6%;
  display:flex;
  align-items:center;
  gap:3cqw;
  z-index:2;
}

.chip{
  width:15cqw;
  height:11cqw;
  border-radius:2cqw;
  background:
    linear-gradient(
      90deg,
      transparent 47%,
      #a77b25 48%,
      #a77b25 53%,
      transparent 54%
    ),
    linear-gradient(
      0deg,
      transparent 45%,
      #a77b25 46%,
      #a77b25 53%,
      transparent 54%
    ),
    linear-gradient(
      135deg,
      #ffe49a,
      #c48e2d
    );
  border:1px solid #f9dc8a;
  box-shadow:inset 0 1px 3px rgba(255,255,255,.7);
}

.contactless{
  color:#f5e8c5;
  font-size:10cqw;
  transform:rotate(90deg);
  line-height:1;
}

/* MEMBER ID */

.user-id{
  position:absolute;
  left:6%;
  right:5%;
  top:58%;
  z-index:2;
  color:#f5d27b;
  font-family:Georgia,serif;
  font-size:5.5cqw;
  font-weight:500;
  letter-spacing:.4cqw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px #000;
}

/* MEMBER NAME AND DATE */

.front-bottom{
  position:absolute;
  left:6%;
  bottom:8%;
  z-index:2;
  max-width:65%;
}

.user-name{
  font-family:Georgia,serif;
  font-size:3.7cqw;
  font-weight:600;
  color:#ffe2a0;
  letter-spacing:.3cqw;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.created-date{
  margin-top:1.5cqw;
  font-size:2.6cqw;
  font-weight:400;
  color:#e5d6b4;
  letter-spacing:.1cqw;
  white-space:nowrap;
}

/* RUBALIA BRAND */

.card-brand{
  position:absolute;
  right:6%;
  bottom:8%;
  z-index:2;
  font-family:Georgia,serif;
  font-size:6cqw;
  font-weight:bold;
  font-style:italic;
  color:#f8d47f;
  text-shadow:0 2px 4px #000;
}

/* BACK DESIGN */

.card-back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(
      125deg,
      transparent 0,
      transparent 2cqw,
      rgba(93,145,220,.06) 2.2cqw,
      rgba(93,145,220,.06) 2.7cqw
    ),
    linear-gradient(
      145deg,
      #102650,
      #07132e
    );
}

/* MAGNETIC STRIP */

.magnetic-strip{
  position:absolute;
  top:14%;
  left:0;
  width:100%;
  height:19%;
  background:linear-gradient(
    90deg,
    #080b13,
    #252936,
    #080b13
  );
}

/* SIGNATURE */

.signature-area{
  position:absolute;
  top:44%;
  left:6%;
  width:48%;
  height:15%;
  background:repeating-linear-gradient(
    0deg,
    #eee9db 0,
    #eee9db 3px,
    #d4d0c6 4px
  );
  border-radius:1cqw;
  display:flex;
  align-items:center;
  padding:0 2cqw;
  color:#28304b;
  font-family:Georgia,serif;
  font-size:3.5cqw;
  font-style:italic;
  overflow:hidden;
  white-space:nowrap;
}

/* BACK BRAND */

.back-brand{
  position:absolute;
  right:6%;
  top:44%;
  color:#f2d18a;
  font-family:Georgia,serif;
  font-size:6cqw;
  font-weight:bold;
  font-style:italic;
}

/* BACK MEMBER ID */

.back-id{
  position:absolute;
  top:68%;
  left:6%;
  right:6%;
  font-size:2.8cqw;
  color:#e8cf91;
  letter-spacing:.15cqw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){
  .card{
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="card-only">

  <section class="slider-wrap">

    <div class="card-slider">

      <div class="card" id="memberCard">

        <!-- FRONT SIDE -->

        <div class="card-face card-front">

          <div class="front-top">
            <div class="balance" id="cardBalance">
              ৳ 0.00
            </div>
          </div>

          <div class="chip-area">
            <div class="chip"></div>
            <div class="contactless">)))</div>
          </div>

          <div class="user-id" id="cardUserId">
            20240101 000000
          </div>

          <div class="front-bottom">

            <div class="user-name" id="cardName">
              MEMBER NAME
            </div>

            <div class="created-date" id="cardDate">
              ACCOUNT CREATED: --
            </div>

          </div>

          <div class="card-brand">
            RUBALIA
          </div>

        </div>

        <!-- BACK SIDE -->

        <div class="card-face card-back">

          <div class="magnetic-strip"></div>

          <div class="signature-area" id="backSignature">
            RUBALIA MEMBER
          </div>

          <div class="back-brand">
            RUBALIA
          </div>

          <div class="back-id" id="backMemberId">
            MEMBER ID: 20240101 000000
          </div>

        </div>

      </div>

    </div>

  </section>

</div>

<script>
"use strict";

/* ELEMENTS */

const card = document.getElementById("memberCard");

const cardName = document.getElementById("cardName");
const cardUserId = document.getElementById("cardUserId");
const cardDate = document.getElementById("cardDate");
const cardBalance = document.getElementById("cardBalance");

const backSignature = document.getElementById("backSignature");
const backMemberId = document.getElementById("backMemberId");

let isFlipped = false;

/* FORMAT DATE */

function formatDate(value){

  if(!value) return "--";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

}

/* FORMAT BALANCE */

function formatBalance(value){

  const amount = Number(value);

  if(!Number.isFinite(amount)){
    return "৳ 0.00";
  }

  return "৳ " + amount.toLocaleString("en-BD",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}

/* GET CURRENT USER */

function getCurrentUser(){

  try{

    const raw = sessionStorage.getItem("rubalia_user");

    if(!raw) return null;

    const user = JSON.parse(raw);

    return user && typeof user === "object"
      ? user
      : null;

  }catch(error){

    console.error("User data loading error:",error);

    return null;

  }

}

/* LOAD MEMBER CARD INFORMATION */

function loadMemberCard(){

  const user = getCurrentUser();

  if(!user){

    cardName.textContent = "MEMBER NAME";

    cardUserId.textContent = "20240101 000000";

    backSignature.textContent = "RUBALIA MEMBER";

    backMemberId.textContent =
      "MEMBER ID: 20240101 000000";

    cardDate.textContent =
      "ACCOUNT CREATED: --";

    cardBalance.textContent = "৳ 0.00";

    return;

  }

  const fullName =
    user.fullName ||
    user.full_name ||
    user.name ||
    "RUBALIA MEMBER";

  const memberId =
    user.memberId ||
    user.member_id ||
    user.username ||
    user.id ||
    "000000";

  const createdAt =
    user.createdAt ||
    user.created_at ||
    user.created_at_date ||
    user.createdAtDate ||
    null;

  const balance =
    user.balance ??
    user.walletBalance ??
    user.wallet_balance ??
    user.availableBalance ??
    user.available_balance ??
    0;

  const formattedId = String(memberId)
    .replace(/^20240101[\s-]*/i,"");

  const displayId = "20240101 " + formattedId;

  cardName.textContent =
    String(fullName).toUpperCase();

  backSignature.textContent =
    String(fullName).toUpperCase();

  cardUserId.textContent = displayId;

  backMemberId.textContent =
    "MEMBER ID: " + displayId;

  cardDate.textContent =
    "ACCOUNT CREATED: " + formatDate(createdAt);

  cardBalance.textContent =
    formatBalance(balance);

}

/* FLIP ONLY */

card.addEventListener("click",function(){

  isFlipped = !isFlipped;

  card.classList.toggle("flipped",isFlipped);

});

/* INITIAL LOAD */

loadMemberCard();

/* PAGE RESTORE */

window.addEventListener("pageshow",function(){

  loadMemberCard();

});

/* STORAGE UPDATE */

window.addEventListener("storage",function(event){

  if(event.key === "rubalia_user"){
    loadMemberCard();
  }

});

</script>

</body>
</html>
