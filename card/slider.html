<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07152f">
<title>Rubalia Card Slider</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:transparent;
  color:white;
}

.slider-section{
  width:100%;
  padding:12px 10px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

.slider-heading{
  width:100%;
  text-align:center;
  margin-bottom:12px;
}

.slider-heading h2{
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
  color:#f4d17a;
}

.slider-heading p{
  margin-top:5px;
  font-size:9px;
  color:#aebbd4;
  letter-spacing:1px;
}

.slider-container{
  width:100%;
  max-width:430px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:pan-y;
}

.card-frame{
  width:100%;
  height:210px;
  border:0;
  display:block;
  background:transparent;
  overflow:hidden;
}

/* NAVIGATION */

.slider-nav{
  width:100%;
  max-width:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin-top:5px;
}

.nav-btn{
  width:29px;
  height:29px;
  border-radius:50%;
  border:1px solid rgba(244,209,122,.55);
  background:linear-gradient(145deg,#172d50,#07152f);
  color:#f4d17a;
  font-size:16px;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.nav-btn:active{
  transform:scale(.92);
}

.dots{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:20px;
  background:#64718b;
  transition:.3s;
}

.dot.active{
  width:18px;
  background:#f4d17a;
}

.slider-footer{
  margin-top:9px;
  font-size:9px;
  letter-spacing:1px;
  color:#9baac5;
  text-align:center;
}

@media(max-width:360px){
  .card-frame{
    height:195px;
  }

  .slider-section{
    padding-left:5px;
    padding-right:5px;
  }
}
</style>
</head>

<body>

<section class="slider-section">

  <header class="slider-heading">
    <h2>MEMBER CARDS</h2>
    <p>YOUR RUBALIA MEMBERSHIP</p>
  </header>

  <div class="slider-container" id="sliderContainer">

    <iframe
      class="card-frame"
      id="cardFrame"
      src="card.html"
      title="Rubalia Member Card"
      loading="eager"
      scrolling="no">
    </iframe>

  </div>

  <div class="slider-nav">

    <button class="nav-btn" id="prevBtn" type="button">
      &#10094;
    </button>

    <div class="dots">
      <span class="dot active"></span>
    </div>

    <button class="nav-btn" id="nextBtn" type="button">
      &#10095;
    </button>

  </div>

  <div class="slider-footer">
    RUBALIA GOLD MEMBER CARD
  </div>

</section>

<script>
"use strict";

/*
  RUBALIA CARD SLIDER

  Source:
  card/card.html

  This slider loads the original card page
  without changing its design or functionality.
*/

const frame = document.getElementById("cardFrame");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const dots = document.querySelectorAll(".dot");

/*
  Current card page.
  Additional card pages can be added here later.
*/

const cardPages = [
  "card.html"
];

let currentIndex = 0;

function loadCard(index){

  if(index < 0 || index >= cardPages.length){
    return;
  }

  currentIndex = index;

  frame.src = cardPages[currentIndex];

  updateSlider();

}

function updateSlider(){

  dots.forEach((dot,index)=>{

    dot.classList.toggle(
      "active",
      index === currentIndex
    );

  });

  prevBtn.disabled = cardPages.length <= 1;
  nextBtn.disabled = cardPages.length <= 1;

}

prevBtn.addEventListener("click",()=>{

  loadCard(currentIndex - 1);

});

nextBtn.addEventListener("click",()=>{

  loadCard(currentIndex + 1);

});

/* SWIPE NAVIGATION */

let startX = 0;
let startY = 0;

const container = document.getElementById("sliderContainer");

container.addEventListener("touchstart",event=>{

  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;

},{passive:true});

container.addEventListener("touchend",event=>{

  const diffX = event.changedTouches[0].clientX - startX;
  const diffY = event.changedTouches[0].clientY - startY;

  if(Math.abs(diffX) > 55 && Math.abs(diffX) > Math.abs(diffY)){

    if(diffX < 0){
      loadCard(currentIndex + 1);
    }else{
      loadCard(currentIndex - 1);
    }

  }

},{passive:true});

updateSlider();

</script>

</body>
</html>
