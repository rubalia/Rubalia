<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#710018">
<meta name="description" content="RUBALIA NETWORK Login">
<title>Login | RUBALIA NETWORK</title>

<style>
:root{
  --red:#d60025;
  --dark:#710018;
  --gold:#ffd36a;
  --white:#ffffff;
  --muted:#77717c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 15%,#ffb33d 0%,transparent 30%),
    radial-gradient(circle at 90% 15%,#ff3c76 0%,transparent 32%),
    radial-gradient(circle at 15% 90%,#7939e9 0%,transparent 35%),
    radial-gradient(circle at 90% 90%,#00b8bd 0%,transparent 35%),
    linear-gradient(135deg,#4c0039,#a50030,#4a087b);
  background-size:200% 200%;
  animation:backgroundMove 12s ease infinite;
}

@keyframes backgroundMove{
  0%{background-position:0% 0%;}
  50%{background-position:100% 100%;}
  100%{background-position:0% 0%;}
}

.background-shape{
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
  opacity:.3;
}

.shape-one{
  width:220px;
  height:220px;
  background:#ffcf45;
  top:-90px;
  left:-80px;
}

.shape-two{
  width:260px;
  height:260px;
  background:#00e0c7;
  bottom:-120px;
  right:-100px;
}

.shape-three{
  width:120px;
  height:120px;
  background:#ff4b8c;
  top:48%;
  right:-70px;
}

/* LOGIN CARD */

.login-container{
  position:relative;
  z-index:2;
  width:100%;
  max-width:410px;
  padding:38px 30px 30px;
  border-radius:25px;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:
    0 25px 80px rgba(35,0,35,.35),
    inset 0 1px 0 white;
  animation:cardEnter .8s ease both;
}

@keyframes cardEnter{
  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* UNIQUE LOGO */

.logo-area{
  text-align:center;
  margin-bottom:29px;
}

.logo-symbol{
  width:88px;
  height:88px;
  margin:0 auto 17px;
  position:relative;
  display:grid;
  place-items:center;
  border-radius:25px;
  background:linear-gradient(145deg,#ff526b,#c50031 55%,#710018);
  border:2px solid #ffd982;
  box-shadow:
    0 8px 0 #76001b,
    0 14px 24px rgba(120,0,30,.24),
    inset 0 3px 8px rgba(255,255,255,.4);
  transform:rotate(-5deg);
}

.logo-symbol::before{
  content:"";
  position:absolute;
  width:48px;
  height:48px;
  border:3px solid #ffe5a1;
  border-radius:14px 14px 14px 4px;
  transform:rotate(45deg);
}

.logo-symbol::after{
  content:"R";
  position:relative;
  z-index:2;
  color:#fff;
  font-size:43px;
  font-weight:1000;
  font-family:Arial,sans-serif;
  text-shadow:0 3px 5px rgba(70,0,0,.4);
}

.logo-name{
  color:#a50024;
  font-size:29px;
  font-weight:1000;
  letter-spacing:4px;
}

.logo-network{
  color:#c18b24;
  font-size:10px;
  font-weight:900;
  letter-spacing:8px;
  padding-left:8px;
  margin-top:5px;
}

.logo-slogan{
  margin-top:12px;
  color:#8b8188;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.2px;
}

/* FORM */

.form-heading{
  text-align:center;
  margin-bottom:26px;
}

.form-heading h1{
  font-size:25px;
  color:#3c1725;
  margin-bottom:8px;
}

.form-heading p{
  color:#88818a;
  font-size:13px;
  line-height:1.6;
}

.form-group{
  margin-bottom:19px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#4b2835;
  margin-bottom:9px;
}

.input-wrap{
  position:relative;
}

.form-group input{
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid #eadce1;
  border-radius:11px;
  background:#fffafb;
  font-size:14px;
  font-family:inherit;
  color:#30232a;
  outline:none;
  transition:.25s;
}

.form-group input:focus{
  border-color:#d00032;
  background:white;
  box-shadow:0 0 0 4px rgba(214,0,37,.08);
}

.password-wrap input{
  padding-right:70px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#bd0030;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  padding:8px;
}

.form-options{
  display:flex;
  justify-content:flex-end;
  margin:0 0 22px;
}

.forgot{
  font-size:12px;
  color:#b0002b;
  font-weight:bold;
  text-decoration:none;
}

.forgot:hover{text-decoration:underline;}

/* BUTTON */

.login-btn{
  width:100%;
  height:53px;
  border:0;
  border-radius:11px;
  background:linear-gradient(110deg,#f52c55,#c90032,#81001c);
  color:white;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.2px;
  cursor:pointer;
  box-shadow:
    0 6px 0 #78001b,
    0 10px 18px rgba(190,0,45,.2),
    inset 0 2px 5px rgba(255,255,255,.25);
  transition:.2s;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 0 #78001b,0 13px 22px rgba(190,0,45,.25);
}

.login-btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #78001b;
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* MESSAGE */

.form-message{
  display:none;
  margin-top:17px;
  padding:12px;
  border-radius:9px;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.form-message.error{
  display:block;
  color:#a00025;
  background:#fff0f2;
  border:1px solid #f4c6d0;
}

.form-message.success{
  display:block;
  color:#17633b;
  background:#effaf3;
  border:1px solid #c6ead2;
}

/* REGISTER */

.register-text{
  text-align:center;
  margin-top:25px;
  color:#817983;
  font-size:13px;
}

.register-text a{
  color:#bd0030;
  font-weight:900;
  text-decoration:none;
}

.register-text a:hover{text-decoration:underline;}

.security{
  text-align:center;
  margin-top:25px;
  padding-top:17px;
  border-top:1px solid #f0e5e8;
  color:#9a9299;
  font-size:10px;
  line-height:1.7;
}

.security span{
  color:#b0002b;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:420px){
  body{padding:14px;}

  .login-container{
    padding:31px 22px 25px;
    border-radius:21px;
  }

  .logo-symbol{
    width:78px;
    height:78px;
  }

  .logo-symbol::before{
    width:43px;
    height:43px;
  }

  .logo-symbol::after{font-size:38px;}

  .logo-name{font-size:26px;}

  .form-heading h1{font-size:23px;}
}

@media(max-height:700px){
  .login-container{
    padding-top:23px;
    padding-bottom:20px;
  }

  .logo-area{margin-bottom:19px;}

  .logo-symbol{
    width:68px;
    height:68px;
    margin-bottom:12px;
  }

  .logo-symbol::before{
    width:38px;
    height:38px;
  }

  .logo-symbol::after{font-size:34px;}

  .form-heading{margin-bottom:19px;}

  .security{margin-top:17px;padding-top:12px;}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="background-shape shape-one"></div>
<div class="background-shape shape-two"></div>
<div class="background-shape shape-three"></div>

<main class="login-container">

  <div class="logo-area">

    <div class="logo-symbol"></div>

    <div class="logo-name">RUBALIA</div>

    <div class="logo-network">NETWORK</div>

    <div class="logo-slogan">
      SHOP SMART. EARN TOGETHER.
    </div>

  </div>

  <div class="form-heading">
    <h1>Welcome Back</h1>
    <p>Sign in to your RUBALIA account</p>
  </div>

  <form id="loginForm">

    <div class="form-group">
      <label for="email">Email Address</label>

      <div class="input-wrap">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          maxlength="255"
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <div class="input-wrap password-wrap">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>

        <button
          type="button"
          class="show-password"
          id="showPassword">
          SHOW
        </button>
      </div>
    </div>

    <div class="form-options">
      <a href="forgot-password.html" class="forgot">
        Forgot Password?
      </a>
    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn">
      SIGN IN
    </button>

    <div
      class="form-message"
      id="formMessage"
      role="status"
      aria-live="polite">
    </div>

  </form>

  <div class="register-text">
    New to RUBALIA?
    <a href="register.html">Create Account</a>
  </div>

  <div class="security">
    <span>🔒 SECURE LOGIN</span>
    <br>
    Your password is never saved in browser storage.
  </div>

</main>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const formMessage = document.getElementById("formMessage");
const showPasswordBtn = document.getElementById("showPassword");

/* PASSWORD VISIBILITY */

showPasswordBtn.addEventListener("click",function(){

  const isPassword = passwordInput.type === "password";

  passwordInput.type = isPassword ? "text" : "password";

  showPasswordBtn.textContent = isPassword ? "HIDE" : "SHOW";

});

/* MESSAGE */

function showMessage(type,text){

  formMessage.className = "form-message " + type;
  formMessage.textContent = text;

}

/* LOGIN */

loginForm.addEventListener("submit",async function(event){

  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if(!email || !password){
    showMessage("error","Please enter your email and password.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "PLEASE WAIT...";

  formMessage.className = "form-message";
  formMessage.textContent = "";

  try{

    /* STEP 1: AUTHENTICATE */

    const response = await fetch(API_BASE + "/auth/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        email:email,
        password:password
      })

    });

    const data = await response.json().catch(function(){
      return {};
    });

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Login failed. Please check your email and password."
      );

    }

    if(!data.token){

      throw new Error(
        "The server did not return an authentication token."
      );

    }

    /* STEP 2: SAVE TEMPORARY SESSION */

    try{

      sessionStorage.setItem(
        "rubalia_token",
        data.token
      );

    }catch(storageError){

      throw new Error(
        "Your browser could not save the login session."
      );

    }

    /* STEP 3: VERIFY ROLE FROM BACKEND */

    const verifyResponse = await fetch(API_BASE + "/auth/me",{

      method:"GET",

      headers:{
        "Authorization":"Bearer " + data.token,
        "Accept":"application/json"
      }

    });

    const verifyData = await verifyResponse.json().catch(function(){
      return {};
    });

    if(
      !verifyResponse.ok ||
      !verifyData.success ||
      !verifyData.user
    ){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      throw new Error(
        verifyData.message ||
        "Unable to verify your account. Please try again."
      );

    }

    const user = verifyData.user;

    const role = String(user.role || "")
      .trim()
      .toLowerCase();

    if(!role){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      throw new Error(
        "Your account role could not be verified."
      );

    }

    /* STEP 4: SAVE VERIFIED USER */

    sessionStorage.setItem(
      "rubalia_user",
      JSON.stringify(user)
    );

    /* STEP 5: REDIRECT BY ROLE */

    let destination = "dashboard.html";
    let message = "Welcome! Opening your dashboard...";

    if(role === "admin"){

      destination = "admin-dashboard.html";
      message = "Admin verified! Opening Admin Dashboard...";

    }

    showMessage("success",message);

    loginBtn.textContent = "SUCCESSFUL";

    loginForm.reset();

    window.setTimeout(function(){

      window.location.replace(destination);

    },800);

  }catch(error){

    showMessage(
      "error",
      error.message ||
      "Unable to connect to RUBALIA Server. Please try again."
    );

    loginBtn.disabled = false;
    loginBtn.textContent = "SIGN IN";

  }

});
</script>

</body>
</html>
