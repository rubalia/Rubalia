
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#85000e">
<meta name="description" content="RUBALIA NETWORK Android Application">
<title>RUBALIA NETWORK</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 15%,#ffb33d 0%,transparent 30%),
    radial-gradient(circle at 90% 15%,#ff3c76 0%,transparent 32%),
    radial-gradient(circle at 15% 90%,#7939e9 0%,transparent 35%),
    radial-gradient(circle at 90% 90%,#00b8bd 0%,transparent 35%),
    linear-gradient(135deg,#390005,#85000e,#4a087b);
  background-size:200% 200%;
  animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
  0%,100%{background-position:0% 0%;}
  50%{background-position:100% 100%;}
}

.container{
  width:100%;
  max-width:390px;
  text-align:center;
}

.logo{
  width:112px;
  height:112px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
  border:2px solid #ffe5a1;
  border-radius:29px;
  background:linear-gradient(145deg,#ff5968,#c90018 60%,#76000b);
  box-shadow:
    0 9px 0 #520008,
    0 18px 35px rgba(0,0,0,.4),
    inset 0 3px 9px rgba(255,255,255,.4);
  animation:float 3s ease-in-out infinite;
}

.logo span{
  font-size:57px;
  font-weight:1000;
  color:#fff;
  text-shadow:0 4px 5px rgba(0,0,0,.4);
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

h1{
  font-size:clamp(29px,8vw,39px);
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:2px 4px 8px rgba(0,0,0,.4);
}

.subtitle{
  margin-top:8px;
  color:#ffe5a1;
  font-size:12px;
  font-weight:900;
  letter-spacing:9px;
  padding-left:9px;
}

.line{
  width:100px;
  height:3px;
  margin:23px auto;
  background:linear-gradient(90deg,transparent,#ffd36a,transparent);
}

.slogan{
  color:#fff0e8;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1.5px;
}

.status-card{
  margin-top:35px;
  padding:22px 18px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:17px;
  background:rgba(0,0,0,.2);
  backdrop-filter:blur(12px);
}

.loader{
  width:36px;
  height:36px;
  margin:0 auto 15px;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:#ffd36a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

#status{
  font-size:14px;
  font-weight:900;
}

#message{
  margin-top:9px;
  color:#ffe5df;
  font-size:12px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.progress{
  height:4px;
  margin-top:17px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.2);
}

.progress-bar{
  width:35%;
  height:100%;
  border-radius:10px;
  background:#ffd36a;
  animation:progressMove 1.2s ease-in-out infinite alternate;
}

@keyframes progressMove{
  from{transform:translateX(-100%);}
  to{transform:translateX(285%);}
}

.retry{
  display:none;
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:linear-gradient(110deg,#ffd36a,#ff9db7);
  color:#590013;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}

.error .loader{
  animation:none;
  border:3px solid #ff7777;
}

.error .progress{
  display:none;
}

.footer{
  margin-top:28px;
  color:rgba(255,255,255,.65);
  font-size:10px;
  letter-spacing:1px;
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo">
    <span>R</span>
  </div>

  <h1>RUBALIA</h1>
  <div class="subtitle">NETWORK</div>

  <div class="line"></div>

  <div class="slogan">
    SHOP SMART. EARN TOGETHER.
  </div>

  <section class="status-card" id="statusCard">

    <div class="loader"></div>

    <p id="status">WELCOME TO RUBALIA</p>

    <p id="message">
      Connecting to RUBALIA NETWORK...
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <button class="retry" id="retryButton" onclick="startApplication()">
      TRY AGAIN
    </button>

  </section>

  <div class="footer">
    © <span id="year"></span> RUBALIA NETWORK
  </div>

</main>

<script>
"use strict";

const API_BASE = "https://rubalia.onrender.com/api";

const statusCard = document.getElementById("statusCard");
const statusText = document.getElementById("status");
const messageText = document.getElementById("message");
const retryButton = document.getElementById("retryButton");

document.getElementById("year").textContent =
  new Date().getFullYear();

let checking = false;

function showError(title,message){

  statusCard.classList.add("error");

  statusText.textContent = title;
  messageText.textContent = message;

  retryButton.style.display = "block";

}

function showLoading(title,message){

  statusCard.classList.remove("error");

  statusText.textContent = title;
  messageText.textContent = message;

  retryButton.style.display = "none";

}

async function fetchWithTimeout(url,options={},duration=12000){

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    duration
  );

  try{

    return await fetch(url,{
      ...options,
      cache:"no-store",
      signal:controller.signal
    });

  }finally{

    clearTimeout(timer);

  }

}

/* CHECK INTERNET AND BACKEND */

async function checkServer(){

  if(!navigator.onLine){
    throw new Error("NO_INTERNET");
  }

  const response = await fetchWithTimeout(
    API_BASE + "/health",
    {
      method:"GET",
      headers:{
        "Accept":"application/json"
      }
    }
  );

  if(!response.ok){
    throw new Error("SERVER_UNAVAILABLE");
  }

  return true;

}

/* VERIFY EXISTING LOGIN SESSION */

async function verifySession(){

  const token = sessionStorage.getItem("rubalia_token");

  if(!token){
    return null;
  }

  try{

    const response = await fetchWithTimeout(
      API_BASE + "/auth/me",
      {
        method:"GET",
        headers:{
          "Authorization":"Bearer " + token,
          "Accept":"application/json"
        }
      }
    );

    const data = await response.json().catch(() => ({}));

    if(
      !response.ok ||
      !data.success ||
      !data.user
    ){

      sessionStorage.removeItem("rubalia_token");
      sessionStorage.removeItem("rubalia_user");

      return null;

    }

    sessionStorage.setItem(
      "rubalia_user",
      JSON.stringify(data.user)
    );

    return data.user;

  }catch(error){

    if(error.message === "NO_INTERNET"){
      throw error;
    }

    if(!navigator.onLine){
      throw new Error("NO_INTERNET");
    }

    /*
      If session verification fails,
      do not trust the saved user role.
    */

    sessionStorage.removeItem("rubalia_token");
    sessionStorage.removeItem("rubalia_user");

    return null;

  }

}

/* REDIRECT BY VERIFIED USER ROLE */

function redirectUser(user){

  if(!user){

    window.location.replace("login.html");
    return;

  }

  const role = String(user.role || "")
    .trim()
    .toLowerCase();

  if(role === "admin"){

    window.location.replace("admin-dashboard.html");
    return;

  }

  window.location.replace("dashboard.html");

}

/* START APPLICATION */

async function startApplication(){

  if(checking) return;

  checking = true;

  showLoading(
    "CONNECTING...",
    "Checking internet and server connection."
  );

  try{

    await checkServer();

    showLoading(
      "VERIFYING ACCOUNT...",
      "Checking your RUBALIA account."
    );

    const user = await verifySession();

    showLoading(
      "CONNECTION SUCCESSFUL",
      "Opening RUBALIA NETWORK..."
    );

    setTimeout(function(){

      redirectUser(user);

    },700);

  }catch(error){

    if(!navigator.onLine || error.message === "NO_INTERNET"){

      showError(
        "NO INTERNET CONNECTION",
        "Please turn on mobile data or Wi-Fi to use RUBALIA NETWORK."
      );

    }else{

      showError(
        "SERVER UNAVAILABLE",
        "Unable to connect to RUBALIA server. Please try again."
      );

    }

  }finally{

    checking = false;

  }

}

/* AUTOMATIC RECONNECT */

window.addEventListener("online",function(){

  startApplication();

});

window.addEventListener("offline",function(){

  showError(
    "NO INTERNET CONNECTION",
    "Reconnect to the internet to continue using RUBALIA NETWORK."
  );

});

/* START */

startApplication();

</script>

</body>
</html>
